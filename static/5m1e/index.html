<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>供应商每日 5M1E / LOT 回复看板 | mysqe</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --line:#e3e8ef; --text:#1f2937; --muted:#6b7280;
    --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; --info:#3b82f6; --dark:#111827;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;background:var(--bg);color:var(--text);padding:20px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1280px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
  h1{font-size:21px;font-weight:700;letter-spacing:-.2px}
  .sub{font-size:12.5px;color:var(--muted);margin-top:5px}
  .controls{display:flex;gap:8px;align-items:center}
  select,button{font:inherit;font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);cursor:pointer}
  button:hover{border-color:var(--info)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden}
  .kpi .lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
  .kpi .val{font-size:26px;font-weight:700;line-height:1.1}
  .kpi .foot{font-size:11.5px;color:var(--muted);margin-top:4px}
  .kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--info)}
  .kpi.ok::after{background:var(--ok)} .kpi.warn::after{background:var(--warn)} .kpi.bad::after{background:var(--bad)}
  .kpi.bad .val{color:var(--bad)} .kpi.warn .val{color:var(--warn)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
  .panel h2{font-size:14.5px;padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .panel h2 .count{font-size:12px;font-weight:500;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid #f1f4f8;vertical-align:middle}
  tr.row{cursor:pointer;transition:background .15s}
  tr.row:hover{background:#f8fafc}
  tr.row.open{background:#f8fafc}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
  .tag.ok{background:#e7f8f1;color:#067952}
  .tag.miss{background:#eef1f5;color:#5b6472}
  .tag.chg{background:#fff4e5;color:#b45309}
  .tag.iss{background:#fdecec;color:#b91c1c}
  .tag.none{background:#f3f4f6;color:#9ca3af}
  /* 一闪一闪 */
  @keyframes flashAlert{0%,100%{background:#fffdf5}50%{background:#fff1c2}}
  @keyframes flashIssue{0%,100%{background:#fffafa}50%{background:#ffdcdc}}
  tr.row.alert{animation:flashAlert 1.6s ease-in-out infinite}
  tr.row.issue{animation:flashIssue 1.2s ease-in-out infinite}
  tr.row.miss{background:#f4f5f7;color:#9aa1ab}
  tr.row.miss .code{color:#9aa1ab}
  .bar{display:inline-block;width:3px;height:14px;border-radius:2px;vertical-align:-2px;margin-right:7px}
  .bar.alert{background:var(--warn)} .bar.issue{background:var(--bad)} .bar.miss{background:#c3c9d2}
  .detail{display:none;background:#fbfcfe}
  .detail td{padding:0}
  .detail .inner{padding:12px 16px 16px 32px;font-size:12.5px;line-height:1.7}
  .detail .inner b{font-weight:600}
  .m5e{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .m5e span{font-size:11.5px;padding:2px 9px;border-radius:6px;background:#eef2f7;color:#475569}
  .m5e span.on{background:#ffe4e4;color:#b91c1c;font-weight:600}
  .box{border-left:3px solid var(--warn);background:#fffaf0;padding:9px 12px;border-radius:0 8px 8px 0;margin-top:8px}
  .box.bad{border-color:var(--bad);background:#fff7f7}
  .empty{padding:16px;font-size:13px;color:var(--muted)}
  .demo{background:#fff4e5;border:1px solid #fcd9a4;color:#8a5300;font-size:12px;padding:8px 12px;border-radius:8px;margin-bottom:14px;display:none}
  footer{font-size:11.5px;color:var(--muted);text-align:center;padding:14px 0 4px}

  /* ---- 视图切换 ---- */
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tabs button{font:inherit;font-size:13px;padding:8px 16px;border:1px solid var(--line);border-radius:9px;
    background:#fff;color:var(--muted);cursor:pointer}
  .tabs button.on{background:var(--dark);color:#fff;border-color:var(--dark);font-weight:600}
  /* ---- 接龙热力图 ---- */
  .heat{overflow:auto;max-height:540px;padding:10px 12px}
  .heat table{border-collapse:separate;border-spacing:2px}
  .heat th{position:sticky;top:0;background:#fff;font-weight:600;font-size:9.5px;color:var(--muted);
    padding:2px 0;z-index:3;text-align:center;white-space:nowrap}
  .heat th.hol{color:var(--warn)}
  .heat td{padding:0;border:0}
  .cell{width:9px;height:13px;border-radius:2px;display:block;background:#eef1f5}
  .cell.on{background:var(--ok)}
  .cell.miss{background:#fdecec}
  .heat .nm{position:sticky;left:0;background:#fff;padding:0 10px 0 0;font-size:11.5px;
    white-space:nowrap;z-index:2;text-align:left;color:var(--text)}
  .heat tr:hover .nm{background:#f8fafc}
  .misschip{background:#fdecec;color:#b91c1c;border:1px solid #f7d4d4;border-radius:999px;
    padding:4px 11px;font-size:12px}
  .misschip.none{background:#e7f8f1;color:#067952;border-color:#cdeee0}
  /* ---- 每日明细 / 周趋势 ---- */
  .tblwrap{overflow:auto;max-height:520px}
  td.r-hi{background:#e7f8f1;color:#067952;font-weight:600}
  td.r-mid{background:#fff6e5;color:#8a5300;font-weight:600}
  td.r-lo{background:#fdecec;color:#b91c1c;font-weight:600}
  .tblwrap td,.tblwrap th{white-space:nowrap}
  .tblwrap thead th{position:sticky;top:0;z-index:2;background:#fafbfc}
  .tblwrap td.nmcell{white-space:normal;min-width:360px;line-height:1.9}
  .nmchip{display:inline-block;white-space:nowrap;background:#f3f5f9;border:1px solid #e6eaf0;
    border-radius:6px;padding:1px 6px;margin:2px 4px 2px 0;font-size:11.5px;color:#4b5563}
  .morebtn{font:inherit;font-size:11.5px;color:#3b82f6;background:none;border:0;cursor:pointer;padding:2px 4px}
  .morebtn:hover{text-decoration:underline}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>供应商每日 5M1E / LOT 回复看板</h1>
      <div class="sub" id="sub">每日 10:00 前回复 · 人 / 机 / 料 / 法 / 测 / 环 变更及供货 LOT 异常</div>
    </div>
    <div class="controls">
      <select id="dateSel"></select>
      <button id="refreshBtn">刷新</button>
    </div>
  </header>

  <div class="tabs">
    <button id="tabReply" class="on">5M1E 回复看板</button>
    <button id="tabJl">接龙打卡（79 人 · 66 天）</button>
  </div>

  <div id="view-reply">

  <div class="demo" id="demoNote">演示数据（DEMO）— 接入真实回复数据后此提示自动消失</div>

  <div class="kpis" id="kpis"></div>

  <div class="panel">
    <h2>回复明细 <span class="count" id="listCount"></span></h2>
    <table>
      <thead>
        <tr>
          <th style="width:38px">#</th>
          <th>业体</th>
          <th style="width:88px">回复</th>
          <th style="width:74px">时间</th>
          <th style="width:104px">5M1E 变更</th>
          <th style="width:104px">LOT 异常</th>
          <th style="width:64px">详情</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>变更 / 异常公示 <span class="count" id="alertCount"></span></h2>
    <div id="alerts"></div>
  </div>

  </div><!-- /view-reply -->

  <div id="view-jl" style="display:none">
    <div class="kpis" id="jlKpis"></div>

    <div class="panel">
      <h2>每日打卡率 <span class="count" id="jlRange"></span></h2>
      <div id="jlTrend" style="padding:14px 16px"></div>
    </div>

    <div class="panel">
      <h2>每日明细 <span class="count" id="jlDailyCount"></span>
        <span style="margin-left:auto">
          <label style="font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px">
            <input type="checkbox" id="jlWorkOnly" style="accent-color:#1f2937"> 只看工作日
          </label>
        </span>
      </h2>
      <div class="tblwrap">
        <table>
          <thead><tr>
            <th style="width:96px">日期</th><th style="width:60px">星期</th>
            <th style="width:66px">工作日</th><th style="width:70px">已打卡</th>
            <th style="width:70px">应打卡</th><th style="width:62px">缺卡</th>
            <th style="width:78px">打卡率</th><th>缺卡名单</th>
          </tr></thead>
          <tbody id="jlDaily"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h2>每周趋势 <span class="count">只统计工作日</span></h2>
      <table>
        <thead><tr><th style="width:190px">周起止</th><th style="width:70px">工作日</th>
          <th style="width:80px">应打卡</th><th style="width:80px">实打卡</th>
          <th style="width:80px">出勤率</th><th>备注</th></tr></thead>
        <tbody id="jlWeeks"></tbody>
      </table>
    </div>

    <div class="panel">
      <h2>打卡热力图 <span class="count" id="jlHeatCount"></span>
        <span style="margin-left:auto"><input id="jlSearch" placeholder="搜索姓名"
          style="font:inherit;font-size:12.5px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;width:150px"></span>
      </h2>
      <div class="heat" id="jlHeat"></div>
    </div>

    <div class="panel">
      <h2>今日未打卡 <span class="count" id="jlMissCount"></span></h2>
      <div id="jlMiss" style="padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px"></div>
    </div>

    <div class="panel">
      <h2>个人出勤排行 <span class="count">按缺卡数排序</span></h2>
      <table>
        <thead><tr><th style="width:44px">#</th><th>姓名</th><th style="width:76px">打卡</th>
          <th style="width:76px">缺卡</th><th style="width:90px">出勤率</th><th style="width:90px">最长连缺</th></tr></thead>
        <tbody id="jlPeople"></tbody>
      </table>
    </div>
  </div>

  <footer>mysqe · 供应商质量管理 · <span id="updatedAt"></span></footer>
</div>

<script>
const M5E = [["Man","人"],["Machine","机"],["Material","料"],["Method","法"],["Measurement","测"],["Environment","环"]];
let DATA = null;

async function boot(){
  const idx = await fetch("data/index.json",{cache:"no-store"}).then(r=>r.json()).catch(()=>null);
  const sel = document.getElementById("dateSel");
  const today = new Date().toLocaleDateString("sv-SE");
  const dates = ((idx && idx.dates) || []).slice();
  if(dates.indexOf(today) < 0) dates.unshift(today);
  sel.innerHTML = dates.map(d=>`<option value="${d}">${d}</option>`).join("");
  sel.value = today;
  sel.onchange = ()=>load(sel.value);
  document.getElementById("refreshBtn").onclick = ()=>load(sel.value);
  await load(today);
}

async function load(date){
  // 优先实时打卡数据 (/api/checkins), 回退静态 JSON
  try{
    const r = await fetch("/api/checkins?date=" + encodeURIComponent(date), {cache:"no-store"});
    if(r.ok){
      const j = await r.json();
      if(j && j.count > 0 && j.storage !== "unavailable"){
        DATA = {date:j.date, deadline:"10:00", demo:false,
                updated:"实时 · " + new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",hour12:false}),
                suppliers:j.suppliers};
        render(); return;
      }
    }
  }catch(e){ /* 回退静态 */ }
  const r = await fetch(`data/${date}.json`,{cache:"no-store"});
  DATA = await r.json();
  render();
}

function render(){
  const s = DATA.suppliers || [];
  const total = s.length;
  const replied = s.filter(x=>x.replied).length;
  const miss = total - replied;
  const chg = s.filter(x=>hasChange(x)).length;
  const iss = s.filter(x=>x.lot && x.lot.issue).length;

  document.getElementById("sub").textContent =
    `${DATA.date} · 每日 10:00 前回复 · 人 / 机 / 料 / 法 / 测 / 环 变更及供货 LOT 异常`;
  document.getElementById("demoNote").style.display = DATA.demo ? "block" : "none";
  document.getElementById("updatedAt").textContent = "数据更新时间 " + (DATA.updated || "—");
  document.getElementById("listCount").textContent = `共 ${total} 家`;
  document.getElementById("alertCount").textContent = `${chg} 项变更 / ${iss} 项 LOT 异常`;

  document.getElementById("kpis").innerHTML = [
    kpi("应回复业体", total, "每日 10:00 前", ""),
    kpi("已回复", replied, `${total? Math.round(replied/total*100):0}% 完成`, "ok"),
    kpi("未回复", miss, miss? "需催办" : "全部完成", miss? "bad":"ok"),
    kpi("5M1E 变更", chg, "含变更业体数", chg? "warn":""),
    kpi("LOT 异常", iss, "含异常业体数", iss? "bad":""),
  ].join("");

  const tb = document.getElementById("tbody");
  tb.innerHTML = "";
  s.forEach((x,i)=>{
    const cl = !x.replied ? "miss" : (x.lot&&x.lot.issue ? "issue" : (hasChange(x)?"alert":""));
    const bar = !x.replied ? '<span class="bar miss"></span>' : (x.lot&&x.lot.issue?'<span class="bar issue"></span>':(hasChange(x)?'<span class="bar alert"></span>':''));
    const tr = document.createElement("tr");
    tr.className = "row " + cl;
    tr.innerHTML = `
      <td>${i+1}</td>
      <td>${bar}<b>${esc(x.name||"")}</b> <span class="code">${esc(x.code||"")}</span></td>
      <td>${x.replied?'<span class="tag ok">已回复</span>':'<span class="tag miss">未回复</span>'}</td>
      <td>${esc(x.replied_at||"—")}</td>
      <td>${hasChange(x)?'<span class="tag chg">有变更</span>':'<span class="tag none">无</span>'}</td>
      <td>${x.lot&&x.lot.issue?'<span class="tag iss">有异常</span>':(x.replied?'<span class="tag none">无</span>':'<span class="tag none">—</span>')}</td>
      <td style="color:#9aa1ab">▾</td>`;
    tr.onclick = ()=>{
      const d = tr.nextElementSibling;
      if(d && d.classList.contains("detail")){ d.style.display = d.style.display==="table-row"?"none":"table-row"; tr.classList.toggle("open"); }
    };
    tb.appendChild(tr);

    const dtr = document.createElement("tr");
    dtr.className = "detail";
    dtr.innerHTML = `<td colspan="7"><div class="inner">${detailHtml(x)}</div></td>`;
    tb.appendChild(dtr);
  });

  const alerts = s.filter(x=>hasChange(x) || (x.lot&&x.lot.issue));
  document.getElementById("alerts").innerHTML = alerts.length ? alerts.map(x=>{
    const is = x.lot&&x.lot.issue;
    const changes = M5E.filter(([k])=>x.m1e && x.m1e[k]).map(([k,cn])=>cn);
    return `<div class="box ${is?'bad':''}">
      <b>${esc(x.name||"")}</b> <span class="code">${esc(x.code||"")}</span>
      ${changes.length?`<div>5M1E 变更：<b>${changes.join(" / ")}</b></div>`:""}
      ${is?`<div>LOT 异常：${esc((x.lot&&x.lot.detail)||"—")}</div>`:""}
      ${x.detail?`<div style="color:#6b7280">${esc(x.detail)}</div>`:""}
      <div style="color:#9aa1ab;font-size:11.5px;margin-top:4px">回复时间 ${esc(x.replied_at||"—")}</div>
    </div>`;
  }).join("") : '<div class="empty">当日无变更 / 异常。</div>';
}

function detailHtml(x){
  if(!x.replied) return `<span style="color:#9aa1ab">未回复（截止 ${esc(DATA.deadline||"10:00")}）</span>`;
  const m = M5E.map(([k,cn])=>`<span class="${x.m1e&&x.m1e[k]?'on':''}">${cn}${x.m1e&&x.m1e[k]?' 有变更':''}</span>`).join("");
  return `<b>5M1E 状态</b><div class="m5e">${m}</div>
    ${x.lot&&x.lot.issue?`<div style="margin-top:8px"><b>LOT 异常</b>：${esc(x.lot.detail||"—")}</div>`:""}
    ${x.detail?`<div style="margin-top:8px;color:#6b7280"><b>说明</b>：${esc(x.detail)}</div>`:""}`;
}
function hasChange(x){ return !!(x.m1e && Object.values(x.m1e).some(Boolean)); }
function kpi(l,v,f,cls){ return `<div class="kpi ${cls}"><div class="lbl">${l}</div><div class="val">${v}</div><div class="foot">${f}</div></div>`; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ================= 接龙打卡视图 ================= */
let JL = null;

document.getElementById("tabReply").onclick = () => switchView("reply");
document.getElementById("tabJl").onclick = () => switchView("jl");

function switchView(v){
  const isReply = v === "reply";
  document.getElementById("view-reply").style.display = isReply ? "" : "none";
  document.getElementById("view-jl").style.display = isReply ? "none" : "";
  document.getElementById("tabReply").classList.toggle("on", isReply);
  document.getElementById("tabJl").classList.toggle("on", !isReply);
  if (location.hash !== (isReply ? "" : "#jl")) history.replaceState(null, "", isReply ? location.pathname : "#jl");
  if (!isReply) loadJl();
}

async function loadJl(){
  if (JL) return;
  document.getElementById("jlKpis").innerHTML =
    '<div class="kpi"><div class="lbl">加载中</div><div class="val">—</div></div>';
  try{
    const r = await fetch("/api/jielong", {cache:"no-store"});
    if(!r.ok) throw new Error(r.status === 404 ? "尚未导入接龙数据" : "HTTP " + r.status);
    JL = await r.json();
    renderJl();
  }catch(e){
    document.getElementById("jlKpis").innerHTML =
      '<div class="kpi bad"><div class="lbl">接龙数据未导入</div><div class="val">—</div>' +
      '<div class="foot">' + esc(String(e.message || e)) + '</div></div>';
  }
}

let JL_ROWS = [];

function renderJl(){
  const dates = JL.dates, people = JL.people;
  const hol = new Set(JL.holidays || []);
  const nD = dates.length, nP = people.length;
  const workIdx = [];
  dates.forEach((d,i)=>{ if(!hol.has(d)) workIdx.push(i); });
  const workSet = new Set(workIdx);

  let doneAll = 0, doneWork = 0;
  const perDate = dates.map(()=>0);
  const rows = people.map(p=>{
    let done=0, miss=0, run=0, maxrun=0, wdone=0;
    p.cells.forEach((v,i)=>{
      if(v){ done++; doneAll++; perDate[i]++; if(workSet.has(i)){ doneWork++; wdone++; } run=0; }
      else { miss++; run++; if(run>maxrun) maxrun=run; }
    });
    return {name:p.name, done, miss, maxrun, wdone, rate: done/nD,
            cells:p.cells};
  });
  rows.sort((a,b)=> b.miss - a.miss || b.maxrun - a.maxrun || a.name.localeCompare(b.name,"zh"));
  JL_ROWS = rows;

  const totalCells = nP*nD, totalWork = nP*workIdx.length;
  const todayIdx = nD - 1;
  const todayMiss = rows.filter(r=>!r.cells[todayIdx]);
  const full = rows.filter(r=>r.wdone === workIdx.length).length;

  document.getElementById("jlKpis").innerHTML = [
    kpi("名单人数", nP, `${nD} 天 · ${dates[0]} 起`, ""),
    kpi("整体出勤率", (doneAll/totalCells*100).toFixed(1)+"%", `${doneAll.toLocaleString()} / ${totalCells.toLocaleString()} 次`, doneAll/totalCells>0.7?"ok":"warn"),
    kpi("工作日出勤率", totalWork? (doneWork/totalWork*100).toFixed(1)+"%" : "—", `剔除周末与节假日 ${workIdx.length} 天`, doneWork/totalWork>0.75?"ok":"warn"),
    kpi("工作日全勤", full, `零打卡 ${rows.filter(r=>r.done===0).length} 人`, full>0?"ok":""),
    kpi("今日未打卡", todayMiss.length, dates[todayIdx] + " · " + (nP-todayMiss.length) + " 人已打", todayMiss.length?"bad":"ok"),
  ].join("");

  document.getElementById("jlRange").textContent = `${dates[0]} ~ ${dates[nD-1]}`;

  /* 趋势 */
  const W=1000,H=170,pl=38,pr=12,pt=12,pb=24, iw=W-pl-pr, ih=H-pt-pb;
  const x=i=> pl + (nD===1? iw/2 : iw*i/(nD-1));
  const y=v=> pt + ih*(1-v);
  let grid="",xlab="";
  [0,0.25,0.5,0.75,1].forEach((g,k)=>{
    const yy=pt+ih*(1-g);
    grid+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="#eef1f5"/>`;
    grid+=`<text x="${pl-6}" y="${yy+4}" fill="#9aa1ab" font-size="10" text-anchor="end">${g*100}%</text>`;
  });
  const step=Math.ceil(nD/12);
  dates.forEach((d,i)=>{
    if(i%step===0 || i===nD-1) xlab+=`<text x="${x(i)}" y="${H-8}" fill="#9aa1ab" font-size="10" text-anchor="middle">${d.slice(5)}</text>`;
  });
  let bands="";
  dates.forEach((d,i)=>{ if(hol.has(d)) bands+=`<rect x="${x(i)-6}" y="${pt}" width="12" height="${ih}" fill="#f7f9fc"/>`; });
  const pts = perDate.map((c,i)=>`${x(i)},${y(c/nP)}`).join(" ");
  const area = `M ${pl} ${pt+ih} L ` + perDate.map((c,i)=>`${x(i)} ${y(c/nP)}`).join(" L ") + ` L ${x(nD-1)} ${pt+ih} Z`;
  document.getElementById("jlTrend").innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto">
    <defs><linearGradient id="gj" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient></defs>
    ${bands}${grid}${xlab}
    <path d="${area}" fill="url(#gj)"/>
    <polyline points="${pts}" fill="none" stroke="#3b82f6" stroke-width="2"/>
    ${perDate.map((c,i)=>`<circle cx="${x(i)}" cy="${y(c/nP)}" r="2.6" fill="#3b82f6"><title>${dates[i]} ${c}/${nP}</title></circle>`).join("")}
    <text x="${W-pr}" y="${pt+10}" fill="#9aa1ab" font-size="10" text-anchor="end">灰底=周末/节假日/首日半天</text>
  </svg>`;

  /* 热力图 */
  const drawHeat = (filter)=>{
    const list = filter ? rows.filter(r=>r.name.indexOf(filter)>=0) : rows;
    document.getElementById("jlHeatCount").textContent = `${list.length} 人 × ${nD} 天`;
    let head = '<tr><th class="nm" style="text-align:left">姓名</th>' +
      dates.map(d=>`<th class="${hol.has(d)?'hol':''}" title="${d}">${d.slice(8)}</th>`).join("") + "</tr>";
    let body = list.map(r=>{
      const tds = r.cells.map((v,i)=>
        `<td><span class="cell ${v?'on':'miss'}" title="${dates[i]} ${v?'已打卡':'缺卡'}"></span></td>`).join("");
      return `<tr><td class="nm">${esc(r.name)}</td>${tds}</tr>`;
    }).join("");
    document.getElementById("jlHeat").innerHTML = `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
  };
  drawHeat("");
  document.getElementById("jlSearch").oninput = e=>drawHeat(e.target.value.trim());

  /* 今日未打卡 */
  document.getElementById("jlMissCount").textContent =
    `${dates[todayIdx]} · ${todayMiss.length} 人`;
  document.getElementById("jlMiss").innerHTML = todayMiss.length
    ? todayMiss.map(r=>`<span class="misschip">${esc(r.name)}</span>`).join("")
    : '<span class="misschip none">全部已打卡</span>';

  /* 个人排行 */
  document.getElementById("jlPeople").innerHTML = rows.map((r,i)=>`
    <tr><td>${i+1}</td>
      <td><b>${esc(r.name)}</b>${r.done===0?' <span class="tag iss">零打卡</span>':''}</td>
      <td>${r.done}</td><td>${r.miss}</td>
      <td>${(r.rate*100).toFixed(1)}%</td>
      <td>${r.maxrun}</td></tr>`).join("");

  /* 每日明细 */
  const missNames = dates.map((_,i)=> rows.filter(r=>!r.cells[i]).map(r=>r.name));
  const dayList = dates.map((d,i)=>({d,i}));
  renderJlDaily(dayList, missNames, hol, nP);
  document.getElementById("jlWorkOnly").onchange =
    ()=>renderJlDaily(dayList, missNames, hol, nP);

  /* 每周趋势 */
  renderJlWeeks(dates, perDate, hol, nP);
}

const WD = ["周日","周一","周二","周三","周四","周五","周六"];
function weekdayOf(d){ return WD[new Date(d + "T00:00:00").getDay()]; }

function renderJlDaily(list, missNames, hol, nP){
  const workOnly = document.getElementById("jlWorkOnly").checked;
  const view = workOnly ? list.filter(x=>!hol.has(x.d)) : list;
  const MAXN = 12;
  document.getElementById("jlDailyCount").textContent =
    `${view.length} 天 · 每天应打卡 ${nP} 人`;
  document.getElementById("jlDaily").innerHTML = view.map(({d,i})=>{
    const names = missNames[i];
    const n = names.length;
    const done = nP - n;
    const rate = done / nP;
    const holDay = hol.has(d);
    const cls = holDay ? "" : (rate >= 0.9 ? "r-hi" : rate >= 0.75 ? "r-mid" : "r-lo");
    const rowStyle = holDay ? 'style="color:#9aa1ab;background:#fafbfc"' : "";
    const chip = s=>`<span class="nmchip">${esc(s)}</span>`;
    const head = names.slice(0, MAXN).map(chip).join("");
    const rest = n > MAXN
      ? `<span class="more" style="display:none">${names.slice(MAXN).map(chip).join("")}</span>` +
        `<button class="morebtn" data-n="${n - MAXN}">+${n - MAXN}</button>`
      : "";
    return `<tr ${rowStyle}>
      <td>${d}</td><td>${weekdayOf(d)}</td><td>${holDay ? "否" : "是"}</td>
      <td><b>${done}</b></td><td>${nP}</td><td>${n}</td>
      <td class="${cls}">${(rate*100).toFixed(1)}%</td>
      <td class="nmcell">${n ? head + rest : "—"}</td>
    </tr>`;
  }).join("");
  document.getElementById("jlDaily").onclick = e=>{
    const b = e.target.closest(".morebtn");
    if(!b) return;
    const sp = b.previousElementSibling;
    const hidden = sp.style.display === "none";
    sp.style.display = hidden ? "" : "none";
    b.textContent = hidden ? "收起" : "+" + b.dataset.n;
  };
}

function renderJlWeeks(dates, perDate, hol, nP){
  const weeks = [];
  dates.forEach((d,i)=>{
    const dt = new Date(d + "T00:00:00");
    const mon = new Date(dt); mon.setDate(dt.getDate() - ((dt.getDay() + 6) % 7));
    const key = mon.toISOString().slice(0,10);
    let w = weeks.find(x=>x.key === key);
    if(!w){ w = {key, from:d, to:d, days:0, work:0, expect:0, done:0, holiday:false}; weeks.push(w); }
    w.to = d; w.days++;
    if(!hol.has(d)){
      w.work++; w.expect += nP; w.done += perDate[i];
    } else if(![0,6].includes(dt.getDay())){
      w.holiday = true;
    }
  });
  document.getElementById("jlWeeks").innerHTML = weeks.map(w=>{
    const rate = w.expect ? w.done / w.expect : null;
    const cls = rate === null ? "" : (rate >= 0.9 ? "r-hi" : rate >= 0.75 ? "r-mid" : "r-lo");
    const notes = [];
    if(w.days < 7) notes.push("不完整周");
    if(w.holiday) notes.push("含节假日");
    return `<tr>
      <td>${w.from} ~ ${w.to}</td>
      <td>${w.work}</td><td>${w.expect}</td><td>${w.done}</td>
      <td class="${cls}">${rate === null ? "—" : (rate*100).toFixed(1) + "%"}</td>
      <td style="color:#6b7280">${notes.join(" · ") || "—"}</td>
    </tr>`;
  }).join("");
}

if (location.hash === "#jl") switchView("jl");

boot();
</script>
