<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>每日 5M1E / LOT 打卡 | mysqe</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--line:#e3e8ef;--text:#111827;--muted:#6b7280;--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--pri:#2563eb}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding:16px;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto}
  .hd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .hd h1{font-size:17px;font-weight:700}
  .hd .meta{font-size:12.5px;color:var(--muted);margin-top:6px}
  .who{margin-top:12px;padding:11px 13px;background:#eff4ff;border-radius:10px;font-size:14px}
  .who b{font-size:15.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:13px}
  .card h2{font-size:14px;margin-bottom:4px}
  .card .hint{font-size:12px;color:var(--muted);margin-bottom:11px}
  .row{display:flex;gap:9px;flex-wrap:wrap}
  .opt{flex:1 1 auto;min-width:88px;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;text-align:center;
       font-size:14px;cursor:pointer;user-select:none;transition:all .15s;background:#fbfcfe}
  .opt.on-none{border-color:var(--ok);background:#ecfdf5;color:#047857;font-weight:600}
  .opt.on-chg{border-color:var(--warn);background:#fffbeb;color:#b45309;font-weight:600}
  .opt.on-iss{border-color:var(--bad);background:#fef2f2;color:#b91c1c;font-weight:600}
  .grid{display:grid;grid-template-columns:1fr;gap:11px}
  .item{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .item .lbl{font-size:13.5px;font-weight:600;margin-bottom:8px}
  .item .lbl small{font-weight:400;color:var(--muted);margin-left:5px;font-size:11.5px}
  .mini{display:flex;gap:8px}
  .mini .opt{padding:8px 0;font-size:13px;min-width:0}
  textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:13.5px;resize:vertical;min-height:64px;background:#fbfcfe}
  textarea:focus{outline:none;border-color:var(--pri)}
  .submit{width:100%;border:none;border-radius:12px;background:var(--pri);color:#fff;font-size:16px;font-weight:600;padding:15px;cursor:pointer;margin-top:4px}
  .submit:disabled{opacity:.55}
  .msg{padding:12px 14px;border-radius:10px;font-size:13.5px;margin-bottom:13px;display:none}
  .msg.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0;display:block}
  .msg.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;display:block}
  .foot{font-size:11.5px;color:var(--muted);text-align:center;padding:8px 0 20px}
  .done{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:14px;font-size:13.5px;color:#065f46}
  a{color:var(--pri)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1>每日 5M1E / LOT 打卡</h1>
    <div class="meta">请于每日 10:00 前提交 · 人 / 机 / 料 / 法 / 测 / 环 变更及供货 LOT 异常</div>
    <div class="who" id="who">正在识别业体…</div>
  </div>

  <div class="msg" id="msg"></div>

  <div id="form" style="display:none">
    <div class="card">
      <h2>一、5M1E 有无变更</h2>
      <div class="hint">有变更请选择对应项</div>
      <div class="grid" id="m5e"></div>
    </div>

    <div class="card">
      <h2>二、供货 LOT 有无异常</h2>
      <div class="hint">如有异常，请填写批号与处置情况</div>
      <div class="row" id="lotRow">
        <div class="opt" data-v="0">无异常</div>
        <div class="opt" data-v="1">有异常</div>
      </div>
      <div id="lotDetailWrap" style="display:none;margin-top:11px">
        <textarea id="lotDetail" placeholder="批号 + 问题描述 + 处置措施（例：批号 L240910 外观划伤 5pcs，已隔离待判定）"></textarea>
      </div>
    </div>

    <div class="card">
      <h2>三、其他说明（选填）</h2>
      <textarea id="remark" placeholder="补充说明，如变更原因、生效时间等"></textarea>
    </div>

    <button class="submit" id="btn">提交打卡</button>
    <div class="foot">提交后可在本页重复提交以更新当日信息</div>
  </div>

  <div class="foot">mysqe · 供应商质量管理 · <a href="/5m1e/">查看汇总看板</a></div>
</div>

<script>
const M5E = [["Man","人"],["Machine","机"],["Material","料"],["Method","法"],["Measurement","测"],["Environment","环"]];
const T = new URLSearchParams(location.search).get("t") || "";
const state = { code:"", name:"", date:"", m1e:{}, lot:0 };

const $ = id => document.getElementById(id);
function say(text, kind){ const m=$("msg"); m.className="msg "+kind; m.textContent=text; }

async function boot(){
  if(!T){ $("who").innerHTML="未检测到业体识别码，请使用管理员发给你的专属链接打开本页。"; return; }
  try{
    const r = await fetch("/api/whoami?t="+encodeURIComponent(T),{cache:"no-store"});
    const d = await r.json();
    if(!r.ok){ $("who").innerHTML="识别失败："+(d.error==="invalid_token"?"链接无效，请联系管理员":"服务异常"); return; }
    state.code=d.code; state.name=d.name; state.date=d.date;
    $("who").innerHTML = `业体：<b>${esc(d.name)}</b> <span style="color:#6b7280;font-size:12.5px">(${esc(d.code)})</span><br><span style="font-size:12px;color:#6b7280">打卡日期：${esc(d.date)}</span>`;
    buildForm();
    if(d.existing){ fill(d.existing); say("今日已提交（"+esc(d.existing.replied_at||"")+"），可修改后重新提交。","ok"); }
    $("form").style.display="block";
  }catch(e){ $("who").innerHTML="网络异常，请稍后重试。"; }
}

function buildForm(){
  $("m5e").innerHTML = M5E.map(([k,cn])=>`
    <div class="item">
      <div class="lbl">${cn}<small>${k}</small></div>
      <div class="mini" data-k="${k}">
        <div class="opt on-none" data-v="0">无变更</div>
        <div class="opt" data-v="1">有变更</div>
      </div>
    </div>`).join("");
  document.querySelectorAll("#m5e .mini").forEach(g=>{
    g.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
      const k=g.dataset.k, v=o.dataset.v==="1";
      state.m1e[k]=v;
      g.querySelectorAll(".opt").forEach(x=>x.className="opt");
      o.className="opt "+(v?"on-chg":"on-none");
    });
  });
  document.querySelectorAll("#lotRow .opt").forEach(o=>o.onclick=()=>{
    state.lot = o.dataset.v==="1"?1:0;
    document.querySelectorAll("#lotRow .opt").forEach(x=>x.className="opt");
    o.className = "opt "+(state.lot?"on-iss":"on-none");
    $("lotDetailWrap").style.display = state.lot?"block":"none";
  });
  $("lotRow").querySelector('[data-v="0"]').className="opt on-none";
  $("btn").onclick = submit;
}

function fill(x){
  Object.keys(x.m1e||{}).forEach(k=>{
    state.m1e[k]=!!x.m1e[k];
    const g=document.querySelector(`#m5e .mini[data-k="${k}"]`);
    if(g){ g.querySelectorAll(".opt").forEach(o=>o.className="opt");
      const t=g.querySelector(`[data-v="${x.m1e[k]?1:0}"]`); t.className="opt "+(x.m1e[k]?"on-chg":"on-none"); }
  });
  state.lot = x.lot&&x.lot.issue?1:0;
  document.querySelectorAll("#lotRow .opt").forEach(o=>o.className="opt");
  const lo=$("lotRow").querySelector(`[data-v="${state.lot}"]`);
  lo.className="opt "+(state.lot?"on-iss":"on-none");
  $("lotDetailWrap").style.display = state.lot?"block":"none";
  $("lotDetail").value = (x.lot&&x.lot.detail)||"";
  $("remark").value = x.detail||"";
}

async function submit(){
  $("btn").disabled=true; $("btn").textContent="提交中…";
  try{
    const r = await fetch("/api/checkin",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({t:T, m1e:state.m1e, lot_issue:!!state.lot, lot_detail:$("lotDetail").value, remark:$("remark").value})});
    const d = await r.json();
    if(r.ok){ say("打卡成功（"+esc(d.time||"")+"）。如需修改，可再次提交。","ok"); window.scrollTo({top:0,behavior:"smooth"}); }
    else say("提交失败："+(d.error==="invalid_token"?"链接无效":"存储未就绪，请稍后再试"),"err");
  }catch(e){ say("网络异常，请稍后重试。","err"); }
  $("btn").disabled=false; $("btn").textContent="提交打卡";
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

boot();
</script>
</body>
</html>
