<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>平衡块全检 · IQC 实时监控 | mysqe</title>
<style>
  :root{
    --bg:#eef2f7; --card:#fff; --line:#e2e8f0; --text:#16233a; --muted:#6b7a90;
    --ok:#1f9d63; --okBg:#e7f6ee;
    --watch:#e8890c; --watchBg:#fdf1df;
    --over:#e03d3d; --overBg:#fdeaea;
    --none:#8b98a8; --noneBg:#eef1f5;
    --blue:#1e5fb0; --blueBg:#eaf2fb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",Segoe UI,sans-serif;
    background:var(--bg);color:var(--text);padding:14px 18px 30px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1560px;margin:0 auto}

  .top{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1e5fb0,#3b8fd4);
    display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
  h1{font-size:19px;font-weight:800;letter-spacing:-.2px}
  h1 em{font-style:normal;color:var(--blue)}
  .clock{font-size:12px;color:var(--muted);margin-left:2px}
  .clock b{color:var(--text);font-variant-numeric:tabular-nums}
  .live{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ok);
    background:var(--okBg);padding:2px 8px;border-radius:999px;margin-left:6px}
  .live i{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:blink 1.6s infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .tools{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .tbtn{font:inherit;font-size:12.5px;padding:6px 12px;border:1px solid var(--line);border-radius:7px;
    background:#fff;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:5px;transition:.15s}
  .tbtn:hover{border-color:var(--blue);color:var(--blue)}
  .tbtn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  .tbtn.primary:hover{background:#17518f;color:#fff}
  input[type=date]{font:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--line);
    border-radius:7px;background:#fff;color:var(--text)}

  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:11px}
  .kpi{border-radius:11px;padding:12px 15px;color:#fff;position:relative;overflow:hidden}
  .kpi .lbl{font-size:12px;opacity:.92;margin-bottom:3px}
  .kpi .val{font-size:29px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .kpi .val small{font-size:14px;font-weight:600;opacity:.85;margin-left:2px}
  .kpi.k1{background:linear-gradient(135deg,#1e5fb0,#3277c8)}
  .kpi.k2{background:linear-gradient(135deg,#1f9d63,#2bb87a)}
  .kpi.k3{background:linear-gradient(135deg,#e8890c,#f5a632)}
  .kpi.k4{background:linear-gradient(135deg,#d43434,#ea5555)}
  .kpi.k5{background:linear-gradient(135deg,#16a34a,#26c56b)}
  .kpi:after{content:"";position:absolute;right:-18px;bottom:-22px;width:76px;height:76px;
    border-radius:50%;background:rgba(255,255,255,.11)}

  .legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
    border-radius:9px;padding:9px 14px;font-size:12px;color:var(--muted);margin-bottom:14px}
  .lg{display:flex;align-items:center;gap:5px}
  .dot{width:8px;height:8px;border-radius:50%}
  .legend .tip{margin-left:auto;color:var(--blue);background:var(--blueBg);padding:3px 10px;border-radius:999px;font-size:11.5px}

  .stage{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:13px;overflow:hidden}
  .stage-hd{display:flex;align-items:center;gap:12px;padding:11px 16px 9px;border-bottom:1px solid var(--line);
    background:linear-gradient(90deg,#fafcff,#fff)}
  .stage-hd .nm{font-size:14px;font-weight:800}
  .stage-hd .nm span{color:var(--muted);font-weight:600;font-size:12px;margin-left:5px}
  .stage-hd .st{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .stage-hd .st b{color:var(--ok)}
  .stage-hd .st b.bad{color:var(--over)}
  .stage-hd .win{margin-left:auto;font-size:11.5px;color:var(--muted);background:#f4f7fa;
    padding:3px 9px;border-radius:6px;white-space:nowrap}
  .pbar{height:3px;background:#eef2f7}
  .pbar i{display:block;height:100%;transition:width .45s}

  .row{display:flex;gap:11px;padding:13px 16px 14px}
  .row .card{flex:1}

  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px 9px;
    cursor:pointer;transition:.16s;position:relative;overflow:hidden;min-width:0;
    box-shadow:0 1px 2px rgba(16,32,56,.04)}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(16,32,56,.11);border-color:#c9d6e6}
  .card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--none)}
  .card[data-s="ok"]:before{background:var(--ok)}
  .card[data-s="watch"]:before{background:var(--watch)}
  .card[data-s="over"]:before{background:var(--over)}
  .card[data-s="none"]:before{background:var(--none)}
  .card .hd{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .no{width:19px;height:19px;border-radius:50%;background:#eef2f7;color:#5b6b80;font-size:11px;
    font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
  .card[data-s="ok"] .no{background:var(--okBg);color:var(--ok)}
  .card[data-s="watch"] .no{background:var(--watchBg);color:var(--watch)}
  .card[data-s="over"] .no{background:var(--overBg);color:var(--over)}
  .tag{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap;margin-left:auto}
  .tag.ok{background:var(--okBg);color:var(--ok)}
  .tag.watch{background:var(--watchBg);color:var(--watch)}
  .tag.over{background:var(--overBg);color:var(--over)}
  .tag.none{background:var(--noneBg);color:var(--none)}
  .card .name{font-size:12.5px;font-weight:700;line-height:1.45;margin-bottom:7px;min-height:36px}
  .card .name small{display:block;font-weight:600;color:var(--muted);font-size:10.5px;margin-top:2px}
  .card .meta{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
  .chip{font-size:10.5px;padding:1px 7px;border-radius:5px;background:#f1f5f9;color:#5c6b80}
  .chip.b{background:#eaf2fb;color:#24629f}
  .times{font-size:11px;color:var(--muted);line-height:1.62;border-top:1px dashed #e8eef5;padding-top:6px}
  .times .r{display:flex;justify-content:space-between;gap:6px}
  .times .r b{font-weight:600;color:#3c4a5e;font-variant-numeric:tabular-nums}
  .times .r b.bad{color:var(--over)}
  .cmp{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}
  .cmp span{font-size:10.5px;padding:1.5px 6px;border-radius:5px;font-weight:600}
  .cmp .early{background:#e7f6ee;color:#15784c}
  .cmp .ok{background:#eef2f7;color:#5b6b80}
  .cmp .late{background:#fdeaea;color:#c22d2d}
  .cmp .na{background:#f4f6f9;color:#9aa7b6}

  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:13px;overflow:hidden}
  .panel h2{font-size:13.5px;font-weight:800;padding:11px 16px;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:9px}
  .panel h2 .hint{font-weight:500;color:var(--muted);font-size:11.5px}
  .panel h2 .right{margin-left:auto;display:flex;gap:6px}
  .panel .body{padding:13px 16px}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{background:#fff;border:0;color:var(--muted);padding:4px 11px;font-size:11.5px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--blue);color:#fff;font-weight:700}
  .tabs{display:flex;gap:6px;padding:11px 16px 0;flex-wrap:wrap}
  .tabs button{background:#fff;border:1px solid var(--line);color:var(--muted);padding:6px 13px;
    border-radius:7px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .tabs button.on{background:var(--blueBg);border-color:var(--blue);color:var(--blue);font-weight:700}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:right;font-size:11px;font-weight:700;color:var(--muted);padding:9px 12px;
    border-bottom:1px solid var(--line);background:#fafbfc;white-space:nowrap;cursor:pointer}
  th:first-child,td:first-child{text-align:left}
  td{padding:8px 12px;border-bottom:1px solid #f1f4f8;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tbody tr:hover{background:#f8fafc}
  tr.bad td:first-child:before{content:"●";color:var(--over);margin-right:6px;font-size:9px}
  .bar{position:relative;background:#eef2f7;height:5px;border-radius:3px;overflow:hidden;min-width:52px;margin-top:3px}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
  .scroll{max-height:420px;overflow:auto}
  .scroll::-webkit-scrollbar{width:7px}.scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
  .empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}

  .mask{position:fixed;inset:0;background:rgba(12,22,38,.45);display:none;align-items:center;
    justify-content:center;z-index:60;padding:20px}
  .mask.on{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:620px;padding:20px 22px;
    box-shadow:0 18px 50px rgba(10,24,44,.28);max-height:86vh;overflow:auto}
  .modal h3{font-size:15px;margin-bottom:3px}
  .modal .sub{font-size:12px;color:var(--muted);margin-bottom:14px}
  .mfoot{display:flex;justify-content:flex-end;margin-top:14px}
  .mfoot button{font:inherit;font-size:13px;padding:8px 18px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:#fff}

  .foot{text-align:center;font-size:11.5px;color:#93a1b3;padding:10px 0 2px}
  .foot a{color:#7f92a8;text-decoration:none;border-bottom:1px dotted #b8c4d2}
  @media(max-width:1200px){.row{flex-wrap:wrap}.row .card{flex:1 1 200px}}
  @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}h1{font-size:16px}.row .card{flex:1 1 100%}}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="logo">▦</div>
    <div>
      <h1>平衡块全检 · <em>IQC 实时监控</em><span class="live"><i></i>实时</span></h1>
      <div class="clock">当前：<b id="clock">—</b>　·　数据更新 <b id="lastUpd">—</b></div>
    </div>
    <div class="tools">
      <input type="date" id="date">
      <button class="tbtn" id="btnSet">⚙ 阈值</button>
      <button class="tbtn" id="btnCsv">⤓ 导出CSV</button>
      <button class="tbtn primary" id="btnPick">＋ 载入 CSV</button>
    </div>
  </div>

  <div class="kpis">
    <div class="kpi k1"><div class="lbl">检验节点数</div><div class="val" id="kTotal">0</div></div>
    <div class="kpi k2"><div class="lbl">正常</div><div class="val" id="kOk">0</div></div>
    <div class="kpi k3"><div class="lbl">关注</div><div class="val" id="kWatch">0</div></div>
    <div class="kpi k4"><div class="lbl">超限</div><div class="val" id="kOver">0</div></div>
    <div class="kpi k5"><div class="lbl">达标率</div><div class="val" id="kRate">0<small>%</small></div></div>
  </div>

  <div class="legend">
    <div class="lg"><i class="dot" style="background:var(--ok)"></i>正常</div>
    <div class="lg"><i class="dot" style="background:var(--watch)"></i>关注（＞70% 阈值）</div>
    <div class="lg"><i class="dot" style="background:var(--over)"></i>超限</div>
    <div class="lg"><i class="dot" style="background:var(--none)"></i>无数据</div>
    <div class="tip">点击节点卡片可查看该环节的分时明细</div>
  </div>

  <div id="stages"></div>

  <div class="panel">
    <h2>不良率趋势 <span class="hint" id="chartHint"></span>
      <span class="right"><div class="seg" id="segG">
        <button data-g="hour" class="on">按小时</button>
        <button data-g="day">按日</button></div></span></h2>
    <div class="body"><div id="chart"></div>
      <div style="display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px">
        <span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#cbd8e6;margin-right:5px"></i>生产数（右轴）</span>
        <span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--blue);margin-right:5px"></i>不良率（左轴）</span>
        <span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--over);margin-right:5px"></i>超限阈值</span>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>分类统计 <span class="hint">点击表头排序</span></h2>
    <div class="tabs" id="tabs">
      <button data-d="supplier" class="on">供应商别</button>
      <button data-d="code">CODE 别</button>
      <button data-d="item">检查项目别</button>
      <button data-d="date">日别</button>
    </div>
    <div class="scroll" style="margin-top:10px"><table>
      <thead><tr><th>名称</th><th>记录数</th><th>生产数</th><th>不良数</th><th>不良率</th></tr></thead>
      <tbody id="dimBody"></tbody></table></div>
  </div>

  <div class="panel">
    <h2>实时检查记录 <span class="hint">最新在上</span></h2>
    <div class="scroll"><table>
      <thead><tr><th>时间</th><th>供应商</th><th>CODE</th><th>检查项目</th>
        <th>生产数</th><th>不良</th><th>不良率</th></tr></thead>
      <tbody id="recent"></tbody></table></div>
  </div>

  <div class="foot">
    <a href="/">← 返回 mysqe</a> · 演示数据为合成数据，非真实产线 · 载入的 CSV 只在浏览器内计算
  </div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <h3 id="mTitle">—</h3>
    <div class="sub" id="mSub"></div>
    <div id="mBody"></div>
    <div class="mfoot"><button id="mClose">关闭</button></div>
  </div>
</div>

const S = {rows:[], date:"", gran:"hour", dim:"supplier", sortKey:"defect", sortDir:-1,
           limit:0.02, minSample:100};

const fmt = n => (n==null? "—" : Number(n).toLocaleString("en-US"));
const pct = r => (r==null? "—" : (r*100).toFixed(2)+"%");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- CSV ---------- */
const ALIAS = {
  ts:["时间","检测时间","检查时间","日期时间","time","datetime","timestamp"],
  supplier:["供应商","厂商","供方","supplier","vendor"],
  code:["CODE","Code","code","料号","品号","部件号","型号"],
  item:["检查项目","检验项目","项目","item","inspection_item"],
  prod:["生产数","生产数量","产量","检验数","全检数","qty","prod","total"],
  defect:["不良数","不良数量","不合格数","defect","ng"]
};
function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c==='"') q=true;
    else if(c===','||c===';'||c==='\t'){ row.push(cur); cur=""; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
    else if(c!=='\r') cur+=c;
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}
const norm = s => String(s||"").replace(/\s+/g,"").toLowerCase();
function mapHeader(hdr){
  const n=hdr.map(norm);
  const pick=names=>{ for(const nm of names){ const k=n.indexOf(norm(nm)); if(k>=0) return k; } return -1; };
  const m={}; for(const key in ALIAS) m[key]=pick(ALIAS[key]);
  return m;
}
function parseTime(s){
  s=String(s||"").trim().replace("T"," ");
  let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:[ ]+(\d{1,2}):?(\d{1,2})?:?(\d{1,2})?)?/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  m=s.match(/^(\d{4})(\d{2})(\d{2})[ ]?(\d{2})?(\d{2})?(\d{2})?/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0));
  const d=new Date(s); return isNaN(d.getTime())? null : d;
}
const toInt = v => { const n=parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isFinite(n)? Math.round(n):0; };

function ingest(text, fname){
  const t=parseCSV(text);
  if(t.length<2) return 0;
  const m=mapHeader(t[0]);
  if(m.ts<0||m.prod<0||m.defect<0) return -1;
  const out=[];
  for(let i=1;i<t.length;i++){
    const r=t[i], d=parseTime(r[m.ts]);
    if(!d) continue;
    const prod=toInt(r[m.prod]), def=toInt(r[m.defect]);
    if(prod<=0&&def<=0) continue;
    out.push({ts:d, day:yp(d), hour:d.getHours(),
      supplier:(m.supplier>=0? String(r[m.supplier]||"").trim():"")||"未标注",
      code:(m.code>=0? String(r[m.code]||"").trim():"")||"未标注",
      item:(m.item>=0? String(r[m.item]||"").trim():"")||"未标注",
      prod, defect:def});
  }
  S.rows=S.rows.concat(out);
  return out.length;
}
const yp = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

/* ---------- 聚合 ---------- */
const rate=(d,p)=> p? d/p : 0;

function dayRows(){ return S.rows.filter(r=>r.day===S.date); }

function nodes(){
  const rs = dayRows(), map=new Map();
  rs.forEach(r=>{
    const k=r.supplier+"||"+r.item;
    if(!map.has(k)) map.set(k,{supplier:r.supplier, item:r.item, prod:0, defect:0,
      hours:new Map(), cells:new Map(), last:r.ts, codes:new Set()});
    const o=map.get(k);
    o.prod+=r.prod; o.defect+=r.defect;
    if(!o.hours.has(r.hour)) o.hours.set(r.hour,{prod:0,defect:0});
    const h=o.hours.get(r.hour); h.prod+=r.prod; h.defect+=r.defect;
    const ck=r.hour+"|"+r.code;
    if(!o.cells.has(ck)) o.cells.set(ck,{hour:r.hour, code:r.code, prod:0, defect:0});
    const c=o.cells.get(ck); c.prod+=r.prod; c.defect+=r.defect;
    o.codes.add(r.code);
    if(r.ts>o.last) o.last=r.ts;
  });
  const out=[...map.values()].map(o=>{
    const rt=rate(o.defect,o.prod);
    // 峰值单元：时段 × CODE，样本量达标的里面不良率最高
    let peak={hour:null, code:"", rate:0, prod:0, defect:0};
    o.cells.forEach(c=>{
      if(c.prod < S.minSample) return;
      const r2=rate(c.defect,c.prod);
      if(r2 > peak.rate) peak={hour:c.hour, code:c.code, rate:r2, prod:c.prod, defect:c.defect};
    });
    const hasPeak = peak.hour !== null;
    let st = "none";
    if(o.prod >= S.minSample && hasPeak){
      st = peak.rate > S.limit ? "over" : (peak.rate > S.limit*0.7 ? "watch" : "ok");
    }
    return {...o, rate:rt, peak, hourCount:o.hours.size, status:st};
  });
  return out;
}

function summary(){
  const rs=dayRows();
  const p=rs.reduce((a,r)=>a+r.prod,0), d=rs.reduce((a,r)=>a+r.defect,0);
  return {prod:p, defect:d, records:rs.length, rate:rate(d,p)};
}

function series(){
  const rs = S.gran==="hour"? dayRows() : S.rows;
  const key = r=> S.gran==="hour"? r.hour : r.day;
  const map=new Map();
  rs.forEach(r=>{ const k=key(r); if(!map.has(k)) map.set(k,{prod:0,defect:0});
    const o=map.get(k); o.prod+=r.prod; o.defect+=r.defect; });
  let keys=[...map.keys()].sort((a,b)=>a-b);
  if(S.gran==="day") keys=keys.slice(-30);
  return keys.map(k=>({k: S.gran==="hour"? String(k).padStart(2,"0")+":00" : k,
    ...map.get(k), rate: rate(map.get(k).defect, map.get(k).prod)}));
}

function dimRows(){
  const col = {supplier:"supplier",code:"code",item:"item",date:"day"}[S.dim];
  const rs = S.dim==="date"? S.rows : dayRows();
  const map=new Map();
  rs.forEach(r=>{ const k=r[col]; if(!map.has(k)) map.set(k,{prod:0,defect:0,count:0});
    const o=map.get(k); o.prod+=r.prod; o.defect+=r.defect; o.count++; });
  return [...map.entries()].map(([k,o])=>({k, ...o, rate: rate(o.defect,o.prod)}));
}

/* ---------- 图表 ---------- */
function drawChart(rows, limit, overHours){
  const W=1180,H=250,pad={l:54,r:58,t:16,b:30}, iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  if(!rows.length){ $("#chart").innerHTML='<div class="empty">该时段暂无数据</div>'; return; }
  const maxP=Math.max(1,...rows.map(r=>r.prod));
  const maxR=Math.max(0.005,...rows.map(r=>r.rate),limit||0)*1.25;
  const n=rows.length, bw=Math.min(52, iw/n*0.56);
  const x=i=> pad.l + (n===1? iw/2 : iw*i/(n-1));
  const yR=v=> pad.t + ih*(1-v/maxR), yP=v=> pad.t + ih*(1-v/maxP);

  let grid="",lab="",rlab="";
  for(let k=0;k<=4;k++){
    const y=pad.t+ih*k/4;
    grid+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="#eef2f7"/>`;
    lab+=`<text x="${pad.l-8}" y="${y+4}" fill="#8a99ad" font-size="10" text-anchor="end">${((maxR*(1-k/4))*100).toFixed(1)}%</text>`;
    rlab+=`<text x="${W-pad.r+8}" y="${y+4}" fill="#8a99ad" font-size="10">${Math.round(maxP*(1-k/4)).toLocaleString("en-US")}</text>`;
  }
  const step=Math.ceil(n/14);
  let xlab="";
  rows.forEach((r,i)=>{ if(i%step===0||i===n-1)
    xlab+=`<text x="${x(i)}" y="${H-9}" fill="#8a99ad" font-size="10" text-anchor="middle">${esc(r.k)}</text>`; });

  let bars="",bands="";
  rows.forEach((r,i)=>{
    const h=r.prod? Math.max(2,ih*r.prod/maxP):0;
    const over = overHours && overHours.has(r.k);
    if(over) bands+=`<rect x="${x(i)-bw/2-3}" y="${pad.t}" width="${bw+6}" height="${ih}"
      fill="rgba(224,61,61,.06)" stroke="rgba(224,61,61,.22)" stroke-width=".8" rx="3"/>`;
    bars+=`<rect x="${x(i)-bw/2}" y="${pad.t+ih-h}" width="${bw}" height="${h}" rx="2"
      fill="${over?"#e9c3c3":"#cbd8e6"}"/>`;
  });

  const yv=r=>yR(Math.min(r.rate,maxR));
  const pts=rows.map((r,i)=>`${x(i)},${yv(r)}`).join(" ");
  const area=`M ${pad.l} ${pad.t+ih} L `+rows.map((r,i)=>`${x(i)} ${yv(r)}`).join(" L ")+` L ${x(n-1)} ${pad.t+ih} Z`;

  let lim="";
  if(limit){
    lim=`<rect x="${pad.l}" y="${pad.t}" width="${iw}" height="${Math.max(0,yR(limit)-pad.t)}" fill="rgba(224,61,61,.035)"/>
      <line x1="${pad.l}" y1="${yR(limit)}" x2="${W-pad.r}" y2="${yR(limit)}" stroke="#e03d3d"
        stroke-dasharray="6 4" stroke-width="1.6"/>
      <text x="${pad.l+4}" y="${yR(limit)-5}" fill="#c23a3a" font-size="10.5" font-weight="700">阈值 ${(limit*100).toFixed(1)}%</text>`;
  }
  const dots=rows.map((r,i)=> (overHours&&overHours.has(r.k))
    ? `<circle cx="${x(i)}" cy="${yv(r)}" r="4" fill="#e03d3d" stroke="#fff" stroke-width="1.6"/>`
    : `<circle cx="${x(i)}" cy="${yv(r)}" r="2.3" fill="#1e5fb0"/>`).join("");

  $("#chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto" preserveAspectRatio="none">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e5fb0" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#1e5fb0" stop-opacity="0"/></linearGradient></defs>
    ${grid}${lab}${rlab}${bands}${xlab}${bars}
    <path d="${area}" fill="url(#ag)"/>
    <polyline points="${pts}" fill="none" stroke="#1e5fb0" stroke-width="2" stroke-linejoin="round"/>
    ${dots}${lim}
    <text x="${pad.l}" y="${pad.t-4}" fill="#8a99ad" font-size="9.5">不良率</text>
    <text x="${W-pad.r}" y="${pad.t-4}" fill="#8a99ad" font-size="9.5" text-anchor="end">生产数</text>
  </svg>`;
}

/* ---------- 渲染 ---------- */
const TAG = {ok:"正常", watch:"关注", over:"超限", none:"无数据"};

function render(){
  const ns = nodes(), s = summary();
  const byS = {ok:0, watch:0, over:0, none:0};
  ns.forEach(n=>byS[n.status]++);
  const total = ns.length;
  $("#kTotal").textContent = total;
  $("#kOk").textContent = byS.ok;
  $("#kWatch").textContent = byS.watch;
  $("#kOver").textContent = byS.over;
  $("#kRate").innerHTML = (total? Math.round((byS.ok+byS.watch)/total*100):0) + "<small>%</small>";

  // 按供应商分组为三段
  const groups = new Map();
  ns.forEach(n=>{ if(!groups.has(n.supplier)) groups.set(n.supplier,[]); groups.get(n.supplier).push(n); });
  const order = [...groups.keys()].sort();
  let html = "";
  order.forEach(sup=>{
    const list = groups.get(sup).sort((a,b)=>a.item.localeCompare(b.item,"zh"));
    const c = {ok:0,watch:0,over:0,none:0}; list.forEach(x=>c[x.status]++);
    const prod = list.reduce((a,x)=>a+x.prod,0), def = list.reduce((a,x)=>a+x.defect,0);
    const rt = rate(def,prod);
    const pctv = Math.min(100, S.limit? rt/S.limit*100 : 0);
    const barColor = c.over? "var(--over)" : (c.watch? "var(--watch)" : "var(--ok)");

    const cards = list.map((n,i)=>{
      const diff = (n.peak.rate - S.limit)*100;
      const cmpTxt = diff>0 ? `峰值超阈值 ${diff.toFixed(2)}pp` : `峰值低于阈值 ${Math.abs(diff).toFixed(2)}pp`;
      const cmpCls = diff>0 ? "late" : "early";
      const lastT = String(n.last.getHours()).padStart(2,"0")+":"+String(n.last.getMinutes()).padStart(2,"0");
      const peakT = n.peak.hour===null? "--" : String(n.peak.hour).padStart(2,"0")+":00";
      return `<div class="card" data-s="${n.status}" data-sup="${esc(n.supplier)}" data-item="${esc(n.item)}">
        <div class="hd"><div class="no">${i+1}</div>
          <span class="tag ${n.status}">${TAG[n.status]}</span></div>
        <div class="name">${esc(n.item)}<small>${esc([...n.codes].slice(0,2).join(" / "))}</small></div>
        <div class="meta"><span class="chip b">${esc(sup)}</span>
          <span class="chip">${n.hourCount} 个时段</span></div>
        <div class="times">
          <div class="r"><span>生产数</span><b>${fmt(n.prod)}</b></div>
          <div class="r"><span>不良数</span><b>${fmt(n.defect)}</b></div>
          <div class="r"><span>当日不良率</span><b>${pct(n.rate)}</b></div>
          <div class="r"><span>峰值 ${peakT}${n.peak.code? " · "+esc(n.peak.code):""}</span><b class="${n.status==='over'?'bad':''}">${pct(n.peak.rate)}（${fmt(n.peak.defect)}/${fmt(n.peak.prod)}）</b></div>
        </div>
        <div class="cmp"><span class="${cmpCls}">${cmpTxt}</span>
          <span class="na">最近 ${lastT}</span></div>
      </div>`;
    }).join("");

    html += `<div class="stage">
      <div class="stage-hd">
        <div class="nm">${esc(sup)}<span>供应商</span></div>
        <div class="st">${list.length} 个检验项，<b class="${c.over?'bad':''}">${c.ok+c.watch} 达标</b>，
          ${c.over} 超限，不良率 <b class="${c.over?'bad':''}">${pct(rt)}</b></div>
        <div class="win">生产 ${fmt(prod)} / 不良 ${fmt(def)}</div>
      </div>
      <div class="pbar"><i style="width:${pctv}%;background:${barColor}"></i></div>
      <div class="row">${cards}</div>
    </div>`;
  });
  $("#stages").innerHTML = html || '<div class="panel"><div class="empty">该日期暂无数据</div></div>';

  document.querySelectorAll(".card").forEach(el=>{
    el.addEventListener("click", ()=>openNode(el.dataset.sup, el.dataset.item));
  });

  // 趋势
  const overHours = new Set();
  dayRows().forEach(r=>{ if(rate(r.defect,r.prod) > S.limit) overHours.add(String(r.hour).padStart(2,"0")+":00"); });
  drawChart(series(), S.limit, S.gran==="hour"? overHours : new Set());
  $("#chartHint").textContent = S.gran==="hour"? `当日各小时 · 生产 ${fmt(s.prod)} / 不良 ${fmt(s.defect)}` : "近 30 天";

  // 分类统计
  const d = dimRows().sort((x,y)=> (x[S.sortKey]>y[S.sortKey]?1:x[S.sortKey]<y[S.sortKey]?-1:0)*S.sortDir);
  const maxR = Math.max(0.001, ...d.map(r=>r.rate));
  $("#dimBody").innerHTML = d.length? d.map(r=>{
    const w=Math.min(100, r.rate/maxR*100);
    const col = r.rate>S.limit? "var(--over)" : (r.rate>S.limit*0.7? "var(--watch)":"var(--ok)");
    return `<tr><td>${esc(r.k)}</td><td>${fmt(r.count)}</td><td>${fmt(r.prod)}</td>
      <td>${fmt(r.defect)}</td><td>${pct(r.rate)}<div class="bar"><i style="width:${w}%;background:${col}"></i></div></td></tr>`;
  }).join("") : '<tr><td colspan="5"><div class="empty">暂无数据</div></td></tr>';

  // 实时记录
  const rs = dayRows().sort((a,b)=>b.ts-a.ts).slice(0,40);
  $("#recent").innerHTML = rs.length? rs.map(r=>{
    const rt=rate(r.defect,r.prod);
    return `<tr class="${rt>S.limit?'bad':''}"><td>${String(r.hour).padStart(2,"0")}:${String(r.ts.getMinutes()).padStart(2,"0")}</td>
      <td>${esc(r.supplier)}</td><td>${esc(r.code)}</td><td>${esc(r.item)}</td>
      <td>${fmt(r.prod)}</td><td>${fmt(r.defect)}</td><td>${pct(rt)}</td></tr>`;
  }).join("") : '<tr><td colspan="7"><div class="empty">该日期暂无记录</div></td></tr>';

  const t = rs.length? rs[0].ts : null;
  $("#lastUpd").textContent = t? `${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}` : "—";
}

/* ---------- 节点明细弹窗 ---------- */
function openNode(sup, item){
  const rs = dayRows().filter(r=>r.supplier===sup && r.item===item).sort((a,b)=>a.ts-b.ts);
  if(!rs.length) return;
  const prod=rs.reduce((a,r)=>a+r.prod,0), def=rs.reduce((a,r)=>a+r.defect,0);
  $("#mTitle").textContent = `${sup} · ${item}`;
  $("#mSub").textContent = `生产 ${fmt(prod)}｜不良 ${fmt(def)}｜当日不良率 ${pct(rate(def,prod))}｜阈值 ${(S.limit*100).toFixed(2)}%`;
  const byC = new Map();
  rs.forEach(r=>{
    const k=r.hour+"|"+r.code;
    if(!byC.has(k)) byC.set(k,{hour:r.hour, code:r.code, prod:0, defect:0, n:0});
    const o=byC.get(k); o.prod+=r.prod; o.defect+=r.defect; o.n++;
  });
  const arr=[...byC.values()].map(o=>({...o, rate:rate(o.defect,o.prod)}))
    .sort((a,b)=> a.hour-b.hour || String(a.code).localeCompare(String(b.code)));
  const peak = Math.max(...arr.filter(x=>x.prod>=S.minSample).map(x=>x.rate), 0);
  const rows = arr.map(o=>{
    const bad = o.prod>=S.minSample && o.rate > S.limit;
    const isPeak = o.prod>=S.minSample && Math.abs(o.rate-peak) < 1e-9;
    return `<tr class="${bad?'bad':''}"><td>${String(o.hour).padStart(2,"0")}:00${isPeak?' <span style="color:var(--over);font-weight:700;font-size:10.5px">峰值</span>':''}</td>
      <td>${esc(o.code)}</td><td>${o.n}</td><td>${fmt(o.prod)}</td><td>${fmt(o.defect)}</td>
      <td style="color:${bad?'var(--over)':'inherit'};font-weight:${bad?'700':'400'}">${pct(o.rate)}</td></tr>`;
  }).join("");
  $("#mBody").innerHTML = `<table><thead><tr><th>时段</th><th>CODE</th><th>记录</th>
    <th>生产数</th><th>不良数</th><th>不良率</th></tr></thead><tbody>${rows}</tbody></table>`;
  $("#mask").classList.add("on");
}
$("#mClose").onclick = ()=>$("#mask").classList.remove("on");
$("#mask").onclick = e=>{ if(e.target.id==="mask") $("#mask").classList.remove("on"); };

/* ---------- 交互 ---------- */
$("#date").addEventListener("change", e=>{ S.date=e.target.value; render(); });
document.querySelectorAll("#segG button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#segG button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); S.gran=b.dataset.g; render();
}));
document.querySelectorAll("#tabs button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); S.dim=b.dataset.d; render();
}));
document.querySelectorAll("th").forEach(th=>th.addEventListener("click",()=>{
  const map={"名称":"k","记录数":"count","生产数":"prod","不良数":"defect","不良率":"rate"};
  const k=map[th.textContent.trim()]; if(!k) return;
  if(S.sortKey===k) S.sortDir*=-1; else { S.sortKey=k; S.sortDir=-1; }
  render();
}));

$("#btnSet").onclick = ()=>{
  const v = prompt("不良率阈值（%），当前 " + (S.limit*100).toFixed(2), (S.limit*100).toFixed(2));
  if(v===null) return;
  const n = parseFloat(v);
  if(isFinite(n) && n>0){ S.limit = n/100; render(); }
};
$("#btnCsv").onclick = ()=>{
  const head = ["时间","供应商","CODE","检查项目","生产数","不良数","不良率"];
  const lines=[head.join(",")];
  dayRows().sort((a,b)=>a.ts-b.ts).forEach(r=>{
    lines.push([`${r.day} ${String(r.hour).padStart(2,"0")}:${String(r.ts.getMinutes()).padStart(2,"0")}`,
      r.supplier, r.code, r.item, r.prod, r.defect, (rate(r.defect,r.prod)*100).toFixed(2)+"%"].join(","));
  });
  const blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`平衡块全检_${S.date}.csv`; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
};
$("#btnPick").onclick = ()=>{
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".csv,text/csv"; inp.multiple=true;
  inp.onchange=()=>{
    S.rows=[]; let pending=inp.files.length, ok=0;
    Array.from(inp.files).forEach(f=>{
      const rd=new FileReader();
      rd.onload=()=>{ const n=ingest(rd.result,f.name); if(n>0) ok+=n;
        if(--pending===0){ refresh(null); } };
      rd.readAsText(f,"utf-8");
    });
  };
  inp.click();
};

/* ---------- 启动 ---------- */
function refresh(silent){
  const days=[...new Set(S.rows.map(r=>r.day))].sort().reverse();
  if(!days.length) return;
  if(!S.date || !days.includes(S.date)) S.date = days[0];
  const el=$("#date"); el.value=S.date; el.max=days[0];
  render();
}

const clock=()=>{ const d=new Date(),p=n=>String(n).padStart(2,"0");
  $("#clock").textContent=`${["周日","周一","周二","周三","周四","周五","周六"][d.getDay()]} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
clock(); setInterval(clock,1000);

(function boot(){
  try{ const n=ingest(DEMO_CSV,"演示数据.csv"); if(n>0) refresh(); }catch(e){ console.warn(e); }
  // 演示数据：模拟每 5 秒有新记录（仅刷新视图时间感）
  setInterval(()=>{ if(S.rows.length) render(); }, 30000);
})();
</script>
</body>
