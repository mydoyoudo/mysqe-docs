<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBA 供应商管理</title>
<style>
  :root{--blue:#2196F3;--ink:#1c2733;--sub:#5b6b7c;--line:#e2e8ef;--bg:#eef2f6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink)}
  header{background:linear-gradient(135deg,#2196F3,#1976D2);color:#fff;padding:14px 22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:18px;margin:0}
  header .spacer{flex:1}
  header input,header button{border:none;border-radius:8px;padding:8px 12px;font-size:13px}
  header input{width:220px}
  header button{background:rgba(255,255,255,.2);color:#fff;cursor:pointer}
  main{max-width:1100px;margin:0 auto;padding:18px}
  .card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(16,32,56,.08);padding:16px;margin-bottom:16px}
  .card h2{font-size:14px;margin:0 0 12px;color:#33475b}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row input{flex:1;min-width:160px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px}
  .row button{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #f1f4f8}
  th{color:var(--sub);font-weight:600;font-size:12px}
  .link{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#1565C0;word-break:break-all}
  .mini{font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--line);background:#f8fafc;cursor:pointer}
  .mini.red{color:#c0392b;border-color:#f3c9c4;background:#fdf1ef}
  .chip{display:inline-block;background:#eef5fd;color:#1565C0;border-radius:20px;padding:2px 9px;font-size:11.5px;margin-right:4px}
  .hint{color:var(--sub);font-size:12.5px;margin-top:10px;line-height:1.6}
  .empty{color:#95a3b3;font-size:13px;padding:14px 0}
</style>
</head>
<body>
<header>
  <h1>PBA 供应商管理</h1>
  <span style="font-size:12px;opacity:.85">每个供应商一条专属链接</span>
  <div class="spacer"></div>
  <input id="key" type="password" placeholder="管理口令 (admin key)">
  <button id="save">保存口令并加载</button>
</header>

<main>
  <div class="card">
    <h2>新增供应商</h2>
    <div class="row">
      <input id="name" placeholder="供应商名称（如 JIANGYIN）">
      <input id="factory" placeholder="工厂（如 1工厂）">
      <input id="lines" placeholder="产线，逗号分隔（如 L1,L2）">
      <button id="add">生成专属链接</button>
    </div>
    <div class="hint">生成的链接直接发给对应供应商；他们打开后只能看到自己的产线与点检数据，监控看板能看到全部供应商。</div>
  </div>

  <div class="card">
    <h2>供应商列表</h2>
    <table>
      <thead><tr><th>供应商</th><th>工厂</th><th>产线</th><th>专属链接</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="5" class="empty">输入管理口令后加载</td></tr></tbody>
    </table>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BASE = location.origin;   // 页面与 API 同源
let KEY = localStorage.getItem('pbaAdminKey') || '';

function api(method, path, body) {
  return fetch(BASE + '/api/pba?p=' + encodeURIComponent(path), {
    method, headers: { 'Content-Type': 'application/json', 'x-admin-key': KEY },
    body: body ? JSON.stringify(body) : undefined,
  }).then(async (r) => {
    const t = await r.text();
    let d = null; try { d = JSON.parse(t); } catch (e) { d = t; }
    if (!r.ok) throw new Error((d && d.error) || r.status);
    return d;
  });
}

function link(token) {
  return BASE + '/pba/?s=' + token;
}

async function load() {
  if (!KEY) return;
  try {
    const rows = await api('GET', '/suppliers');
    if (!rows.length) { $('rows').innerHTML = '<tr><td colspan="5" class="empty">还没有供应商</td></tr>'; return; }
    $('rows').innerHTML = rows.map((s) => `<tr>
      <td><b>${esc(s.name)}</b>${s.active ? '' : ' <span style="color:#c0392b;font-size:11px">已停用</span>'}</td>
      <td>${esc(s.factory || '')}</td>
      <td>${(s.lines || []).map((l) => `<span class="chip">${esc(l)}</span>`).join('')}</td>
      <td><div class="link">${esc(link(s.token))}</div></td>
      <td style="white-space:nowrap">
        <button class="mini" data-copy="${esc(link(s.token))}">复制</button>
        <button class="mini red" data-del="${esc(s.id)}">停用</button>
      </td></tr>`).join('');
  } catch (e) {
    $('rows').innerHTML = `<tr><td colspan="5" class="empty">加载失败：${esc(e.message)}（检查管理口令）</td></tr>`;
  }
}

document.addEventListener('click', async (ev) => {
  const t = ev.target;
  if (t.dataset.copy) {
    try { await navigator.clipboard.writeText(t.dataset.copy); t.textContent = '已复制'; setTimeout(() => (t.textContent = '复制'), 1200); } catch (e) {}
  }
  if (t.dataset.del) {
    if (!confirm('停用该供应商？其历史数据保留。')) return;
    await api('DELETE', '/suppliers/' + encodeURIComponent(t.dataset.del));
    load();
  }
});

$('save').onclick = () => {
  KEY = $('key').value.trim();
  if (!KEY) return;
  localStorage.setItem('pbaAdminKey', KEY);
  load();
};

$('add').onclick = async () => {
  const name = $('name').value.trim();
  if (!name) { alert('请填写供应商名称'); return; }
  const lines = $('lines').value.split(/[,，\s]+/).map((x) => x.trim()).filter(Boolean);
  try {
    const r = await api('POST', '/suppliers', { name, factory: $('factory').value.trim(), lines });
    $('name').value = ''; $('factory').value = ''; $('lines').value = '';
    load();
    alert('已生成：\n' + link(r.token));
  } catch (e) { alert('创建失败：' + e.message); }
};

$('key').value = KEY;
if (KEY) load();
</script>
</body>
</html>
