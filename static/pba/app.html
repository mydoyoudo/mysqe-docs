// ===== Report Detail Screen =====
Screens.reportDetail = async function(container, params) {
  const {inspectionId} = params;
  const inspection = await DB.getInspectionById(inspectionId);
  const results = await DB.getInspectionResults(inspectionId);
  const allItems = await DB.getChecklistItems(0);

  if (!inspection) {
    container.innerHTML = `<div class="empty-state">${I18N.t('resultNotFound')}</div>`;
    return;
  }

  // 항목 내용/점검방법 조회: 항목 id → 없으면 공정명+항목번호 → 앱 내장 원본 순으로 찾기
  const allChecklistItems = await DB.getAllChecklistItems() || [];
  const procNameById = {};
  const procDisplayByName = {};
  (await DB.getAllProcesses() || []).forEach(p => { procNameById[p.id] = p.name; procDisplayByName[p.name] = p.displayName || p.name; });
  const itemById = {};
  const itemByKey = {};
  allChecklistItems.forEach(it => {
    itemById[it.id] = it;
    itemByKey[(procNameById[it.processId] || '') + '|' + String(it.no)] = it;
  });
  const procName = inspection.processName || '';
  function findItemInfo(r) {
    const byId = itemById[r.checklistItemId];
    const no = (byId && byId.no) || r.itemNo || '';
    const dbItem = byId || (no ? itemByKey[procName + '|' + String(no)] : null);
    const master = (typeof ChecklistData !== 'undefined' && no)
      ? ((ChecklistData.items || {})[procName] || []).find(it => String(it.no) === String(no))
      : null;
    return {
      no: no,
      checkItem: (dbItem && dbItem.checkItem) || (master && master.checkItem) || '',
      checkMethod: (dbItem && dbItem.checkMethod) || (master && master.checkMethod) || '',
    };
  }

  // 실제 판정 수행 항목(합격+불합+보류) 기준 — 해당없음·미점검 항목은 분모에서 제외
  const naDenom = (inspection.passCount || 0) + (inspection.failCount || 0) + (inspection.holdCount || 0);
  const passRate = naDenom > 0 ? Math.round(((inspection.passCount || 0) / naDenom) * 100) : 0;

  let html = `
    <div class="card">
      <div class="card-info-row"><span class="card-info-label">${I18N.t('processLabel')}</span><span class="card-info-value">${procDisplayByName[inspection.processName] || inspection.processName}</span></div>
      <div class="card-info-row"><span class="card-info-label">${I18N.t('partner')}</span><span class="card-info-value">${inspection.partnerName}</span></div>
      <div class="card-info-row"><span class="card-info-label">${I18N.t('factory')}</span><span class="card-info-value">${inspection.factoryName}</span></div>
      <div class="card-info-row"><span class="card-info-label">Line</span><span class="card-info-value">${inspection.lineName}</span></div>
      <div class="card-info-row"><span class="card-info-label">${I18N.t('inspector')}</span><span class="card-info-value">${inspection.inspector || '-'}</span></div>
      <div class="card-info-row"><span class="card-info-label">${I18N.t('dateLabel')}</span><span class="card-info-value">${inspection.date}</span></div>
    </div>

    <div class="card">
      <div class="report-stats">
        <div class="stat-item"><div class="stat-value">${inspection.totalCount}</div><div class="stat-label">${I18N.t('totalCountLabel')}</div></div>
        <div class="stat-item"><div class="stat-value" style="color:#43a047">${inspection.passCount}</div><div class="stat-label">${I18N.t('statusPass')}</div></div>
        <div class="stat-item"><div class="stat-value" style="color:#e53935">${inspection.failCount}</div><div class="stat-label">${I18N.t('statusFail')}</div></div>
        <div class="stat-item"><div class="stat-value" style="color:${passRate >= 90 ? '#43a047' : '#e53935'}">${passRate}%</div><div class="stat-label">${I18N.t('passRateLabel')}</div></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">${I18N.t('resultsByItem')}</div>
      <div class="result-item-grid">${results.map((r, idx) => {
        const statusText = {pass: I18N.t('rdPass'), fail: I18N.t('rdFail'), hold: I18N.t('rdHold'), na: I18N.t('rdNA'), pending: I18N.t('rdPending')}[r.status] || '-';
        const statusColor = {pass: '#43a047', fail: '#e53935', hold: '#ff9800', na: '#757575', pending: '#999'}[r.status] || '#999';
        const photos = r.photoUri ? r.photoUri.split('||').filter(Boolean) : [];
        const info = findItemInfo(r);
        return `
          <div class="checklist-item">
            <div class="item-header">
              <div class="item-header-left">
                <span class="status-icon">${{pass:'✅',fail:'❌',hold:'⏸️',na:'⊘',pending:'⏳'}[r.status] || '⏳'}</span>
                <span class="item-no">${info.no || idx + 1}</span>
              </div>
              <span class="item-title" style="color:${statusColor};font-weight:bold;">${statusText}</span>
            </div>
            ${info.checkItem ? `<div class="item-detail"><div class="detail-text">${info.checkItem}</div></div>` : ''}
            ${info.checkMethod ? `<div class="item-detail"><div class="detail-text"><span class="detail-label">${I18N.t('checkMethodLabel')}</span><pre style="white-space:pre-wrap;font-family:inherit;font-size:13px;margin:0;">${info.checkMethod}</pre></div></div>` : ''}
            ${r.remark ? `<div class="item-detail"><div class="detail-text"><span class="detail-label">${r.status === 'na' ? I18N.t('rdNAReason') : I18N.t('rdRemark')}</span>${r.remark}</div></div>` : ''}
            ${photos.length > 0 ? `<div class="item-detail"><div class="detail-label">${I18N.t('attachedPhotos')}(${photos.length})</div><div class="photo-container">${photos.map(uri => `<div class="photo-thumb"><img src="${uri}" alt="photo"></div>`).join('')}</div></div>` : ''}
          </div>
        `;
      }).join('')}</div>
    </div>

  `;

  container.innerHTML = html;
};


// ===== js/screens/dashboard.js =====
// ===== Dashboard Screen =====
Screens.dashboard = async function(container, params) {
  const dashSettings = await DB.getSettings();
  const dashMonitorMode = !!dashSettings.monitorMode;
  const allInspections = await DB.getAllInspections() || [];
  const lines = await DB.getAllLines() || [];
  const allProcesses = await DB.getAllProcesses() || [];

  const allChecklistItems = await DB.getAllChecklistItems() || [];

  let activeTab = 'week'; // 'day', 'week', 'month', 'custom'
  let currentDate = new Date(); // 기준 ${I18N.t('date')} (일별/주차별/월별 내비게이션)
  let calendarMonth = new Date(); // 달력 팝업에 표시할 월
  let showCalendar = false; // 달력 팝업 표시 여부
  let selectedLineFilter = 'all'; // 'all' 또는 라인 ${I18N.t('phUserName')}
  let selectedPartnerFilter = 'all'; // 'all' 또는 협력사명
  let selectedTypeFilter = 'all'; // 'all' | 'daily'(일반 점검) | 'monthly'(정밀점검) — 기본: 전체 집계
  let selectedDashLine = null; // Line 카드 클릭 시 펼쳐지는 공정별 세부내역의 Line명
  let selectedDashProc = null; // 공정 클릭 시 펼쳐지는 점검 상세의 키 ('Line명|||공정명')
  let dashProcDetailCache = {}; // procKey -> { loading, records:[{inspection, results}] } 항목별 결과 캐시
  let dashProcRecords = {}; // procKey -> 현재 필터/기간 기준 해당 공정 점검 기록 목록 (render마다 갱신)
  let dashItemTextMap = null; // checklistItemId -> 항목 데이터 (항목 내용 표시용)
  let openCard = null; // 요약 카드 클릭 시 펼쳐지는 상세 패널 ('count' | 'pass' | 'fail' | 'rate')
  let failDetailCache = {}; // inspectionId -> { loading, fails } 불합격 항목 캐시 (요약 카드 상세용)
  let customStartDate = '';
  let customEndDate = '';
  let lineSearchKeyword = ''; // Line 검색어

  // Helper: get ISO week number
  function getWeekNumber(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
    const week1 = new Date(d.getFullYear(), 0, 4);
    return 1 + Math.round(((d - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  }

  // Helper: get Monday of the week
  function getMonday(date) {
    const d = new Date(date);
    const day = d.getDay();
    const diff = d.getDate() - day + (day === 0 ? -6 : 1);
    return new Date(d.setDate(diff));
  }

  // Helper: format date as YYYY-MM-DD
  function formatDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  // Calculate stats for a set of inspections
  function calcStats(insps) {
    const total = insps.length;
    const pass = insps.filter(i => {
      // 실제 판정 수행 항목(합격+불합+보류) 기준 — 해당없음·미점검 항목은 분모에서 제외
      const denom = (i.passCount || 0) + (i.failCount || 0) + (i.holdCount || 0);
      return denom > 0 && ((i.passCount || 0) / denom) >= 0.9;
    }).length;
    const fail = insps.filter(i => i.failCount > 0).length;
    const totalItems = insps.reduce((sum, i) => sum + (i.totalCount || 0), 0);
    const totalPass = insps.reduce((sum, i) => sum + (i.passCount || 0), 0);
    const totalFail = insps.reduce((sum, i) => sum + (i.failCount || 0), 0);
    const totalHold = insps.reduce((sum, i) => sum + (i.holdCount || 0), 0);
    const totalNA = insps.reduce((sum, i) => sum + (i.naCount || 0), 0);
    const totalPending = Math.max(0, totalItems - totalNA - totalPass - totalFail - totalHold);
    // 합격률 = 합격 ÷ 실제 판정 수행 항목(합격+불합+보류) — 해당없음·미점검 항목은 분모에서 제외
    // (운영기준이 Line별 월 1회 점검으로 부분 점검 허용 → 미점검 항목이 합격률을 깎지 않도록 함)
    const denom = totalPass + totalFail + totalHold;
    const passRate = denom > 0 ? Math.round((totalPass / denom) * 100) : 0;
    return { total, pass, fail, totalItems, totalPass, totalFail, totalHold, totalNA, totalPending, passRate };
  }

  // 공정명|항목번호 → 항목 데이터 (항목 id가 바뀐 과거 기록도 찾기 위한 보조 맵)
  let dashItemKeyMap = null;
  function findDashItem(r, insp) {
    const byId = dashItemTextMap ? dashItemTextMap[r.checklistItemId] : null;
    if (byId) return byId;
    const no = r.itemNo || '';
    if (!no) return null;
    if (!dashItemKeyMap) {
      const procNameById = {};
      allProcesses.forEach(p => { procNameById[p.id] = p.name; });
      dashItemKeyMap = {};
      allChecklistItems.forEach(it => { dashItemKeyMap[(procNameById[it.processId] || '') + '|' + String(it.no)] = it; });
    }
    const procName = (insp && insp.processName) || '';
    return dashItemKeyMap[procName + '|' + String(no)] || null;
  }

  // 앱에 내장된 점검 항목 원본(checklist-data.js)에서 공정명 + 항목번호로 찾기 (DB 항목 내용이 비어 있을 때 보충용)
  function findMasterItem(no, procName) {
    if (typeof ChecklistData === 'undefined' || !no || !procName) return null;
    const list = (ChecklistData.items || {})[procName] || [];
    return list.find(it => String(it.no) === String(no)) || null;
  }

  // 항목별 결과 행의 항목 설명: 점검 항목 내용 + 점검 방법
  function itemInfoHtml(r, insp) {
    const dbItem = findDashItem(r, insp);
    const no = (dbItem && dbItem.no) || r.itemNo || '';
    const master = findMasterItem(no, (insp && insp.processName) || '');
    const item = {
      no: no,
      checkItem: (dbItem && dbItem.checkItem) || (master && master.checkItem) || '',
      checkMethod: (dbItem && dbItem.checkMethod) || (master && master.checkMethod) || '',
    };
    const title = (item.no || item.checkItem) ? `${item.no ? item.no + '. ' : ''}${item.checkItem}` : '';
    const method = item.checkMethod ? String(item.checkMethod).trim() : '';
    return `<div style="color:#555;word-break:break-word;">${title}</div>`
      + (method ? `<div style="font-size:11px;color:#888;margin-top:2px;white-space:pre-wrap;word-break:break-word;">🔎 ${method}</div>` : '');
  }

  // ===== 공정 클릭 상세: 해당 공정 점검 기록의 항목별 결과(합격/불합격/사진/비고) =====
  async function loadDashProcDetail(procKey, records) {
    if (dashProcDetailCache[procKey]) return; // 이미 로딩 중이거나 로드 완료
    dashProcDetailCache[procKey] = { loading: true, records: [] };
    try {
      // 항목 내용 매핑 (최초 1회)
      if (!dashItemTextMap) {
        dashItemTextMap = {};
        (allChecklistItems || []).forEach(it => { dashItemTextMap[it.id] = it; });
      }
      const out = [];
      for (const insp of records) {
        let results = [];
        try { results = await DB.getInspectionResults(insp.id) || []; } catch (e) { results = []; }
        results = results.filter(r => r && r.status && r.status !== 'pending');
        results.sort((a, b) => String(a.itemNo || '').localeCompare(String(b.itemNo || ''), 'ko', { numeric: true }));
        out.push({ inspection: insp, results });
      }
      dashProcDetailCache[procKey] = { loading: false, records: out };
    } catch (e) {
      console.error('[dashboard] 공정 상세 로딩 실패:', e);
      dashProcDetailCache[procKey] = { loading: false, records: [] };
    }
    render();
  }

  function renderDashProcDetail(procKey) {
    const cache = dashProcDetailCache[procKey];
    if (!cache || cache.loading) {
      loadDashProcDetail(procKey, dashProcRecords[procKey] || []);
      return `<div style="padding:10px 4px;font-size:12px;color:#999;">⏳ ${I18N.t('loadingDetail')}</div>`;
    }
    if (!cache.records.length) return `<div style="padding:10px 4px;font-size:12px;color:#999;">${I18N.t('noResultsPeriod')}</div>`;
    return cache.records.map(({ inspection, results }) => {
      const rDenom = (inspection.passCount || 0) + (inspection.failCount || 0) + (inspection.holdCount || 0);
      const rRate = rDenom > 0 ? Math.round(((inspection.passCount || 0) / rDenom) * 100) : 0;
      return `
        <div data-dash-proc-detail style="background:#fff;border:1px solid #e0e0e0;border-radius:6px;margin:8px 0 2px;padding:8px;">
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:bold;color:#333;margin-bottom:4px;">
            <span>📅 ${inspection.date || '-'} · ${inspection.inspector || '-'}</span>
            <span style="color:${rRate >= 90 ? '#43a047' : '#e53935'}">📊 ${rRate}%</span>
          </div>
          ${results.map(r => {
            const statusText = { pass: I18N.t('rdPass'), fail: I18N.t('rdFail'), hold: I18N.t('rdHold'), na: I18N.t('rdNA'), pending: I18N.t('rdPending') }[r.status] || '-';
            const statusColor = { pass: '#43a047', fail: '#e53935', hold: '#ff9800', na: '#757575', pending: '#999' }[r.status] || '#999';
            const photos = r.photoUri ? String(r.photoUri).split('||').filter(Boolean) : [];
            return `
              <div style="padding:6px 2px;border-bottom:1px solid #f0f0f0;">
                <div style="display:flex;gap:6px;align-items:flex-start;font-size:12px;">
                  <span style="flex-shrink:0;">${{ pass: '✅', fail: '❌', hold: '⏸️', na: '⊘' }[r.status] || '⏳'}</span>
                  <span style="color:${statusColor};font-weight:bold;white-space:nowrap;">${statusText}</span>
                  <div style="flex:1;min-width:0;">${itemInfoHtml(r, inspection)}</div>
                </div>
                ${r.remark ? `<div style="font-size:12px;color:#666;margin:4px 0 0 24px;word-break:break-word;">📝 ${r.status === 'na' ? I18N.t('rdNAReason') : I18N.t('rdRemark')}: ${r.remark}</div>` : ''}
                ${photos.length > 0 ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0 24px;">${photos.map(uri => `<img src="${uri}" alt="photo" class="dash-photo">`).join('')}</div>` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }).join('');
  }

  // ===== 요약 카드 상세: 불합격 항목 (기록별 ❌ 항목 + 비고 + 사진) =====
  async function loadFailDetail(inspId) {
    if (failDetailCache[inspId]) return;
    failDetailCache[inspId] = { loading: true, fails: [] };
    try {
      if (!dashItemTextMap) {
        dashItemTextMap = {};
        (allChecklistItems || []).forEach(it => { dashItemTextMap[it.id] = it; });
      }
      let results = [];
      try { results = await DB.getInspectionResults(inspId) || []; } catch (e) { results = []; }
      const fails = results.filter(r => r && r.status === 'fail')
        .sort((a, b) => String(a.itemNo || '').localeCompare(String(b.itemNo || ''), 'ko', { numeric: true }));
      failDetailCache[inspId] = { loading: false, fails };
    } catch (e) {
      console.error('[dashboard] 불합격 상세 로딩 실패:', e);
      failDetailCache[inspId] = { loading: false, fails: [] };
    }
    render();
  }

  function renderFailRecordDetail(i) {
    const cache = failDetailCache[i.id];
    if (!cache || cache.loading) {
      loadFailDetail(i.id);
      return `
        <div style="background:#fff;border:1px solid #f0f0f0;border-radius:6px;margin:6px 0;padding:8px;">
          <div style="font-size:12px;font-weight:bold;color:#333;">❌ ${i.date || '-'} · Line ${i.lineName || '-'} · ${i.processName || '-'} · ${I18N.t('inspectorColon')}${i.inspector || '-'}</div>
          <div style="font-size:12px;color:#999;margin-top:4px;">⏳ ${I18N.t('loadingDetail')}</div>
        </div>
      `;
    }
    return `
      <div style="background:#fff;border:1px solid #f0f0f0;border-radius:6px;margin:6px 0;padding:8px;">
        <div style="font-size:12px;font-weight:bold;color:#333;margin-bottom:4px;">❌ ${i.date || '-'} · Line ${i.lineName || '-'} · ${i.processName || '-'} · ${I18N.t('inspectorColon')}${i.inspector || '-'}</div>
        ${cache.fails.length === 0 ? `<div style="font-size:12px;color:#999;">-</div>` : cache.fails.map(r => {
          const photos = r.photoUri ? String(r.photoUri).split('||').filter(Boolean) : [];
          return `
            <div style="padding:6px 2px;border-bottom:1px solid #f0f0f0;">
              <div style="display:flex;gap:6px;align-items:flex-start;font-size:12px;">
                <span style="flex-shrink:0;">❌</span>
                <div style="flex:1;min-width:0;">${itemInfoHtml(r, i)}</div>
              </div>
              ${r.remark ? `<div style="font-size:12px;color:#666;margin:4px 0 0 24px;word-break:break-word;">📝 ${I18N.t('rdRemark')}: ${r.remark}</div>` : ''}
              ${photos.length > 0 ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0 24px;">${photos.map(uri => `<img src="${uri}" alt="photo" class="dash-photo">`).join('')}</div>` : ''}
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  // 달력 팝업 HTML 생성
  function renderCalendarPopup() {
    const year = calendarMonth.getFullYear();
    const month = calendarMonth.getMonth();
    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month + 1, 0);
    const startWeekday = firstDay.getDay();
    const daysInMonth = lastDay.getDate();
    const weekdays = I18N.t('weekdayNames').split('|');
    const todayStr = formatDate(new Date());

    let calHtml = `<div class="calendar-popup-overlay" id="calOverlay"></div>`;
    calHtml += `<div class="calendar-popup">`;
    calHtml += `<div class="calendar-header">`;
    calHtml += `<button class="calendar-nav-btn" data-cal-nav="prev-month">‹</button>`;
    calHtml += `<span class="calendar-title">${I18N.t('yearMonthFmt', String(year), String(month + 1))}</span>`;
    calHtml += `<button class="calendar-nav-btn" data-cal-nav="next-month">›</button>`;
    calHtml += `</div>`;
    calHtml += `<button class="calendar-today-btn" data-cal-nav="today">${I18N.t('calendarToday')}</button>`;
    calHtml += `<div class="calendar-weekdays">`;
    weekdays.forEach(wd => { calHtml += `<div class="calendar-weekday">${wd}</div>`; });
    calHtml += `</div>`;
    calHtml += `<div class="calendar-grid">`;
    for (let i = 0; i < startWeekday; i++) {
      calHtml += `<div class="calendar-day empty"></div>`;
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const isSelected = dateStr === formatDate(currentDate);
      const isToday = dateStr === todayStr;
      calHtml += `<div class="calendar-day ${isSelected ? 'selected' : ''} ${isToday ? 'today' : ''}" data-cal-date="${dateStr}">${d}</div>`;
    }
    calHtml += `</div>`;
    calHtml += `</div>`;
    return calHtml;
  }

  function render() {
    const now = new Date();
    let filtered = [];
    let periodLabel = '';

    if (activeTab === 'day') {
      const dayStr = formatDate(currentDate);
      filtered = allInspections.filter(i => i.date === dayStr);
      const weekdays = I18N.t('weekdayNames').split('|');
      periodLabel = I18N.t('dateFmt', String(currentDate.getFullYear()), String(currentDate.getMonth() + 1), String(currentDate.getDate()), weekdays[currentDate.getDay()]);
    } else if (activeTab === 'week') {
      const monday = getMonday(currentDate);
      const sunday = new Date(monday);
      sunday.setDate(sunday.getDate() + 6);
      const mondayStr = formatDate(monday);
      const sundayStr = formatDate(sunday);
      filtered = allInspections.filter(i => i.date >= mondayStr && i.date <= sundayStr);
      const weekNum = getWeekNumber(currentDate);
      periodLabel = `${I18N.t('weekFmt', String(currentDate.getFullYear()), String(weekNum))} (${monday.getMonth() + 1}/${monday.getDate()} ~ ${sunday.getMonth() + 1}/${sunday.getDate()})`;
    } else if (activeTab === 'month') {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const monthStr = `${year}-${String(month + 1).padStart(2, '0')}`;
      filtered = allInspections.filter(i => i.date && i.date.startsWith(monthStr));
      periodLabel = `${I18N.t('yearMonthFmt', String(year), String(month + 1))}`;
    } else if (activeTab === 'custom') {
      if (customStartDate && customEndDate) {
        filtered = allInspections.filter(i => i.date >= customStartDate && i.date <= customEndDate);
        periodLabel = `${customStartDate} ~ ${customEndDate}`;
      } else if (customStartDate) {
        filtered = allInspections.filter(i => i.date >= customStartDate);
        periodLabel = `${customStartDate} ~ ${I18N.t('today')}`;
      } else if (customEndDate) {
        filtered = allInspections.filter(i => i.date <= customEndDate);
        periodLabel = `${I18N.t('allPeriod')} ~ ${customEndDate}`;
      } else {
        filtered = allInspections.slice();
        periodLabel = I18N.t('allTime');
      }
    }

    // Line 필터 적용
    if (selectedLineFilter !== 'all') {
      filtered = filtered.filter(i => i.lineName === selectedLineFilter);
    }

    // 협력사 필터 적용
    if (selectedPartnerFilter !== 'all') {
      filtered = filtered.filter(i => (i.partnerName || '') === selectedPartnerFilter);
    }

    // 점검 유형 필터 적용 (daily=일반 점검, monthly=정밀점검)
    if (selectedTypeFilter !== 'all') {
      filtered = filtered.filter(i => (i.inspectionType || 'daily') === selectedTypeFilter);
    }

    const stats = calcStats(filtered);

    // Group by Line
    const byLine = {};
    filtered.forEach(i => {
      const key = i.lineName || 'Unknown';
      if (!byLine[key]) byLine[key] = [];
      byLine[key].push(i);
    });

    // 공정 클릭 상세용: 현재 필터/기간 기준 Line+공정 키별 기록 맵
    dashProcRecords = {};
    filtered.forEach(i => {
      const key = (i.lineName || 'Unknown') + '|||' + (i.processName || 'Unknown');
      if (!dashProcRecords[key]) dashProcRecords[key] = [];
      dashProcRecords[key].push(i);
    });
    Object.keys(dashProcRecords).forEach(k => dashProcRecords[k].sort((a, b) => (b.date || '').localeCompare(a.date || '')));

    // Group by Process
    const byProcess = {};
    filtered.forEach(i => {
      const key = i.processName || 'Unknown';
      if (!byProcess[key]) byProcess[key] = [];
      byProcess[key].push(i);
    });

    // Group by Partner
    const byPartner = {};
    filtered.forEach(i => {
      const key = i.partnerName || '';
      if (!byPartner[key]) byPartner[key] = [];
      byPartner[key].push(i);
    });

    // 협력사 필터 버튼 목록 (기간 무관 전체 점검 기준 고유 협력사)
    const partnerNames = [];
    allInspections.forEach(i => {
      const name = i.partnerName || '';
      if (!partnerNames.includes(name)) partnerNames.push(name);
    });
    partnerNames.sort((a, b) => a.localeCompare(b, 'ko'));

    const todayStr = formatDate(now);

    // ===== 이번 달 점검 여부 알람 (라인별) =====
    // 운영 기준: Line별 월 1회 이상 점검. 한 달에 여러 번 점검해도 무방하며,
    // 이번 달 일반 점검 기록이 하나도 없는 라인만 알람 (정밀점검은 운영 주기가 없어 제외)
    const thisMonthStr = todayStr.slice(0, 7);
    const lineAlarms = lines.map(line => {
      const lineDates = allInspections.filter(i => i.lineName === line.name && i.date && (i.inspectionType || 'daily') === 'daily').map(i => i.date).sort();
      const lastDate = lineDates.length ? lineDates[lineDates.length - 1] : null;
      const doneThisMonth = lineDates.some(d => d.startsWith(thisMonthStr));
      return { line, lastDate, doneThisMonth };
    });
    const overdueLines = lineAlarms.filter(a => !a.doneThisMonth);
    // 총괄 관리 모드: 라인 기반 점검 알람은 표시하지 않음
    const alarmHtml = dashMonitorMode ? '' : `
      <div class="section" id="alarmSection">
        <div class="section-title">
          <span>${I18N.t('alarmTitle')}</span>
        </div>
        ${overdueLines.length === 0 ? `
          <div class="dashboard-line-card" style="border-left:4px solid #43a047;">
            <div class="dashboard-line-name" style="color:#43a047;font-size:13px;">${I18N.t('alarmAllOk')}</div>
          </div>` : overdueLines.map(a => `
          <div class="dashboard-line-card" style="border-left:4px solid #e53935;background:#fff5f5;">
            <div class="dashboard-line-header">
              <span class="dashboard-line-name" style="color:#e53935;">⚠️ Line ${a.line.name}</span>
              <span class="dashboard-line-count" style="color:#e53935;font-weight:bold;">${I18N.t('alarmNoThisMonth')}</span>
            </div>
            <div style="font-size:12px;color:#888;margin-top:4px;">
              ${I18N.t('lastInspectionLabel')}: ${a.lastDate || I18N.t('noRecordShort')}
            </div>
          </div>`).join('')}
      </div>
    `;

    let html = `
      <!-- Tab Bar -->
      <div class="tab-bar">
        <button class="tab-btn ${activeTab === 'day' ? 'active' : ''}" data-tab="day">${I18N.t('tabByDay')}</button>
        <button class="tab-btn ${activeTab === 'week' ? 'active' : ''}" data-tab="week">${I18N.t('tabByWeek')}</button>
        <button class="tab-btn ${activeTab === 'month' ? 'active' : ''}" data-tab="month">${I18N.t('tabByMonth')}</button>
        <button class="tab-btn ${activeTab === 'custom' ? 'active' : ''}" data-tab="custom">${I18N.t('tabCustom')}</button>
      </div>
    `;

    html = alarmHtml + html;

    // 사용자 지정 기간: 날짜 입력 영역
    if (activeTab === 'custom') {
      html += `
        <div class="filter-row filter-custom-row" style="padding:10px 15px;background:#fff;border-bottom:1px solid #eee;align-items:center;gap:8px;">
          <input type="date" class="date-input" id="dashCustomStart" value="${customStartDate}" max="${customEndDate || todayStr}">
          <span style="color:#999;font-size:14px;">~</span>
          <input type="date" class="date-input" id="dashCustomEnd" value="${customEndDate}" min="${customStartDate || ''}" max="${todayStr}">
          <button class="filter-btn active" id="dashApplyCustom">${I18N.t('applyBtn')}</button>
        </div>
      `;
    }

    // Line 필터 버튼 영역 (검색 + 스크롤)
    const lineSearchTerm = (typeof lineSearchKeyword !== 'undefined' ? lineSearchKeyword : '');
    const filteredLineList = lineSearchTerm
      ? lines.filter(l => String(l.name).toLowerCase().includes(lineSearchTerm.toLowerCase()))
      : lines;
    const showLineSearch = lines.length > 10;
    const useScroll = lines.length > 8;

    // 점검 유형 필터 버튼 영역 (일반 점검 vs 정밀점검)
    html += `
      <div style="padding:8px 15px 0;background:#fff;">
        <div class="filter-row" style="flex-wrap:wrap;gap:6px;">
          <button class="filter-btn ${selectedTypeFilter === 'all' ? 'active' : ''}" data-type-filter="all">${I18N.t('allPeriod')}</button>
          <button class="filter-btn ${selectedTypeFilter === 'daily' ? 'active' : ''}" data-type-filter="daily">📋 ${I18N.t('daily')}</button>
          <button class="filter-btn ${selectedTypeFilter === 'monthly' ? 'active' : ''}" data-type-filter="monthly">🔬 ${I18N.t('monthly')}</button>
        </div>
      </div>
    `;

    // 협력사 필터 버튼 영역 (협력사가 2개 이상일 때만 노출)
    if (partnerNames.length >= 2) {
      html += `
        <div style="padding:8px 15px ${dashMonitorMode ? '8px' : '0'};background:#fff;">
          <div class="filter-row" style="flex-wrap:wrap;gap:6px;">
            <button class="filter-btn ${selectedPartnerFilter === 'all' ? 'active' : ''}" data-partner-filter="all">${I18N.t('allPeriod')} ${I18N.t('partner')}</button>
            ${partnerNames.map(p => `<button class="filter-btn ${selectedPartnerFilter === p ? 'active' : ''}" data-partner-filter="${p}">${p || I18N.t('unspecified')}</button>`).join('')}
          </div>
        </div>
      `;
    }

    if (!dashMonitorMode) html += `
      <div style="padding:8px 15px;background:#fff;border-bottom:1px solid #eee;">
        <div class="filter-row ${useScroll ? 'dash-line-scroll' : ''}" style="flex-wrap:wrap;gap:6px;margin-bottom:${showLineSearch ? '8px' : '0'};">
          <button class="filter-btn ${selectedLineFilter === 'all' ? 'active' : ''}" data-line-filter="all">${I18N.t('allPeriod')} Line</button>
          ${filteredLineList.map(l => `<button class="filter-btn ${selectedLineFilter === l.name ? 'active' : ''}" data-line-filter="${l.name}">Line ${l.name}</button>`).join('')}
          ${lineSearchTerm && filteredLineList.length === 0 ? `<span style="font-size:13px;color:#999;padding:4px 0;">${I18N.t('noSearchResults')}</span>` : ''}
        </div>
        ${showLineSearch ? `
          <div style="display:flex;align-items:center;gap:6px;">
            <input type="text" id="dashLineSearch" placeholder="${I18N.t('phLineSearch')}" value="${lineSearchTerm}" style="flex:1;padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none;">
            ${lineSearchTerm ? `<button class="filter-btn" id="dashLineSearchClear" style="padding:6px 10px;">✕</button>` : ''}
          </div>
        ` : ''}
      </div>
    `;

    // Period Label with navigation buttons
    const showNav = activeTab !== 'custom';
    html += `<div class="dashboard-period-nav">`;
    if (showNav) {
      html += `<button class="period-nav-btn" data-dir="prev">‹</button>`;
    }
    html += `<div class="dashboard-period ${showNav ? 'clickable' : ''}" id="periodLabel">${periodLabel}${selectedTypeFilter !== 'all' ? ` | ${selectedTypeFilter === 'daily' ? I18N.t('daily') : I18N.t('monthly')}` : ''}${selectedPartnerFilter !== 'all' ? ` | ${selectedPartnerFilter || I18N.t('unspecified')}` : ''}${selectedLineFilter !== 'all' ? ` | Line ${selectedLineFilter}` : ''}</div>`;
    if (showNav) {
      html += `<button class="period-nav-btn" data-dir="next">›</button>`;
    }
    html += `</div>`;

    // Calendar popup
    if (showCalendar && showNav) {
      html += renderCalendarPopup();
    }

    if (filtered.length === 0) {
      html += `<div class="empty-state">${I18N.t('noResultsPeriod')}</div>`;
    } else {
      // Summary Cards (클릭 시 카드별 상세 패널 펼침/접힘)
      const cardOpen = k => openCard === k;
      const cardArrow = k => cardOpen(k) ? ' ▲' : ' ▼';
      html += `
        <div class="dashboard-summary">
          <div class="dashboard-stat-card" data-dash-card="count" style="cursor:pointer;">
            <div class="dashboard-stat-value">${stats.total}</div>
            <div class="dashboard-stat-label">${I18N.t('inspCountLabel')}${cardArrow('count')}</div>
          </div>
          <div class="dashboard-stat-card" data-dash-card="pass" style="border-left-color:#2196F3;cursor:pointer;">
            <div class="dashboard-stat-value" style="color:#2196F3">${stats.totalPass}</div>
            <div class="dashboard-stat-label">${I18N.t('itemsOfLabel', I18N.t('statusPass'))}${cardArrow('pass')}</div>
          </div>
          <div class="dashboard-stat-card" data-dash-card="fail" style="border-left-color:#e53935;cursor:pointer;">
            <div class="dashboard-stat-value" style="color:#e53935">${stats.totalFail}</div>
            <div class="dashboard-stat-label">${I18N.t('itemsOfLabel', I18N.t('statusFail'))}${cardArrow('fail')}</div>
          </div>
          <div class="dashboard-stat-card" data-dash-card="rate" style="border-left-color:${stats.passRate >= 90 ? '#43a047' : '#e53935'};cursor:pointer;">
            <div class="dashboard-stat-value" style="color:${stats.passRate >= 90 ? '#43a047' : '#e53935'}">${stats.passRate}%</div>
            <div class="dashboard-stat-label">${I18N.t('passRateLabel')}${cardArrow('rate')}</div>
          </div>
        </div>
      `;

      // 요약 카드 상세 패널
      if (openCard) {
        let panel = '';
        const lineKeys = Object.keys(byLine).sort((a, b) => (parseInt(a) || 0) - (parseInt(b) || 0));
        if (openCard === 'count') {
          // 점검수: 현재 필터 기준 점검 기록 목록 (클릭 시 상세 화면 이동)
          const recs = [...filtered].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
          panel = recs.map(i => `
            <div class="report-card" onclick="App.navigate('reportDetail', {inspectionId:${i.id}})">
              <div class="report-card-header">
                <span class="report-process">${i.lineName ? 'Line ' + i.lineName : '-'} · ${i.processName || '-'}</span>
                <span class="report-date">${i.date || '-'}</span>
              </div>
              <div class="report-inspector">${I18N.t('inspectorColon')}${i.inspector || '-'} | ${i.inspectionType === 'monthly' ? I18N.t('typeMonthly') : I18N.t('typeWeekly')}</div>
            </div>
          `).join('') || `<div class="empty-state">${I18N.t('noResultsPeriod')}</div>`;
        } else if (openCard === 'pass') {
          // 합격 항목: Line별 항목 분해
          panel = lineKeys.map(lineName => {
            const ls = calcStats(byLine[lineName]);
            return `
              <div class="dashboard-line-card">
                <div class="dashboard-line-header">
                  <span class="dashboard-line-name">Line ${lineName}</span>
                  <span class="dashboard-line-count">${I18N.t('itemsOfLabel', I18N.t('statusPass'))} ${ls.totalPass}</span>
                </div>
                <div class="dashboard-line-stats">
                  <span style="color:#2196F3">✅ ${ls.totalPass}</span>
                  <span style="color:#e53935">❌ ${ls.totalFail}</span>
                  <span style="color:#ff9800">⏸ ${ls.totalHold}</span>
                  <span style="color:#757575">⊘ ${ls.totalNA}</span>
                  <span style="color:#9e9e9e">⬜ ${ls.totalPending}</span>
                  <span style="color:#666">Σ ${ls.totalItems}</span>
                </div>
              </div>
            `;
          }).join('') || `<div class="empty-state">${I18N.t('noResultsPeriod')}</div>`;
        } else if (openCard === 'fail') {
          // 불합격 항목: 불합격 항목이 있는 기록의 ❌ 항목 상세 (항목 내용·비고·사진)
          const failRecs = [...filtered].filter(i => (i.failCount || 0) > 0).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
          panel = failRecs.length
            ? failRecs.map(i => renderFailRecordDetail(i)).join('')
            : `<div class="empty-state">${I18N.t('noResultsPeriod')}</div>`;
        } else if (openCard === 'rate') {
          // 합격률: Line별 합격률
          panel = lineKeys.map(lineName => {
            const ls = calcStats(byLine[lineName]);
            const c = ls.passRate >= 90 ? '#43a047' : '#e53935';
            return `
              <div class="dashboard-line-card">
                <div class="dashboard-line-header">
                  <span class="dashboard-line-name">Line ${lineName}</span>
                  <span class="dashboard-line-count">${ls.total}${I18N.t('unitRecords')}</span>
                </div>
                <div class="dashboard-line-stats">
                  <span style="color:#2196F3">✅ ${ls.totalPass}</span>
                  <span style="color:#e53935">❌ ${ls.totalFail}</span>
                  <span style="color:${c}" title="${I18N.t('passRateLabel')}">📊 ${ls.passRate}%</span>
                </div>
                <div class="progressbar-track" style="margin-top:6px;"><div class="progressbar-fill" style="width:${ls.passRate}%;background:${c};"></div></div>
              </div>
            `;
          }).join('') || `<div class="empty-state">${I18N.t('noResultsPeriod')}</div>`;
        }
        html += `<div class="card-grid">${panel}</div>`;
      }

      // Pass Rate Progress Bar
      html += `
        <div class="section">
          <div class="progress-bar" style="border-radius:10px;margin:0;">
            <div class="progress-header">
              <span class="progress-main-text">${I18N.t('allPeriod')} ${I18N.t('passRateLabel')}</span>
              <div class="progressbar-track"><div class="progressbar-fill" style="width:${stats.passRate}%;background:${stats.passRate >= 90 ? '#43a047' : '#e53935'};"></div></div>
            </div>
          </div>
        </div>
      `;

      // By Partner (협력사별 현황 — 협력사가 2개 이상일 때만 노출)
      if (partnerNames.length >= 2) {
        html += `
          <div class="section">
            <div class="section-title">
              <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              ${I18N.t('byPartnerStatus')}
            </div>
            <div class="card-grid">
            ${partnerNames.map(partnerName => {
              const pStats = calcStats(byPartner[partnerName] || []);
              const pPercent = pStats.passRate;
              const dispName = partnerName || I18N.t('unspecified');
              return `
                <div class="dashboard-line-card">
                  <div class="dashboard-line-header">
                    <span class="dashboard-line-name">${dispName}</span>
                    <span class="dashboard-line-count">${pStats.total}${I18N.t('unitRecords')}</span>
                  </div>
                  <div class="dashboard-line-stats">
                    <span style="color:#2196F3" title="${I18N.t('statusPass')}">✅ ${pStats.totalPass}</span>
                    <span style="color:#e53935" title="${I18N.t('statusFail')}">❌ ${pStats.totalFail}</span>
                    <span style="color:#ff9800" title="${I18N.t('statusHold')}">⏸ ${pStats.totalHold}</span>
                    <span style="color:#9e9e9e" title="${I18N.t('notInspected')}">⬜ ${pStats.totalPending}</span>
                    <span style="color:${pPercent >= 90 ? '#43a047' : '#e53935'}" title="${I18N.t('passRateLabel')}">📊 ${pPercent}%</span>
                  </div>
                  <div class="progressbar-track" style="margin-top:6px;"><div class="progressbar-fill" style="width:${pPercent}%;background:${pPercent >= 90 ? '#43a047' : '#e53935'};"></div></div>
                </div>
              `;
            }).join('')}
            </div>
          </div>
        `;
      }

      // By Line
      html += `
        <div class="section">
          <div class="section-title">
            <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            ${I18N.t('byLineStatus')}
          </div>
          <div class="card-grid">
          ${Object.keys(byLine).sort((a, b) => (parseInt(a) || 0) - (parseInt(b) || 0)).map(lineName => {
            const lineStats = calcStats(byLine[lineName]);
            const linePercent = lineStats.passRate;
            // Line 카드 클릭 시 공정별 세부내역 (어떤 공정 · 항목 수 · 합격/불합격/보류/미점검)
            const lineProcs = {};
            (byLine[lineName] || []).forEach(i => {
              const key = i.processName || 'Unknown';
              if (!lineProcs[key]) lineProcs[key] = [];
              lineProcs[key].push(i);
            });
            return `
              <div class="dashboard-line-card" data-dash-line="${lineName}" style="cursor:pointer;">
                <div class="dashboard-line-header">
                  <span class="dashboard-line-name">Line ${lineName} ${selectedDashLine === lineName ? '▲' : '▼'}</span>
                  <span class="dashboard-line-count">${lineStats.total}${I18N.t('unitRecords')}</span>
                </div>
                <div style="font-size:12px;color:#888;margin:2px 0 4px;">${I18N.t('itemsBreakdownFmt', String(lineStats.totalItems), String(lineStats.totalNA), String(lineStats.totalItems - lineStats.totalNA))}</div>
                <div class="dashboard-line-stats">
                  <span style="color:#2196F3" title="${I18N.t('statusPass')}">✅ ${lineStats.totalPass}</span>
                  <span style="color:#e53935" title="${I18N.t('statusFail')}">❌ ${lineStats.totalFail}</span>
                  <span style="color:#ff9800" title="${I18N.t('statusHold')}">⏸ ${lineStats.totalHold}</span>
                  <span style="color:#9e9e9e" title="${I18N.t('notInspected')}">⬜ ${lineStats.totalPending}</span>
                  <span style="color:${linePercent >= 90 ? '#43a047' : '#e53935'}" title="${I18N.t('passRateLabel')}">📊 ${linePercent}%</span>
                </div>
                <div class="progressbar-track" style="margin-top:6px;"><div class="progressbar-fill" style="width:${linePercent}%;background:${linePercent >= 90 ? '#43a047' : '#e53935'};"></div></div>
                ${selectedDashLine === lineName ? `
                  <div style="background:#fafafa;border-top:1px solid #eee;margin:10px -4px -4px;padding:10px 4px 4px;">
                    <div style="font-size:13px;font-weight:bold;margin-bottom:6px;color:#333;">${I18N.t('byProcessStatus')} (${Object.keys(lineProcs).length})</div>
                    ${Object.keys(lineProcs).sort().map(procName => {
                      const pst = calcStats(lineProcs[procName]);
                      const pcolor = pst.passRate >= 90 ? '#43a047' : '#e53935';
                      const pdenom = pst.totalItems - pst.totalNA;
                      const procKey = lineName + '|||' + procName;
                      const isProcOpen = selectedDashProc === procKey;
                      return `
                        <div style="padding:8px 2px;border-bottom:1px solid #eee;">
                          <div data-dash-proc="${procKey}" style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;">
                            <span style="font-weight:bold;font-size:13px;color:${isProcOpen ? '#1976d2' : '#333'};">${isProcOpen ? '▼' : '▶'} ${procName}</span>
                            <span style="font-size:12px;color:#666;">${pst.total}${I18N.t('unitRecords')} ${isProcOpen ? '▲' : '▼'}</span>
                          </div>
                          <div style="font-size:12px;color:#888;margin:2px 0 4px;">${I18N.t('itemsBreakdownFmt', String(pst.totalItems), String(pst.totalNA), String(pdenom))}</div>
                          <div style="display:flex;gap:10px;font-size:12px;font-weight:700;flex-wrap:wrap;">
                            <span style="color:#2196F3">✅ ${pst.totalPass}</span>
                            <span style="color:#e53935">❌ ${pst.totalFail}</span>
                            <span style="color:#ff9800">⏸ ${pst.totalHold}</span>
                            <span style="color:#9e9e9e">⬜ ${pst.totalPending}</span>
                            <span style="color:${pcolor}">📊 ${pst.passRate}%</span>
                          </div>
                          ${isProcOpen ? renderDashProcDetail(procKey) : ''}
                        </div>
                      `;
                    }).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
          </div>
        </div>
      `;

      // By Process
      html += `
        <div class="section">
          <div class="section-title">
            <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            ${I18N.t('byProcessStatus')}
          </div>
          <div class="card-grid" style="max-height:420px;overflow-y:auto;padding:2px;">
          ${Object.keys(byProcess).map(procName => {
            const procStats = calcStats(byProcess[procName]);
            const procPercent = procStats.passRate;
            return `
              <div class="dashboard-line-card">
                <div class="dashboard-line-header">
                  <span class="dashboard-line-name">${procName}</span>
                  <span class="dashboard-line-count">${procStats.total}${I18N.t('unitRecords')}</span>
                </div>
                <div class="dashboard-line-stats">
                  <span style="color:#2196F3" title="${I18N.t('statusPass')}">✅ ${procStats.totalPass}</span>
                  <span style="color:#e53935" title="${I18N.t('statusFail')}">❌ ${procStats.totalFail}</span>
                  <span style="color:#ff9800" title="${I18N.t('statusHold')}">⏸ ${procStats.totalHold}</span>
                  <span style="color:#9e9e9e" title="${I18N.t('notInspected')}">⬜ ${procStats.totalPending}</span>
                  <span style="color:${procPercent >= 90 ? '#43a047' : '#e53935'}" title="${I18N.t('passRateLabel')}">📊 ${procPercent}%</span>
                </div>
                <div class="progressbar-track" style="margin-top:6px;"><div class="progressbar-fill" style="width:${procPercent}%;background:${procPercent >= 90 ? '#43a047' : '#e53935'};"></div></div>
              </div>
            `;
          }).join('')}
          </div>
        </div>
      `;

      // Recent inspections list
      html += `
        <div class="section">
          <div class="section-title">
            <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ${I18N.t('historyTitle')}
          </div>
          <div class="card-grid">
          ${filtered.map(i => {
            const denom = (i.passCount || 0) + (i.failCount || 0) + (i.holdCount || 0);
            const passRate = denom > 0 ? Math.round(((i.passCount || 0) / denom) * 100) : 0;
            const iPending = Math.max(0, (i.totalCount || 0) - (i.naCount || 0) - (i.passCount || 0) - (i.failCount || 0) - (i.holdCount || 0));
            return `
              <div class="report-card" onclick="App.navigate('reportDetail', {inspectionId:${i.id}})">
                <div class="report-card-header">
                  <span class="report-process">${i.processName}</span>
                  <span class="report-date">${i.date}</span>
                </div>
                <div class="report-info">Line ${i.lineName} | ${I18N.t('inspectorColon')}${i.inspector || '-'}</div>
                <div class="report-stats">
                  <div class="stat-item">
                    <div class="stat-value" style="color:#2196F3">${i.passCount || 0}</div>
                    <div class="stat-label">${I18N.t('statusPass')}</div>
                  </div>
                  <div class="stat-item">
                    <div class="stat-value" style="color:#e53935">${i.failCount || 0}</div>
                    <div class="stat-label">${I18N.t('statusFail')}</div>
                  </div>
                  <div class="stat-item">
                    <div class="stat-value" style="color:#ff9800">${i.holdCount || 0}</div>
                    <div class="stat-label">${I18N.t('statusHold')}</div>
                  </div>
                  <div class="stat-item">
                    <div class="stat-value" style="color:#9e9e9e">${iPending}</div>
                    <div class="stat-label">${I18N.t('notInspected')}</div>
                  </div>
                  <div class="stat-item">
                    <div class="stat-value" style="color:${passRate >= 90 ? '#43a047' : '#e53935'}">${passRate}%</div>
                    <div class="stat-label">${I18N.t('passRateLabel')}</div>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
          </div>
        </div>
      `;
    }

    container.innerHTML = html;

    // Bind tab buttons
    container.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        showCalendar = false;
        render();
      });
    });

    // Period navigation (prev/next)
    container.querySelectorAll('[data-dir]').forEach(btn => {
      btn.addEventListener('click', () => {
        const dir = btn.dataset.dir;
        if (activeTab === 'day') {
          currentDate.setDate(currentDate.getDate() + (dir === 'prev' ? -1 : 1));
        } else if (activeTab === 'week') {
          currentDate.setDate(currentDate.getDate() + (dir === 'prev' ? -7 : 7));
        } else if (activeTab === 'month') {
          currentDate.setMonth(currentDate.getMonth() + (dir === 'prev' ? -1 : 1));
        }
        render();
      });
    });

    // Period label click - toggle calendar popup
    const periodLabelEl = container.querySelector('#periodLabel');
    if (periodLabelEl && periodLabelEl.classList.contains('clickable')) {
      periodLabelEl.addEventListener('click', () => {
        showCalendar = !showCalendar;
        if (showCalendar) calendarMonth = new Date(currentDate);
        render();
      });
    }

    // Calendar overlay click - close
    const calOverlay = container.querySelector('#calOverlay');
    if (calOverlay) {
      calOverlay.addEventListener('click', () => {
        showCalendar = false;
        render();
      });
    }

    // Calendar month navigation & today button
    container.querySelectorAll('[data-cal-nav]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const action = btn.dataset.calNav;
        if (action === 'prev-month') {
          calendarMonth.setMonth(calendarMonth.getMonth() - 1);
        } else if (action === 'next-month') {
          calendarMonth.setMonth(calendarMonth.getMonth() + 1);
        } else if (action === 'today') {
          calendarMonth = new Date();
          currentDate = new Date();
          showCalendar = false;
          render();
          return;
        }
        render();
      });
    });

    // Calendar date selection
    container.querySelectorAll('[data-cal-date]').forEach(dayEl => {
      dayEl.addEventListener('click', () => {
        const [y, m, d] = dayEl.dataset.calDate.split('-').map(Number);
        currentDate = new Date(y, m - 1, d);
        showCalendar = false;
        render();
      });
    });

    // 사용자 지정 기간: 날짜 입력 및 조회 버튼
    const startDateInput = container.querySelector('#dashCustomStart');
    const endDateInput = container.querySelector('#dashCustomEnd');
    const applyBtn = container.querySelector('#dashApplyCustom');

    if (startDateInput) {
      startDateInput.addEventListener('change', () => {
        customStartDate = startDateInput.value;
        if (endDateInput) endDateInput.min = customStartDate || '';
      });
    }
    if (endDateInput) {
      endDateInput.addEventListener('change', () => {
        customEndDate = endDateInput.value;
        if (startDateInput) startDateInput.max = customEndDate || formatDate(new Date());
      });
    }
    if (applyBtn) {
      applyBtn.addEventListener('click', () => {
        customStartDate = startDateInput ? startDateInput.value : '';
        customEndDate = endDateInput ? endDateInput.value : '';
        render();
      });
    }

    // Line 필터 버튼
    container.querySelectorAll('[data-line-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedLineFilter = btn.dataset.lineFilter;
        render();
      });
    });

    // 협력사 필터 버튼
    container.querySelectorAll('[data-partner-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedPartnerFilter = btn.dataset.partnerFilter;
        render();
      });
    });

    // 점검 유형 필터 버튼 (일반 점검 vs 정밀점검)
    container.querySelectorAll('[data-type-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedTypeFilter = btn.dataset.typeFilter;
        selectedDashLine = null;
        render();
      });
    });

    // 요약 카드 클릭 → 카드별 상세 패널 펼침/접힘
    container.querySelectorAll('[data-dash-card]').forEach(card => {
      card.addEventListener('click', () => {
        const k = card.dataset.dashCard;
        openCard = (openCard === k) ? null : k;
        render();
      });
    });

    // Line 카드 클릭 → 공정별 세부내역 펼침/접기
    container.querySelectorAll('[data-dash-line]').forEach(card => {
      card.addEventListener('click', () => {
        const lineName = card.dataset.dashLine;
        selectedDashLine = (selectedDashLine === lineName) ? null : lineName;
        selectedDashProc = null; // Line 전환 시 공정 상세 초기화
        render();
      });
    });

    // 공정 행 클릭 → 항목별 점검 상세(합격/불합격/사진/비고) 펼침/접기
    container.querySelectorAll('[data-dash-proc]').forEach(row => {
      row.addEventListener('click', (e) => {
        e.stopPropagation(); // Line 카드 토글과 분리
        const key = row.dataset.dashProc;
        selectedDashProc = (selectedDashProc === key) ? null : key;
        render();
      });
    });

    // 상세 내역 영역 클릭 시 Line 카드 토글 방지 (사진 확인 등)
    container.querySelectorAll('[data-dash-proc-detail]').forEach(d => {
      d.addEventListener('click', (e) => e.stopPropagation());
    });

    // 헤더 뒤로가기 버튼: 공정 상세 → Line 세부내역 순으로 먼저 접음
    // 내부 상태가 없으면 false 반환 → App.navigateBack()이 이전 화면으로 이동
    if (typeof App !== 'undefined') {
      App._backStateHandler = function() {
        if (selectedDashProc) {
          selectedDashProc = null;
          render();
          return true;
        }
        if (selectedDashLine) {
          selectedDashLine = null;
          render();
          return true;
        }
        return false;
      };
    }

    // Line 검색 입력
    const lineSearchInput = container.querySelector('#dashLineSearch');
    if (lineSearchInput) {
      lineSearchInput.addEventListener('input', () => {
        lineSearchKeyword = lineSearchInput.value;
        render();
        // render 후 입력창에 포커스 유지
        const newInput = container.querySelector('#dashLineSearch');
        if (newInput) {
          newInput.focus();
          newInput.setSelectionRange(newInput.value.length, newInput.value.length);
        }
      });
    }

    // Line 검색 초기화 버튼
    const lineSearchClearBtn = container.querySelector('#dashLineSearchClear');
    if (lineSearchClearBtn) {
      lineSearchClearBtn.addEventListener('click', () => {
        lineSearchKeyword = '';
        render();
        const newInput = container.querySelector('#dashLineSearch');
        if (newInput) newInput.focus();
      });
    }
  }

  render();
};

// ===== Item Management Screen =====
Screens.itemManage = async function(container, params) {
  const processes = await DB.getAllProcesses();
  let selectedProcessId = params.processId || (processes.length > 0 ? processes[0].id : null);
  let selectedInspType = params.inspectionType || 'daily';

  if (processes.length === 0) {
    container.innerHTML = '<div class="empty-state">' + I18N.t('noProcessesEmpty') + '</div>';
    return;
  }

  async function renderItems() {
    const rawItems = await DB.getChecklistItems(selectedProcessId, selectedInspType);
    // Sort by No (numeric)
    const items = rawItems.slice().sort((a, b) => {
      const na = parseInt(a.no) || 0;
      const nb = parseInt(b.no) || 0;
      return na - nb;
    });
    const proc = processes.find(p => p.id === selectedProcessId);
    const typeLabel = selectedInspType === 'daily' ? I18N.t('dailyShort') : I18N.t('monthlyShort');
    const typeColor = selectedInspType === 'daily' ? '#2196F3' : '#FF9800';

    let html = `
      <div class="section">
        <div class="section-title">${I18N.t('selectTypeTitle')}</div>
        <div class="line-container">
          <button class="line-btn ${selectedInspType === 'daily' ? 'active' : ''}" onclick="window.switchInspType('daily')">📋 ${I18N.t('dailyShort')}</button>
          <button class="line-btn ${selectedInspType === 'monthly' ? 'active' : ''}" onclick="window.switchInspType('monthly')">📅 ${I18N.t('monthlyShort')}</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">${I18N.t('selectProcess')}</div>
        <div class="line-container">
          ${processes.map(p => `<button class="line-btn ${p.id === selectedProcessId ? 'active' : ''}" data-pid="${p.id}">${p.displayName}</button>`).join('')}
        </div>
      </div>

      <div class="section">
        <div class="section-title">
          <span style="background:${typeColor};color:white;padding:2px 8px;border-radius:4px;font-size:12px;margin-right:6px;">${typeLabel}</span>
          ${I18N.t('checklistItemsWord')} (${proc ? proc.displayName : ''}) - ${items.length}${I18N.t('unitItems')}
        </div>
        <button class="btn-primary" style="margin-bottom:10px;width:100%;" onclick="App.navigate('itemEdit', {processId: ${selectedProcessId}, inspectionType: '${selectedInspType}'})">${I18N.t('addItemBtn')}</button>
        ${items.length === 0 ? `<div class="empty-state">${typeLabel}${I18N.t('noItemsHint')}</div>` :
          items.map(item => `
            <div class="card" style="margin-bottom:8px;">
              <div style="display:flex;justify-content:space-between;align-items:start;">
                <div style="flex:1;">
                  <div style="font-size:12px;color:#999;margin-bottom:4px;">
                    <span style="background:#333;color:white;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:bold;">No.${item.no || '-'}</span>
                    <span style="background:${item.grade === 'A' ? '#e53935' : '#2196F3'};color:white;padding:1px 6px;border-radius:4px;font-size:11px;margin-left:3px;">${item.grade}</span>
                    ${item.category} | ${item.cycle}
                  </div>
                  <div style="font-weight:bold;font-size:14px;margin-bottom:4px;">${item.checkItem}</div>
                  <div style="font-size:12px;color:#666;">
                    🔍 ${item.checkMethod}<br>
                    💡 ${item.actionMethod}
                  </div>
                </div>
                <div style="display:flex;gap:5px;">
                  <button style="background:#2196F3;color:white;border:none;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:12px;" onclick="App.navigate('itemEdit', {processId: ${selectedProcessId}, itemId: ${item.id}, inspectionType: '${selectedInspType}'})">${I18N.t('editWord')}</button>
                  <button style="background:#e53935;color:white;border:none;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:12px;" onclick="window.deleteItem(${item.id})">${I18N.t('deleteBtn')}</button>
                </div>
              </div>
            </div>
          `).join('')
        }
      </div>
    `;

    container.innerHTML = html;

    // Process selection
    container.querySelectorAll('[data-pid]').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedProcessId = parseInt(btn.dataset.pid);
        renderItems();
      });
    });
  }

  window.switchInspType = function(type) {
    selectedInspType = type;
    renderItems();
  };

  window.deleteItem = async function(itemId) {
    if (!confirm(I18N.t('deleteItemConfirm'))) return;
    await DB.deleteChecklistItem(itemId);
    renderItems();
  };

  renderItems();
};

// ===== Item Edit Screen =====
Screens.itemEdit = async function(container, params) {
  const isEdit = params.itemId !== undefined;
  const inspType = params.inspectionType || 'daily';
  let item = { category: '', no: '', grade: 'A', checkItem: '', checkMethod: '', cycle: '', actionMethod: '', remark: '', inspectionType: inspType };

  if (isEdit) {
    const items = await DB.getChecklistItems(params.processId, inspType);
    item = items.find(i => i.id === params.itemId) || item;
  }

  // 입력값을 HTML 속성/본문에 안전하게 넣기
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

  const field = (label, control, cls = '') => `
    <div class="item-field ${cls}">
      <label>${label}</label>
      ${control}
    </div>`;
  const textInput = (id, label, value, ph, cls = '') =>
    field(label, `<input type="text" id="${id}" value="${esc(value)}" placeholder="${ph}">`, cls);
  const textArea = (id, label, value, ph, rows, cls = '') =>
    field(label, `<textarea id="${id}" rows="${rows}" placeholder="${ph}">${esc(value)}</textarea>`, cls);
  const gradeSeg = `
    <div class="item-seg" id="gradeSeg">
      <button type="button" data-grade="A" class="${item.grade !== 'B' ? 'active' : ''}">${I18N.t('gradeA')}</button>
      <button type="button" data-grade="B" class="${item.grade === 'B' ? 'active' : ''}">${I18N.t('gradeB')}</button>
    </div>
    <input type="hidden" id="editGrade" value="${item.grade === 'B' ? 'B' : 'A'}">`;

  const formFields = () => `
    <div class="item-form-card">
      <div class="item-form-grid">
        ${textInput('editCategory', I18N.t('lblCategory'), item.category, I18N.t('phEditCategory'))}
        ${textInput('editNo', I18N.t('lblNo'), item.no, I18N.t('phEditNo'))}
        ${field(I18N.t('lblGrade'), gradeSeg, 'item-field-full')}
      </div>
    </div>
    <div class="item-form-card">
      <div class="item-form-grid">
        ${textArea('editCheckItem', I18N.t('lblCheckItem'), item.checkItem, I18N.t('phEditCheckItem'), 6, 'item-field-full')}
        ${textArea('editCheckMethod', I18N.t('lblCheckMethod'), item.checkMethod, I18N.t('phEditCheckMethod'), 8, 'item-field-full')}
      </div>
    </div>
    <div class="item-form-card">
      <div class="item-form-grid">
        ${textInput('editCycle', I18N.t('lblCycle'), item.cycle, I18N.t('phEditCycle'))}
        ${textInput('editActionMethod', I18N.t('lblAction'), item.actionMethod, I18N.t('phEditAction'), 'item-field-full')}
        ${textInput('editRemark', I18N.t('remark'), item.remark, I18N.t('phEditRemark'), 'item-field-full')}
      </div>
    </div>`;

  const bar = (saveAction, saveLabel) => `
    <div class="item-form-bar">
      <button class="item-btn-cancel" onclick="App.navigateBack()">${I18N.t('btnCancel')}</button>
      <button class="item-btn-save" onclick="${saveAction}">${saveLabel}</button>
    </div>`;

  if (!isEdit) {
    // 추가: 단일 입력 / 엑셀 붙여넣기 탭
    container.innerHTML = `
      <div class="item-form">
        <div class="item-seg item-seg-tabs">
          <button id="tabSingle" class="active" onclick="window.switchMode('single')">${I18N.t('tabSingleAdd')}</button>
          <button id="tabBulk" onclick="window.switchMode('bulk')">${I18N.t('tabExcelPaste')}</button>
        </div>

        <div id="modeSingle">
          ${formFields()}
          ${bar(`window.saveItem(${params.processId}, null, '${inspType}')`, I18N.t('addWord'))}
        </div>

        <div id="modeBulk" style="display:none;">
          <div class="item-form-card item-guide">
            <div class="item-guide-title">${I18N.t('bulkUsageTitle')}</div>
            <div class="item-guide-body">
              ${I18N.t('bulkUsage1')}<br>
              ${I18N.t('bulkStep1')}<br>
              ${I18N.t('bulkStep2')}<br>
              ${I18N.t('bulkStep3')}<br><br>
              ${I18N.t('colOrderHint')}
              ${I18N.t('lblCategory')} | ${I18N.t('lblNo')} | ${I18N.t('lblGrade')} | ${I18N.t('lblCheckItem')} | ${I18N.t('lblCheckMethod')} | ${I18N.t('lblCycle')} | ${I18N.t('lblAction')} | ${I18N.t('remark')}<br><br>
              ${I18N.t('bulkExample')}
              <code class="item-guide-code">${I18N.t('sampleRowData')}</code>
            </div>
          </div>
          <div class="item-form-card">
            <label class="item-bulk-label" for="bulkInput">${I18N.t('bulkPasteLabel')}</label>
            <textarea id="bulkInput" class="item-bulk-input" rows="12" placeholder="${I18N.t('phBulkInput')}"></textarea>
            <div id="bulkPreview"></div>
          </div>
          ${bar(`window.bulkAdd(${params.processId}, '${inspType}')`, I18N.t('bulkAdd'))}
        </div>
      </div>
    `;

    // 모드 전환
    window.switchMode = function(mode) {
      document.getElementById('modeSingle').style.display = mode === 'single' ? 'block' : 'none';
      document.getElementById('modeBulk').style.display = mode === 'bulk' ? 'block' : 'none';
      document.getElementById('tabSingle').classList.toggle('active', mode === 'single');
      document.getElementById('tabBulk').classList.toggle('active', mode === 'bulk');
    };

    // 엑셀 붙여넣기: 인식된 항목 수 미리보기
    document.getElementById('bulkInput').addEventListener('input', function() {
      const text = this.value.trim();
      if (!text) {
        document.getElementById('bulkPreview').innerHTML = '';
        return;
      }
      const lines = text.split('\n').filter(l => l.trim());
      document.getElementById('bulkPreview').innerHTML =
        '<div class="item-bulk-preview">' + I18N.t('detectedItemsMsg', String(lines.length)) + '</div>';
    });
  } else {
    // 수정: 단일 항목
    container.innerHTML = `
      <div class="item-form">
        <div class="item-form-head">
          <span class="item-form-title">${I18N.t('editSectionTitle')}</span>
          ${item.no ? `<span class="item-form-badge">No. ${esc(item.no)}</span>` : ''}
        </div>
        ${formFields()}
        ${bar(`window.saveItem(${params.processId}, ${params.itemId}, '${inspType}')`, I18N.t('editWord'))}
      </div>
    `;
  }

  // 등급 선택 (A/B 버튼 → 숨은 입력값 갱신)
  container.querySelectorAll('#gradeSeg button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('editGrade').value = btn.dataset.grade;
      container.querySelectorAll('#gradeSeg button').forEach(b => b.classList.toggle('active', b === btn));
    });
  });
};

window.saveItem = async function(processId, itemId, inspType) {
  const data = {
    processId,
    category: document.getElementById('editCategory').value.trim(),
    no: document.getElementById('editNo').value.trim(),
    grade: document.getElementById('editGrade').value,
    checkItem: document.getElementById('editCheckItem').value.trim(),
    checkMethod: document.getElementById('editCheckMethod').value.trim(),
    cycle: document.getElementById('editCycle').value.trim(),
    actionMethod: document.getElementById('editActionMethod').value.trim(),
    remark: document.getElementById('editRemark').value.trim(),
    inspectionType: inspType || 'daily',
  };

  if (!data.checkItem) {
    alert(I18N.t('enterCheckItem'));
    return;
  }

  if (itemId) {
    await DB.updateChecklistItem(itemId, data);
  } else {
    await DB.insertChecklistItem(data);
  }

  // Update process item count
  const items = await DB.getChecklistItems(processId, inspType);
  await DB.updateProcessItemCount(processId, items.length);

  App.navigateBack();
};

window.bulkAdd = async function(processId, inspType) {
  const text = document.getElementById('bulkInput').value.trim();
  if (!text) {
    alert(I18N.t('enterData'));
    return;
  }

  const lines = text.split('\n').filter(l => l.trim());
  if (lines.length === 0) {
    alert(I18N.t('noData'));
    return;
  }

  // Auto-detect header row and column mapping
  const headerCols = lines[0].split('\t').map(c => c.trim().toLowerCase());
  
  // Check if first row is a header
  const headerKeywords = ['category', '대분류', '구분', 'grade', '등급', 'check', '점검', 'no', '순번', '주기', 'cycle', '조치', 'action', '비고', 'remark', '공정', 'process'];
  const isHeader = headerCols.some(c => headerKeywords.some(kw => c.includes(kw)));

  // Column mapping (default: A=category, B=no, C=grade, D=checkItem, E=checkMethod, F=cycle, G=actionMethod, H=remark)
  let colMap = { category: 0, no: 1, grade: 2, checkItem: 3, checkMethod: 4, cycle: 5, actionMethod: 6, remark: 7 };

  if (isHeader) {
    // Auto-detect column positions from header
    colMap = { category: -1, no: -1, grade: -1, checkItem: -1, checkMethod: -1, cycle: -1, actionMethod: -1, remark: -1 };
    for (let i = 0; i < headerCols.length; i++) {
      const h = headerCols[i];
      if (h.includes('category') || h.includes('대분류') || h.includes('구분')) colMap.category = i;
      else if (h.includes('no') || h.includes('순번') || h === 'no') colMap.no = i;
      else if (h.includes('grade') || h.includes('등급')) colMap.grade = i;
      else if (h.includes('check') && h.includes('item') || h.includes('점검') && h.includes('항목')) colMap.checkItem = i;
      else if (h.includes('check') && h.includes('method') || h.includes('점검') && h.includes('방법')) colMap.checkMethod = i;
      else if (h.includes('cycle') || h.includes('주기')) colMap.cycle = i;
      else if (h.includes('action') || h.includes('조치')) colMap.actionMethod = i;
      else if (h.includes('remark') || h.includes('비고')) colMap.remark = i;
    }
    // If checkItem not found, try broader match
    if (colMap.checkItem === -1) {
      for (let i = 0; i < headerCols.length; i++) {
        if (headerCols[i].includes('점검') || headerCols[i].includes('check')) {
          colMap.checkItem = i;
          break;
        }
      }
    }
  }

  let added = 0;
  let errors = [];
  const startIdx = isHeader ? 1 : 0;

  for (let i = startIdx; i < lines.length; i++) {
    const cols = lines[i].split('\t');
    
    const data = {
      processId,
      category: colMap.category >= 0 ? (cols[colMap.category] || '').trim() : '',
      no: colMap.no >= 0 ? (cols[colMap.no] || '').trim() : '',
      grade: colMap.grade >= 0 ? (cols[colMap.grade] || 'A').trim() || 'A' : 'A',
      checkItem: colMap.checkItem >= 0 ? (cols[colMap.checkItem] || '').trim() : '',
      checkMethod: colMap.checkMethod >= 0 ? (cols[colMap.checkMethod] || '').trim() : '',
      cycle: colMap.cycle >= 0 ? (cols[colMap.cycle] || '').trim() : '',
      actionMethod: colMap.actionMethod >= 0 ? (cols[colMap.actionMethod] || '').trim() : '',
      remark: colMap.remark >= 0 ? (cols[colMap.remark] || '').trim() : '',
      inspectionType: inspType || 'daily',
    };

    if (!data.checkItem) {
      errors.push(I18N.t('rowMissingItem', String(i + 1), I18N.t('lblCheckItem')));
      continue;
    }

    await DB.insertChecklistItem(data);
    added++;
  }

  // Update process item count
  const items = await DB.getChecklistItems(processId, inspType);
  await DB.updateProcessItemCount(processId, items.length);

  let msg = I18N.t('itemsAdded', String(added));
  if (isHeader) {
    msg += '\n' + I18N.t('headerAutoDetected');
  }
  if (errors.length > 0) {
    msg += '\n\n' + I18N.t('errorsHeader', String(errors.length)) + '\n' + errors.join('\n');
  }
  alert(msg);
  App.navigateBack();
};

// ===== Backup Management Screen =====
Screens.backupManage = async function(container, params) {
  const isElectron = typeof window !== 'undefined' && window.fileAPI && window.fileAPI.isElectron;
  
  if (!isElectron) {
    container.innerHTML = `
      <div class="section">
        <div class="section-title">${I18N.t('admCardBackupTitle')}</div>
        <div class="card">
          <div style="font-size:14px;color:#666;line-height:22px;padding:15px;">
            ${I18N.t('electronOnlyNote')}
            ${I18N.t('webExtractNote')}
          </div>
        </div>
      </div>
    `;
    return;
  }

  const backupPath = await DB.getBackupPath();
  const result = await DB.listBackups();
  const allFiles = result.files || [];
  const inspections = await DB.getAllInspections();

  // 목록에는 전체 백업(backup_날짜.json)만 표시
  // 나머지(설정·Line·사용자·점검결과 자동 보관본)는 자동으로 함께 저장/복원되는 보조 파일
  const AUTO_FILES = ['settings.json', 'lines.json', 'users.json', 'inspections_cumulative.json'];
  const fullBackups = allFiles.filter(f => !AUTO_FILES.includes(f.filename));
  const cumulative = allFiles.find(f => f.filename === 'inspections_cumulative.json');
  const fmtDate = (t) => new Date(t).toLocaleString('ko-KR');
  const fmtSize = (b) => (b / 1024).toFixed(1) + ' KB';
  const lastAutoText = cumulative
    ? I18N.t('bkLastAuto', fmtDate(cumulative.modified))
    : I18N.t('bkNoAuto');

  const actionCard = (title, desc, color, onclick) => `
    <div class="bk-action">
      <div class="bk-action-text">
        <div class="bk-action-title">${title}</div>
        <div class="bk-action-desc">${desc}</div>
      </div>
      <button class="bk-run" style="background:${color};" onclick="${onclick}">${I18N.t('bkRunBtn')}</button>
    </div>`;

  let html = `
    <div class="section">
      <div class="section-title">${I18N.t('admCardBackupTitle')}</div>
      <div class="card bk-status">
        <div>${I18N.t('currentDataCount', String(inspections.length))}</div>
        <div class="bk-path">${I18N.t('backupFolderPath')}<code>${backupPath}</code></div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">${I18N.t('bkSecBackup')}</div>
      <div class="bk-group">
        ${actionCard(I18N.t('bkBackupNowBtn'), I18N.t('bkBackupNowDesc'), '#43a047', 'window.doBackupNow()')}
        ${actionCard(I18N.t('exportBackupBtn'), I18N.t('bkExportDesc'), '#FF8F00', 'window.doExportBackup()')}
      </div>
    </div>

    <div class="section">
      <div class="section-title">${I18N.t('bkSecRestore')}</div>
      <div class="bk-group">
        ${actionCard(I18N.t('bkRestoreResultsBtn'), I18N.t('bkRestoreResultsDesc') + '<div class="bk-muted">' + lastAutoText + '</div>', '#2196F3', 'window.doRestoreCumulative()')}
        ${actionCard(I18N.t('importBackupBtn'), I18N.t('bkImportDesc'), '#7B1FA2', 'window.doImportBackup()')}
      </div>
    </div>

    <div class="section">
      <div class="section-title">${I18N.t('bkSecFiles', String(fullBackups.length))}</div>
      <div class="bk-note">${I18N.t('bkHelperNote')}</div>
      ${fullBackups.length === 0 ? `
        <div class="empty-state">${I18N.t('noBackupFiles')}</div>
      ` : fullBackups.map(f => {
        const date = f.filename.replace(/^backup_/, '').replace(/\.json$/, '');
        return `
          <div class="bk-file">
            <div class="bk-file-text">
              <div class="bk-file-title">${I18N.t('bkFileRowTitle', date)}</div>
              <div class="bk-file-desc">${I18N.t('bkFileRowDesc')}</div>
              <div class="bk-file-desc">${fmtDate(f.modified)} · ${fmtSize(f.size)}</div>
            </div>
            <div class="bk-file-btns">
              <button class="bk-mini bk-mini-restore" onclick="window.doRestoreBackup('${f.filename}')">${I18N.t('restoreBtn')}</button>
              <button class="bk-mini bk-mini-delete" onclick="window.doDeleteBackup('${f.filename}')">${I18N.t('deleteBtn')}</button>
            </div>
          </div>`;
      }).join('')}
    </div>
  `;

  container.innerHTML = html;

  // 백업 함수들
  window.doBackupNow = async function() {
    const result = await DB.backupToFile();
    if (result.success) {
      alert(I18N.t('backupDone') + result.path);
      App.replace('backupManage');
    } else {
      alert(I18N.t('backupFail') + (result.error || I18N.t('unknownError')));
    }
  };

  window.doRestoreCumulative = async function() {
    if (!confirm(I18N.t('restoreCumulativeConfirm'))) return;
    const result = await DB.restoreCumulativeInspections();
    if (result.success) {
      alert(I18N.t('restoreDone', String(result.added)));
    } else {
      alert(I18N.t('restoreFail') + (result.error || I18N.t('noDataInDb')));
    }
  };

  window.doRestoreBackup = async function(filename) {
    if (!confirm(I18N.t('restoreAllConfirm', filename))) return;
    const result = await DB.restoreFromFile(filename);
    if (result.success) {
      alert(I18N.t('restoreComplete'));
      App.replace('home');
    } else {
      alert(I18N.t('restoreFail') + (result.error || I18N.t('unknownError')));
    }
  };

  window.doDeleteBackup = async function(filename) {
    if (!confirm(I18N.t('deleteFileConfirm', filename))) return;
    await DB.deleteBackup(filename);
    App.replace('backupManage');
  };

  window.doExportBackup = async function() {
    const result = await DB.exportToFile();
    if (result.canceled) return;
    if (result.success) {
      alert(I18N.t('exportDone', result.path));
    } else {
      alert(I18N.t('exportFail') + (result.error || I18N.t('unknownError')));
    }
  };

  window.doImportBackup = async function() {
    if (!confirm(I18N.t('importExternalConfirm'))) return;
    const result = await DB.importFromFile();
    if (result.canceled) return;
    if (result.success) {
      alert(I18N.t('importDone', String(result.storeCount), String(result.inspectionCount)));
      App.replace('home');
    } else {
            alert(I18N.t('importFail') + (result.error || I18N.t('unknownError')));
    }
  };
};
