// ===== Partner Summary Screen (협력사별 총괄) =====
// 22개 협력사의 점검 결과를 partnerName 기준으로 총괄 조회하는 화면

Screens.partnerSummary = async function(container, params) {
  const allInspections = await DB.getAllInspections() || [];
  const allChecklistItems = await DB.getAllChecklistItems() || []; // 항목 내용 표시용

  // State
  let activePeriod = 'week'; // 'week' | 'month' | 'all' | 'custom'
  let customStartDate = '';
  let customEndDate = '';
  let selectedPartner = null; // 상세 보기 중인 협력사명
  let selectedLine = null; // 협력사 상세 내 Line 상세 보기 중인 Line명
  let selectedProc = null; // 공정 클릭 시 펼쳐지는 점검 상세의 공정명
  let procDetailCache = {}; // 공정명 -> { loading, records:[{inspection, results}] } 항목별 결과 캐시
  let procRecordsMap = {}; // 공정명 -> 현재 보기 기준 해당 공정 점검 기록 목록 (render마다 갱신)
  let itemTextMap = null; // checklistItemId -> 항목 데이터 (항목 내용 표시용)
  let openCard = null; // 요약 카드 클릭 시 펼쳐지는 상세 패널 ('partner' | 'count' | 'fail' | 'rate')
  let failDetailCache = {}; // inspectionId -> { loading, fails } 불합격 항목 캐시 (요약 카드 상세용)

  // 기준 협력사(사용자 등록) — 기간 내 점검 누락 경고용 (기준정보)
  let expectedPartners = [];
  try { expectedPartners = JSON.parse(localStorage.getItem('psExpectedPartners') || '[]') || []; } catch (e) { expectedPartners = []; }
  if (!Array.isArray(expectedPartners)) expectedPartners = [];
  let showPartnerSetup = false; // 기준 협력사 설정 패널 표시 여부

  function saveExpectedPartners() {
    try { localStorage.setItem('psExpectedPartners', JSON.stringify(expectedPartners)); } catch (e) {}
  }
  let selectedPartnerFilter = 'all'; // 'all' 또는 협력사명 (대시보드와 동일한 협력사 필터)
  let navDate = new Date(); // 주/월 이동 기준 날짜 (‹ › 버튼으로 이동)
  let typeFilter = 'daily'; // 'all' | 'daily'(일반 점검) | 'monthly'(정밀점검) — 기본: 일반 점검만 집계

  // ===== Helpers =====
  function formatDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function calcStats(insps) {
    const total = insps.length;
    const totalItems = insps.reduce((s, i) => s + (i.totalCount || 0), 0);
    const totalPass = insps.reduce((s, i) => s + (i.passCount || 0), 0);
    const totalFail = insps.reduce((s, i) => s + (i.failCount || 0), 0);
    const totalHold = insps.reduce((s, i) => s + (i.holdCount || 0), 0);
    const totalNA = insps.reduce((s, i) => s + (i.naCount || 0), 0);
    const totalPending = Math.max(0, totalItems - totalNA - totalPass - totalFail - totalHold);
    // 합격률 = 합격 ÷ 실제 판정 수행 항목(합격+불합+보류) — 해당없음·미점검 항목은 분모에서 제외
    // (운영기준이 Line별 월 1회 점검으로 부분 점검 허용 → 미점검 항목이 합격률을 깎지 않도록 함)
    const denom = totalPass + totalFail + totalHold;
    const passRate = denom > 0 ? Math.round((totalPass / denom) * 100) : 0;
    return { total, totalItems, totalPass, totalFail, totalHold, totalNA, totalPending, passRate };
  }

  // 1건(passCount/failCount/holdCount 보유) 기준 합격률 = 합격 ÷ 실제 판정 수행 항목(합격+불합+보류)
  function recordPassRate(i) {
    const denom = (i.passCount || 0) + (i.failCount || 0) + (i.holdCount || 0);
    return denom > 0 ? Math.round(((i.passCount || 0) / denom) * 100) : 0;
  }

  // ===== 공정 클릭 상세: 해당 공정 점검 기록의 항목별 결과(합격/불합격/사진/비고) =====
  async function loadProcDetail(procName) {
    if (procDetailCache[procName]) return; // 이미 로딩 중이거나 로드 완료
    procDetailCache[procName] = { loading: true, records: [] };
    try {
      // 항목 내용 매핑 (최초 1회)
      if (!itemTextMap) {
        itemTextMap = {};
        (allChecklistItems || []).forEach(it => { itemTextMap[it.id] = it; });
      }
      const records = procRecordsMap[procName] || [];
      const out = [];
      for (const insp of records) {
        let results = [];
        try { results = await DB.getInspectionResults(insp.id) || []; } catch (e) { results = []; }
        results = results.filter(r => r && r.status && r.status !== 'pending');
        results.sort((a, b) => String(a.itemNo || '').localeCompare(String(b.itemNo || ''), 'ko', { numeric: true }));
        out.push({ inspection: insp, results });
      }
      procDetailCache[procName] = { loading: false, records: out };
    } catch (e) {
      console.error('[partner-summary] 공정 상세 로딩 실패:', e);
      procDetailCache[procName] = { loading: false, records: [] };
    }
    render();
  }

  function renderProcDetail(procName) {
    const cache = procDetailCache[procName];
    if (!cache || cache.loading) {
      loadProcDetail(procName);
      return `<div style="padding:10px 4px;font-size:12px;color:#999;">⏳ ${I18N.t('loadingDetail')}</div>`;
    }
    if (!cache.records.length) return `<div style="padding:10px 4px;font-size:12px;color:#999;">${I18N.t('noResultsPeriod')}</div>`;
    return cache.records.map(({ inspection, results }) => {
      const rDenom = (inspection.passCount || 0) + (inspection.failCount || 0) + (inspection.holdCount || 0);
      const rRate = rDenom > 0 ? Math.round(((inspection.passCount || 0) / rDenom) * 100) : 0;
      return `
        <div style="background:#fff;border:1px solid #e0e0e0;border-radius:6px;margin:8px 0 2px;padding:8px;">
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:bold;color:#333;margin-bottom:4px;">
            <span>📅 ${inspection.date || '-'} · ${inspection.inspector || '-'}</span>
            <span style="color:${rRate >= 90 ? '#43a047' : '#e53935'}">📊 ${rRate}%</span>
          </div>
          ${results.map(r => {
            const statusText = { pass: I18N.t('rdPass'), fail: I18N.t('rdFail'), hold: I18N.t('rdHold'), na: I18N.t('rdNA'), pending: I18N.t('rdPending') }[r.status] || '-';
            const statusColor = { pass: '#43a047', fail: '#e53935', hold: '#ff9800', na: '#757575', pending: '#999' }[r.status] || '#999';
            const photos = r.photoUri ? String(r.photoUri).split('||').filter(Boolean) : [];
            const item = itemTextMap ? itemTextMap[r.checklistItemId] : null;
            const itemText = item ? `${item.no ? item.no + '. ' : ''}${item.checkItem || ''}` : (r.itemNo ? '#' + r.itemNo : '');
            return `
              <div style="padding:6px 2px;border-bottom:1px solid #f0f0f0;">
                <div style="display:flex;gap:6px;align-items:flex-start;font-size:12px;">
                  <span style="flex-shrink:0;">${{ pass: '✅', fail: '❌', hold: '⏸️', na: '⊘' }[r.status] || '⏳'}</span>
                  <span style="color:${statusColor};font-weight:bold;white-space:nowrap;">${statusText}</span>
                  <span style="color:#555;word-break:break-word;">${itemText}</span>
                </div>
                ${r.remark ? `<div style="font-size:12px;color:#666;margin:4px 0 0 24px;word-break:break-word;">📝 ${r.status === 'na' ? I18N.t('rdNAReason') : I18N.t('rdRemark')}: ${r.remark}</div>` : ''}
                ${photos.length > 0 ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0 24px;">${photos.map(uri => `<img src="${uri}" alt="photo" style="width:64px;height:64px;object-fit:cover;border-radius:4px;border:1px solid #ddd;">`).join('')}</div>` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }).join('');
  }

  // ===== 요약 카드 상세: 불합격 항목 (기록별 ❌ 항목 + 비고 + 사진) =====
  async function loadFailDetail(inspId) {
    if (failDetailCache[inspId]) return;
    failDetailCache[inspId] = { loading: true, fails: [] };
    try {
      if (!itemTextMap) {
        itemTextMap = {};
        (allChecklistItems || []).forEach(it => { itemTextMap[it.id] = it; });
      }
      let results = [];
      try { results = await DB.getInspectionResults(inspId) || []; } catch (e) { results = []; }
      const fails = results.filter(r => r && r.status === 'fail')
        .sort((a, b) => String(a.itemNo || '').localeCompare(String(b.itemNo || ''), 'ko', { numeric: true }));
      failDetailCache[inspId] = { loading: false, fails };
    } catch (e) {
      console.error('[partner-summary] 불합격 상세 로딩 실패:', e);
      failDetailCache[inspId] = { loading: false, fails: [] };
    }
    render();
  }

  function renderFailRecordDetail(i) {
    const cache = failDetailCache[i.id];
    if (!cache || cache.loading) {
      loadFailDetail(i.id);
      return `
        <div style="background:#fff;border:1px solid #f0f0f0;border-radius:6px;margin:6px 0;padding:8px;">
          <div style="font-size:12px;font-weight:bold;color:#333;">❌ ${i.date || '-'} · Line ${i.lineName || '-'} · ${i.processName || '-'} · ${I18N.t('inspectorColon')}${i.inspector || '-'}</div>
          <div style="font-size:12px;color:#999;margin-top:4px;">⏳ ${I18N.t('loadingDetail')}</div>
        </div>
      `;
    }
    return `
      <div style="background:#fff;border:1px solid #f0f0f0;border-radius:6px;margin:6px 0;padding:8px;">
        <div style="font-size:12px;font-weight:bold;color:#333;margin-bottom:4px;">❌ ${i.date || '-'} · Line ${i.lineName || '-'} · ${i.processName || '-'} · ${I18N.t('inspectorColon')}${i.inspector || '-'}</div>
        ${cache.fails.length === 0 ? `<div style="font-size:12px;color:#999;">-</div>` : cache.fails.map(r => {
          const photos = r.photoUri ? String(r.photoUri).split('||').filter(Boolean) : [];
          const item = itemTextMap ? itemTextMap[r.checklistItemId] : null;
          const itemText = item ? `${item.no ? item.no + '. ' : ''}${item.checkItem || ''}` : (r.itemNo ? '#' + r.itemNo : '');
          return `
            <div style="padding:6px 2px;border-bottom:1px solid #f0f0f0;">
              <div style="display:flex;gap:6px;align-items:flex-start;font-size:12px;">
                <span style="flex-shrink:0;">❌</span>
                <span style="color:#555;word-break:break-word;">${itemText}</span>
              </div>
              ${r.remark ? `<div style="font-size:12px;color:#666;margin:4px 0 0 24px;word-break:break-word;">📝 ${I18N.t('rdRemark')}: ${r.remark}</div>` : ''}
              ${photos.length > 0 ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0 24px;">${photos.map(uri => `<img src="${uri}" alt="photo" style="width:64px;height:64px;object-fit:cover;border-radius:4px;border:1px solid #ddd;">`).join('')}</div>` : ''}
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function getFilteredInspections() {
    let filtered = [...allInspections];
    if (activePeriod === 'week') {
      const d = new Date(navDate);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(d.setDate(diff));
      const sunday = new Date(monday);
      sunday.setDate(sunday.getDate() + 6);
      const fromStr = formatDate(monday);
      const toStr = formatDate(sunday);
      filtered = filtered.filter(i => i.date && i.date >= fromStr && i.date <= toStr);
    } else if (activePeriod === 'month') {
      const now = new Date(navDate);
      const monthStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      filtered = filtered.filter(i => i.date && i.date.startsWith(monthStr));
    } else if (activePeriod === 'custom') {
      if (customStartDate) filtered = filtered.filter(i => i.date >= customStartDate);
      if (customEndDate) filtered = filtered.filter(i => i.date <= customEndDate);
    }
    // 점검 유형 필터 적용 (daily=일반 점검, monthly=정밀점검)
    if (typeFilter !== 'all') {
      filtered = filtered.filter(i => (i.inspectionType || 'daily') === typeFilter);
    }
    // 협력사 필터 적용 (대시보드와 동일)
    if (selectedPartnerFilter !== 'all') {
      filtered = filtered.filter(i => (i.partnerName || '') === selectedPartnerFilter);
    }
    return filtered;
  }

  function getPeriodLabel() {
    if (activePeriod === 'week') {
      const d = new Date(navDate);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(d.setDate(diff));
      const sunday = new Date(monday);
      sunday.setDate(sunday.getDate() + 6);
      return `${I18N.t('thisWeek')} (${monday.getMonth()+1}/${monday.getDate()} ~ ${sunday.getMonth()+1}/${sunday.getDate()})`;
    } else if (activePeriod === 'month') {
      const now = new Date(navDate);
      return `${I18N.t('yearMonthFmt', String(now.getFullYear()), String(now.getMonth()+1))}`;
    } else if (activePeriod === 'all') {
      return I18N.t('allTime');
    } else if (activePeriod === 'custom') {
      if (customStartDate && customEndDate) return `${customStartDate} ~ ${customEndDate}`;
      if (customStartDate) return `${customStartDate} ~`;
      if (customEndDate) return `~ ${customEndDate}`;
      return I18N.t('customPeriod');
    }
    return '';
  }


  // ===== Render =====
  function render() {
    const filtered = getFilteredInspections();
    const byPartner = {};
    filtered.forEach(i => {
      const key = i.partnerName || I18N.t('unspecified');
      if (!byPartner[key]) byPartner[key] = [];
      byPartner[key].push(i);
    });
    const partnerNames = Object.keys(byPartner).sort();
    const overallStats = calcStats(filtered);

    let html = '';

    // Period Tab Bar
    html += `
      <div class="tab-bar">
        <button class="tab-btn ${activePeriod === 'week' ? 'active' : ''}" data-period="week">${I18N.t('thisWeek')}</button>
        <button class="tab-btn ${activePeriod === 'month' ? 'active' : ''}" data-period="month">${I18N.t('thisMonthBtn')}</button>
        <button class="tab-btn ${activePeriod === 'all' ? 'active' : ''}" data-period="all">${I18N.t('allPeriod')}</button>
        <button class="tab-btn ${activePeriod === 'custom' ? 'active' : ''}" data-period="custom">${I18N.t('tabCustom')}</button>
      </div>
    `;

    // 점검 유형 필터 (일반 점검 vs 정밀점검)
    html += `
      <div style="padding:8px 15px;background:#fff;border-bottom:1px solid #eee;">
        <div class="filter-row" style="flex-wrap:wrap;gap:6px;">
          <button class="filter-btn ${typeFilter === 'all' ? 'active' : ''}" data-type-filter="all">${I18N.t('allPeriod')}</button>
          <button class="filter-btn ${typeFilter === 'daily' ? 'active' : ''}" data-type-filter="daily">📋 ${I18N.t('daily')}</button>
          <button class="filter-btn ${typeFilter === 'monthly' ? 'active' : ''}" data-type-filter="monthly">🔬 ${I18N.t('monthly')}</button>
        </div>
      </div>
    `;

    // 협력사 필터 버튼 영역 (대시보드와 동일 — 협력사가 2개 이상일 때만 노출, 기간 무관 전체 기준)
    const allPartnerNames = [...new Set(allInspections.map(i => i.partnerName || ''))].sort();
    if (allPartnerNames.length >= 2) {
      html += `
        <div style="padding:0 15px 8px;background:#fff;border-bottom:1px solid #eee;">
          <div class="filter-row" style="flex-wrap:wrap;gap:6px;">
            <button class="filter-btn ${selectedPartnerFilter === 'all' ? 'active' : ''}" data-partner-filter="all">${I18N.t('allPeriod')} ${I18N.t('partner')}</button>
            ${allPartnerNames.map(pn => `<button class="filter-btn ${selectedPartnerFilter === pn ? 'active' : ''}" data-partner-filter="${pn}">${pn || I18N.t('unspecified')}</button>`).join('')}
          </div>
        </div>
      `;
    }

    // ===== 기준 협력사 설정 진입 버튼 =====
    html += `
      <div style="padding:0 15px 8px;background:#fff;">
        <button class="filter-btn ${showPartnerSetup ? 'active' : ''}" data-ps-exp-toggle style="font-size:12px;">⚙ ${I18N.t('expPartnerSetup')}</button>
      </div>
    `;

    // 기준 협력사 설정 패널 (사용자 입력 — 기준정보 등록/삭제)
    if (showPartnerSetup) {
      html += `
        <div style="padding:0 15px 10px;background:#fff;">
          <div style="display:flex;gap:6px;align-items:center;">
            <input type="text" id="psExpInput" placeholder="${I18N.t('expPartnerPh')}" style="flex:1;padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;outline:none;">
            <button class="filter-btn active" id="psExpAdd">${I18N.t('expAddBtn')}</button>
          </div>
          ${expectedPartners.length > 0 ? `
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">
              ${expectedPartners.map(pn => `
                <span style="display:inline-flex;align-items:center;gap:6px;background:#f1f3f5;border-radius:12px;padding:4px 10px;font-size:12px;color:#333;">
                  ${pn}
                  <span data-ps-exp-remove="${pn}" style="cursor:pointer;color:#e53935;font-weight:bold;">✕</span>
                </span>
              `).join('')}
            </div>
          ` : `<div style="font-size:12px;color:#999;margin-top:6px;">${I18N.t('expPartnerHint')}</div>`}
        </div>
      `;
    }

    // ===== 기준 협력사 점검 현황 (기간 내 점검 결과가 오면 OK, 없으면 Warning) =====
    if (expectedPartners.length > 0) {
      html += `
        <div class="section">
          <div class="section-title">${I18N.t('expPartnerTitle')}</div>
          ${expectedPartners.map(pn => {
            const recs = filtered.filter(i => (i.partnerName || '') === pn);
            const lastDate = recs.map(i => i.date || '').sort().pop() || '';
            return recs.length > 0 ? `
              <div class="dashboard-line-card" style="border-left:4px solid #43a047;">
                <div class="dashboard-line-header">
                  <span class="dashboard-line-name" style="color:#43a047;">✅ ${pn}</span>
                  <span class="dashboard-line-count" style="color:#43a047;font-weight:bold;">${I18N.t('expDone')}</span>
                </div>
                <div style="font-size:12px;color:#888;margin-top:4px;">${recs.length}${I18N.t('unitRecords')}${lastDate ? ' · ' + lastDate : ''}</div>
              </div>
            ` : `
              <div class="dashboard-line-card" style="border-left:4px solid #e53935;background:#fff5f5;">
                <div class="dashboard-line-header">
                  <span class="dashboard-line-name" style="color:#e53935;">⚠️ ${pn}</span>
                  <span class="dashboard-line-count" style="color:#e53935;font-weight:bold;">${I18N.t('notInspected')}</span>
                </div>
                <div style="font-size:12px;color:#e53935;margin-top:4px;">${I18N.t('expNoRecord')}</div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    // Custom period inputs
    if (activePeriod === 'custom') {
      const todayStr = formatDate(new Date());
      html += `
        <div class="filter-row filter-custom-row" style="padding:10px 15px;background:#fff;border-bottom:1px solid #eee;align-items:center;gap:8px;">
          <input type="date" class="date-input" id="psCustomStart" value="${customStartDate}" max="${customEndDate || todayStr}">
          <span style="color:#999;font-size:14px;">~</span>
          <input type="date" class="date-input" id="psCustomEnd" value="${customEndDate}" min="${customStartDate || ''}" max="${todayStr}">
          <button class="filter-btn active" id="psApplyCustom">${I18N.t('applyBtn')}</button>
        </div>
      `;
    }

    // Period label (+ 주간/월간 이동 버튼)
    const showNav = activePeriod === 'week' || activePeriod === 'month';
    html += `<div class="dashboard-period-nav">`;
    if (showNav) html += `<button class="period-nav-btn" data-dir="prev">‹</button>`;
    html += `<div class="dashboard-period">${getPeriodLabel()} | ${I18N.t('partnerCount', String(partnerNames.length))}${selectedPartnerFilter !== 'all' ? ` | ${selectedPartnerFilter || I18N.t('unspecified')}` : ''}</div>`;
    if (showNav) html += `<button class="period-nav-btn" data-dir="next">›</button>`;
    html += `</div>`;

    if (filtered.length === 0) {
      html += `<div class="empty-state">${I18N.t('noResultsPeriod')}</div>`;
      container.innerHTML = html;
      bindEvents();
      return;
    }

    // ===== Partner Detail View =====
    if (selectedPartner) {
      const partnerInsps = byPartner[selectedPartner] || [];
      const pStats = calcStats(partnerInsps);

      // Group by Line
      const byLine = {};
      partnerInsps.forEach(i => {
        const key = i.lineName || 'Unknown';
        if (!byLine[key]) byLine[key] = [];
        byLine[key].push(i);
      });

      // Group by Process
      // Line 상세 보기 중이면 해당 Line 데이터만 대상 (공정별 현황·점검 목록)
      const viewInsps = selectedLine ? (byLine[selectedLine] || []) : partnerInsps;
      const vStats = calcStats(viewInsps);
      const byProcess = {};
      viewInsps.forEach(i => {
        const key = i.processName || 'Unknown';
        if (!byProcess[key]) byProcess[key] = [];
        byProcess[key].push(i);
      });

      // 공정 클릭 상세용 기록 맵 + 무효한 펼침 상태 정리
      procRecordsMap = {};
      Object.keys(byProcess).forEach(pn => { procRecordsMap[pn] = byProcess[pn]; });
      if (selectedProc && !byProcess[selectedProc]) selectedProc = null;

      html += `
        <div class="section">
          <div class="section-title">
            <button class="filter-btn" id="psBackBtn" style="margin-right:8px;">${I18N.t('listBackBtn')}</button>
            <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            ${selectedLine ? I18N.t('partnerDetailFmt', 'Line ' + selectedLine) : `🏢 ${I18N.t('partnerDetailFmt', selectedPartner)}`}
          </div>
          <div style="font-size:13px;color:#666;margin-bottom:14px;">
            ${I18N.t('psStatsLine', String(vStats.total), String(vStats.totalItems), I18N.t('statusPass'), String(vStats.totalPass), I18N.t('statusFail'), String(vStats.totalFail), I18N.t('passRateLabel'), String(vStats.passRate))}
          </div>
      `;

      // Line별 현황 (Line 상세 보기 중에는 숨김 — 카드 클릭 시 해당 Line 상세 표시)
      if (!selectedLine) {
        html += `<div style="font-size:14px;font-weight:bold;margin:14px 0 6px;color:#333;">${I18N.t('byLineStatus')}</div>`;
        html += `<div class="card-grid">`;
        html += Object.keys(byLine).sort().map(lineName => {
          const ls = calcStats(byLine[lineName]);
          const color = ls.passRate >= 90 ? '#43a047' : '#e53935';
          return `
            <div class="dashboard-line-card" data-line="${lineName}" style="cursor:pointer;">
              <div class="dashboard-line-header">
                <span class="dashboard-line-name">Line ${lineName}</span>
                <span class="dashboard-line-count">${ls.total}${I18N.t('unitRecords')}</span>
              </div>
              <div style="font-size:12px;color:#888;margin:2px 0 4px;">${I18N.t('itemsBreakdownFmt', String(ls.totalItems), String(ls.totalNA), String(ls.totalItems - ls.totalNA))}</div>
              <div class="dashboard-line-stats">
                <span style="color:#2196F3" title="${I18N.t('statusPass')}">✅ ${ls.totalPass}</span>
                <span style="color:#e53935" title="${I18N.t('statusFail')}">❌ ${ls.totalFail}</span>
                <span style="color:#ff9800" title="${I18N.t('statusHold')}">⏸ ${ls.totalHold}</span>
                <span style="color:#9e9e9e" title="${I18N.t('notInspected')}">⬜ ${ls.totalPending}</span>
                <span style="color:${color}" title="${I18N.t('passRateLabel')}">📊 ${ls.passRate}%</span>
              </div>
              <div class="progressbar-track" style="margin-top:6px;"><div class="progressbar-fill" style="width:${ls.passRate}%;background:${color};"></div></div>
            </div>
          `;
        }).join('');
        html += `</div>`;
      }

      // 공정별 현황 (공정 클릭 시 항목별 점검 상세 펼침)
      html += `<div style="font-size:14px;font-weight:bold;margin:14px 0 6px;color:#333;">${I18N.t('byProcessStatus')}</div>`;
      html += `<div class="card-grid">`;
      html += Object.keys(byProcess).sort().map(procName => {
        const ps = calcStats(byProcess[procName]);
        const color = ps.passRate >= 90 ? '#43a047' : '#e53935';
        const isProcOpen = selectedProc === procName;
        return `
          <div class="dashboard-line-card">
            <div data-ps-proc="${procName}" style="cursor:pointer;">
              <div class="dashboard-line-header">
                <span class="dashboard-line-name" style="color:${isProcOpen ? '#1976d2' : 'inherit'};">${isProcOpen ? '▼' : '▶'} ${procName}</span>
                <span class="dashboard-line-count">${ps.total}${I18N.t('unitRecords')} ${isProcOpen ? '▲' : '▼'}</span>
              </div>
              <div style="font-size:12px;color:#888;margin:2px 0 4px;">${I18N.t('itemsBreakdownFmt', String(ps.totalItems), String(ps.totalNA), String(ps.totalItems - ps.totalNA))}</div>
              <div class="dashboard-line-stats">
                <span style="color:#2196F3" title="${I18N.t('statusPass')}">✅ ${ps.totalPass}</span>
                <span style="color:#e53935" title="${I18N.t('statusFail')}">❌ ${ps.totalFail}</span>
                <span style="color:#ff9800" title="${I18N.t('statusHold')}">⏸ ${ps.totalHold}</span>
                <span style="color:#9e9e9e" title="${I18N.t('notInspected')}">⬜ ${ps.totalPending}</span>
                <span style="color:${color}" title="${I18N.t('passRateLabel')}">📊 ${ps.passRate}%</span>
              </div>
              <div class="progressbar-track" style="margin-top:6px;"><div class="progressbar-fill" style="width:${ps.passRate}%;background:${color};"></div></div>
            </div>
            ${isProcOpen ? renderProcDetail(procName) : ''}
          </div>
        `;
      }).join('');
      html += `</div>`;


      // 점검 목록
      html += `<div style="font-size:14px;font-weight:bold;margin:14px 0 6px;color:#333;">${I18N.t('inspectionList')}</div>`;
      html += `<div class="card-grid">`;
      html += viewInsps.map(i => {
        const passRate = recordPassRate(i);
        const color = passRate >= 90 ? '#43a047' : '#e53935';
        const iPending = Math.max(0, (i.totalCount || 0) - (i.naCount || 0) - (i.passCount || 0) - (i.failCount || 0) - (i.holdCount || 0));
        return `
          <div class="report-card" onclick="App.navigate('reportDetail', {inspectionId:${i.id}})">
            <div class="report-card-header">
              <span class="report-process">${i.processName}</span>
              <span class="report-date">${i.date}</span>
            </div>
            <div class="report-info">${i.partnerName || ''} | ${i.factoryName || ''} | Line ${i.lineName}</div>
            <div class="report-inspector">${I18N.t('inspectorColon')}${i.inspector || '-'} | ${I18N.t('typeColon')}${i.inspectionType === 'monthly' ? I18N.t('typeMonthly') : I18N.t('typeWeekly')}</div>
            <div class="report-stats">
              <div class="stat-item">
                <div class="stat-value" style="color:#2196F3">${i.passCount || 0}</div>
                <div class="stat-label">${I18N.t('statusPass')}</div>
              </div>
              <div class="stat-item">
                <div class="stat-value" style="color:#e53935">${i.failCount || 0}</div>
                <div class="stat-label">${I18N.t('statusFail')}</div>
              </div>
              <div class="stat-item">
                <div class="stat-value" style="color:#ff9800">${i.holdCount || 0}</div>
                <div class="stat-label">${I18N.t('statusHold')}</div>
              </div>
              <div class="stat-item">
                <div class="stat-value" style="color:#9e9e9e">${iPending}</div>
                <div class="stat-label">${I18N.t('notInspected')}</div>
              </div>
              <div class="stat-item">
                <div class="stat-value" style="color:${color}">${passRate}%</div>
                <div class="stat-label">${I18N.t('passRateLabel')}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
      html += `</div>`;

      html += `</div>`;

    } else {
      // ===== Summary Cards (클릭 시 카드별 상세 패널 펼침/접힘) =====
      const overallColor = overallStats.passRate >= 90 ? '#43a047' : '#e53935';
      const cardArrow = k => openCard === k ? ' ▲' : ' ▼';
      html += `
        <div class="dashboard-summary">
          <div class="dashboard-stat-card" data-ps-card="partner" style="cursor:pointer;">
            <div class="dashboard-stat-value">${partnerNames.length}</div>
            <div class="dashboard-stat-label">${I18N.t('partner')}${cardArrow('partner')}</div>
          </div>
          <div class="dashboard-stat-card" data-ps-card="count" style="border-left-color:#2196F3;cursor:pointer;">
            <div class="dashboard-stat-value" style="color:#2196F3">${overallStats.total}</div>
            <div class="dashboard-stat-label">${I18N.t('inspCountLabel')}${cardArrow('count')}</div>
          </div>
          <div class="dashboard-stat-card" data-ps-card="fail" style="border-left-color:#e53935;cursor:pointer;">
            <div class="dashboard-stat-value" style="color:#e53935">${overallStats.totalFail}</div>
            <div class="dashboard-stat-label">${I18N.t('itemsOfLabel', I18N.t('statusFail'))}${cardArrow('fail')}</div>
          </div>
          <div class="dashboard-stat-card" data-ps-card="rate" style="border-left-color:${overallColor};cursor:pointer;">
            <div class="dashboard-stat-value" style="color:${overallColor}">${overallStats.passRate}%</div>
            <div class="dashboard-stat-label">${I18N.t('passRateLabel')}${cardArrow('rate')}</div>
          </div>
        </div>
      `;

      // 요약 카드 상세 패널
      if (openCard) {
        let panel = '';
        if (openCard === 'partner') {
          // 협력사 수: 협력사별 기록·항목 분해
          panel = partnerNames.map(name => {
            const pStats = calcStats(byPartner[name]);
            return `
              <div class="dashboard-line-card">
                <div class="dashboard-line-header">
                  <span class="dashboard-line-name">🏢 ${name || I18N.t('unspecified')}</span>
                  <span class="dashboard-line-count">${pStats.total}${I18N.t('unitRecords')}</span>
                </div>
                <div class="dashboard-line-stats">
                  <span style="color:#2196F3">✅ ${pStats.totalPass}</span>
                  <span style="color:#e53935">❌ ${pStats.totalFail}</span>
                  <span style="color:#757575">⊘ ${pStats.totalNA}</span>
                  <span style="color:#9e9e9e">⬜ ${pStats.totalPending}</span>
                  <span style="color:#666">Σ ${pStats.totalItems}</span>
                </div>
              </div>
            `;
          }).join('') || `<div class="empty-state">${I18N.t('noResultsPeriod')}</div>`;
        } else if (openCard === 'count') {
          // 점검수: 현재 필터 기준 점검 기록 목록 (클릭 시 상세 화면 이동)
          const recs = [...filtered].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
          panel = recs.map(i => `
            <div class="report-card" onclick="App.navigate('reportDetail', {inspectionId:${i.id}})">
              <div class="report-card-header">
                <span class="report-process">${i.lineName ? 'Line ' + i.lineName : '-'} · ${i.processName || '-'}</span>
                <span class="report-date">${i.date || '-'}</span>
              </div>
              <div class="report-info">${i.partnerName || I18N.t('unspecified')} | ${i.inspectionType === 'monthly' ? I18N.t('typeMonthly') : I18N.t('typeWeekly')}</div>
              <div class="report-inspector">${I18N.t('inspectorColon')}${i.inspector || '-'}</div>
            </div>
          `).join('') || `<div class="empty-state">${I18N.t('noResultsPeriod')}</div>`;
        } else if (openCard === 'fail') {
          // 불합격 항목: 불합격 항목이 있는 기록의 ❌ 항목 상세 (항목 내용·비고·사진)
          const failRecs = [...filtered].filter(i => (i.failCount || 0) > 0).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
          panel = failRecs.length
            ? failRecs.map(i => renderFailRecordDetail(i)).join('')
            : `<div class="empty-state">${I18N.t('noResultsPeriod')}</div>`;
        } else if (openCard === 'rate') {
          // 합격률: 협력사별 합격률
          panel = partnerNames.map(name => {
            const pStats = calcStats(byPartner[name]);
            const c = pStats.passRate >= 90 ? '#43a047' : '#e53935';
            return `
              <div class="dashboard-line-card">
                <div class="dashboard-line-header">
                  <span class="dashboard-line-name">🏢 ${name || I18N.t('unspecified')}</span>
                  <span class="dashboard-line-count">${pStats.total}${I18N.t('unitRecords')}</span>
                </div>
                <div class="dashboard-line-stats">
                  <span style="color:#2196F3">✅ ${pStats.totalPass}</span>
                  <span style="color:#e53935">❌ ${pStats.totalFail}</span>
                  <span style="color:${c}" title="${I18N.t('passRateLabel')}">📊 ${pStats.passRate}%</span>
                </div>
                <div class="progressbar-track" style="margin-top:6px;"><div class="progressbar-fill" style="width:${pStats.passRate}%;background:${c};"></div></div>
              </div>
            `;
          }).join('') || `<div class="empty-state">${I18N.t('noResultsPeriod')}</div>`;
        }
        html += `<div class="card-grid">${panel}</div>`;
      }

      // ===== Partner List =====
      html += `
        <div class="section">
          <div class="section-title">
            <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            ${I18N.t('partnerStatusTitle')}
          </div>
      `;

      html += `<div class="card-grid">`;
      html += partnerNames.map(name => {
        const pStats = calcStats(byPartner[name]);
        const partnerLines = [...new Set(byPartner[name].map(i => i.lineName))].sort((a,b) => {
          const na = parseInt(a) || 0, nb = parseInt(b) || 0;
          return na - nb;
        });
        const color = pStats.passRate >= 90 ? '#43a047' : '#e53935';
        return `
          <div class="partner-card" data-partner="${name}">
            <div class="partner-card-header">
              <span class="partner-name">🏢 ${name}</span>
              <span class="partner-count">${pStats.total}${I18N.t('unitRecords')}</span>
            </div>
            <div class="partner-lines">Line: ${partnerLines.join(', ') || '-'}</div>
            <div class="partner-stats">
              <span style="color:#2196F3">✅ ${pStats.totalPass}</span>
              <span style="color:#e53935">❌ ${pStats.totalFail}</span>
              <span style="color:${color}">📊 ${pStats.passRate}%</span>
            </div>
            <div class="progressbar-track" style="margin-top:6px;"><div class="progressbar-fill" style="width:${pStats.passRate}%;background:${color};"></div></div>
          </div>
        `;
      }).join('');
      html += `</div>`;
      html += `</div>`;
    }

    container.innerHTML = html;
    bindEvents();
  }


  // ===== Event Binding =====
  function bindEvents() {
    // 점검 유형 필터 (일반 점검 vs 정밀점검)
    container.querySelectorAll('[data-type-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        typeFilter = btn.dataset.typeFilter;
        selectedPartner = null;
        render();
      });
    });

    // Period tabs
    container.querySelectorAll('[data-period]').forEach(btn => {
      btn.addEventListener('click', () => {
        activePeriod = btn.dataset.period;
        selectedPartner = null;
        selectedLine = null;
        navDate = new Date(); // 기간 전환 시 이동 기준을 오늘로 초기화
        if (activePeriod !== 'custom') {
          customStartDate = '';
          customEndDate = '';
        }
        render();
      });
    });

    // Period navigation (prev/next): 주간 ±7일, 월간 ±1개월
    container.querySelectorAll('[data-dir]').forEach(btn => {
      btn.addEventListener('click', () => {
        const dir = btn.dataset.dir;
        if (activePeriod === 'week') {
          navDate.setDate(navDate.getDate() + (dir === 'prev' ? -7 : 7));
        } else if (activePeriod === 'month') {
          navDate.setMonth(navDate.getMonth() + (dir === 'prev' ? -1 : 1));
        }
        render();
      });
    });

    // 협력사 필터 버튼
    container.querySelectorAll('[data-partner-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedPartnerFilter = btn.dataset.partnerFilter;
        selectedPartner = null; // 필터 변경 시 상세 보기 초기화
        selectedLine = null;
        render();
      });
    });

    // Custom period inputs
    const startInput = container.querySelector('#psCustomStart');

    // 기준 협력사 설정 패널 토글
    const expToggle = container.querySelector('[data-ps-exp-toggle]');
    if (expToggle) expToggle.addEventListener('click', () => {
      showPartnerSetup = !showPartnerSetup;
      render();
    });

    // 기준 협력사 추가 (입력 + Enter 지원)
    const expAdd = container.querySelector('#psExpAdd');
    const expInput = container.querySelector('#psExpInput');
    if (expAdd) expAdd.addEventListener('click', () => {
      const name = ((expInput && expInput.value) || '').trim();
      if (!name) return;
      if (!expectedPartners.includes(name)) {
        expectedPartners.push(name);
        saveExpectedPartners();
      }
      render();
      const ni = container.querySelector('#psExpInput');
      if (ni) ni.focus();
    });
    if (expInput) expInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (expAdd) expAdd.click();
      }
    });

    // 기준 협력사 삭제
    container.querySelectorAll('[data-ps-exp-remove]').forEach(x => {
      x.addEventListener('click', () => {
        expectedPartners = expectedPartners.filter(pn => pn !== x.dataset.psExpRemove);
        saveExpectedPartners();
        render();
      });
    });
    const endInput = container.querySelector('#psCustomEnd');
    const applyBtn = container.querySelector('#psApplyCustom');
    if (startInput) startInput.addEventListener('change', () => { customStartDate = startInput.value; });
    if (endInput) endInput.addEventListener('change', () => { customEndDate = endInput.value; });
    if (applyBtn) applyBtn.addEventListener('click', () => { render(); });

    // Partner card click → detail view
    container.querySelectorAll('[data-partner]').forEach(card => {
      card.addEventListener('click', () => {
        selectedPartner = card.dataset.partner;
        selectedLine = null;
        render();
        container.scrollTop = 0;
      });
    });

    // 요약 카드 클릭 → 카드별 상세 패널 펼침/접힘
    container.querySelectorAll('[data-ps-card]').forEach(card => {
      card.addEventListener('click', () => {
        const k = card.dataset.psCard;
        openCard = (openCard === k) ? null : k;
        render();
      });
    });

    // Line card click → Line 상세 보기
    container.querySelectorAll('[data-line]').forEach(card => {
      card.addEventListener('click', () => {
        selectedLine = card.dataset.line;
        selectedProc = null; // Line 전환 시 공정 상세 초기화
        render();
        container.scrollTop = 0;
      });
    });

    // 공정 행 클릭 → 항목별 점검 상세(합격/불합격/사진/비고) 펼침/접기
    container.querySelectorAll('[data-ps-proc]').forEach(row => {
      row.addEventListener('click', () => {
        selectedProc = (selectedProc === row.dataset.psProc) ? null : row.dataset.psProc;
        render();
      });
    });

    // Back button (Line 상세 중이면 협력사 상세로, 아니면 목록으로)
    const backBtn = container.querySelector('#psBackBtn');
    if (backBtn) backBtn.addEventListener('click', () => {
      if (selectedLine) {
        selectedLine = null;
      } else {
        selectedPartner = null;
      }
      render();
    });

    // 헤더 뒤로가기 버튼: 화면 내부 상세 상태를 먼저 되돌림 (Line 상세 → 협력사 상세 → 목록)
    // 내부 상태가 없으면 false 반환 → App.navigateBack()이 이전 화면으로 이동
    if (typeof App !== 'undefined') {
      App._backStateHandler = function() {
        if (selectedLine) {
          selectedLine = null;
          render();
          return true;
        }
        if (selectedPartner) {
          selectedPartner = null;
          render();
          return true;
        }
        return false;
      };
    }
  }

  render();
};



  </script>
</body>
</html>
