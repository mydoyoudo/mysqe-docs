// ===== User Management Screen =====
Screens.userManage = async function(container, params) {
  const users = await DB.getAllUsers();

  function render() {
    let html = `
      <div class="section">
        <div class="section-title">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          ${I18N.t('userManage')}
        </div>

        <!-- Add user form -->
        <div class="card" style="margin-bottom:15px;">
          <div class="input-group">
            <label class="input-label">${I18N.t('phUserName')}</label>
            <input type="text" class="text-input" id="newUserName" placeholder="${I18N.t('phNewUser')}">
          </div>
          <div class="input-group">
            <label class="input-label">${I18N.t('roleWord')}</label>
            <select class="text-input" id="newUserRole">
              <option value="inspector">${I18N.t('inspector')}</option>
              <option value="admin">${I18N.t('roleAdminOpt')}</option>
            </select>
          </div>
          <button class="btn-primary" onclick="addUser()">${I18N.t('addUserBtn')}</button>
        </div>

        <!-- User list -->
        ${users.length === 0 ? `
          <div class="empty-state">${I18N.t('noUsersShort')}</div>
        ` : `
          ${users.map(u => `
            <div class="card" style="margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;">
              <div style="display:flex;align-items:center;gap:10px;">
                <div style="width:40px;height:40px;border-radius:50%;background:${u.role === 'admin' ? '#e53935' : '#2196F3'};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:16px;">
                  ${u.name.charAt(0)}
                </div>
                <div>
                  <div style="font-weight:700;font-size:15px;">${u.name}</div>
                  <div style="font-size:12px;color:${u.role === 'admin' ? '#e53935' : '#2196F3'};font-weight:700;">
                    ${u.role === 'admin' ? I18N.t('roleAdmin') : I18N.t('roleInspector')}
                  </div>
                </div>
              </div>
              <div style="display:flex;gap:5px;">
                <button style="background:#2196F3;color:#fff;border:none;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:12px;" onclick="editUserRole(${u.id})">${I18N.t('roleChangeBtn')}</button>
                <button style="background:#e53935;color:#fff;border:none;border-radius:4px;padding:5px 10px;cursor:pointer;font-size:12px;" onclick="deleteUser(${u.id})">${I18N.t('deleteBtn')}</button>
              </div>
            </div>
          `).join('')}
        `}
      </div>
    `;

    container.innerHTML = html;
  }

  window.addUser = async function() {
    const name = document.getElementById('newUserName').value.trim();
    const role = document.getElementById('newUserRole').value;
    if (!name) { alert(I18N.t('enterName')); return; }
    await DB.addUser(name, role);
    users.push({name, role, createdAt: new Date().toISOString()});
    // Re-fetch to get proper IDs
    const updated = await DB.getAllUsers();
    users.length = 0;
    users.push(...updated);
    render();
  };

  window.editUserRole = async function(userId) {
    const user = users.find(u => u.id === userId);
    if (!user) return;
    const newRole = user.role === 'admin' ? 'inspector' : 'admin';
    await DB.updateUser(userId, {role: newRole});
    user.role = newRole;
    render();
  };

  window.deleteUser = async function(userId) {
    if (!confirm(I18N.t('deleteUserConfirm'))) return;
    await DB.deleteUser(userId);
    const idx = users.findIndex(u => u.id === userId);
    if (idx >= 0) users.splice(idx, 1);
    render();
  };

  render();
};

// ===== Data Merge Screen (점검 결과 취합 & DB 반영) =====
// 모바일에서 점검한 엑셀 결과를 업로드하여:
//   1. PC 프로그램 DB에 점검 결과로 저장 (대시보드/결과조회에서 확인 가능)
//   2. 통합 리포트 엑셀 파일 추출
Screens.dataMerge = async function(container, params) {
  const allProcesses = await DB.getAllProcesses() || [];
  let allInspections = await DB.getAllInspections() || [];

  // Track uploaded files with parsed row data
  let importedFiles = [];
  let lastImportResult = null;
  let isImporting = false;

  // --- Helpers ---

  // 점검 유형 추론 (주기 → inspectionType)
  // 주기 값도 엑셀 추출 당시 앱 표시 언어로 기록되므로 언어별 표기를 모두 인식한다.
  //   주간(daily): 매주(ko) / Weekly(en) / 每周(zh) / ทุกสัปดาห์(th) / Cada semana(es) / Hàng tuần(vi) / Co tydzień(pl→영문 폴백)
  //   정기(monthly): 매월(ko) / Monthly(en) / 每月(zh) / ทุกเดือน(th) / Cada mes(es) / Hàng tháng(vi) / Co miesiąc
  const WEEKLY_CYCLE_WORDS = ['매일', '매주', '매일간', '일일', '주간', '1회/일', '1회/주', 'daily', 'weekly', '每天', '每周', '每日', 'ทุกสัปดาห์', 'ทุกวัน', 'cada semana', 'diaria', 'hàng tuần', 'co tydzień'];
  function inferInspectionType(cycle) {
    const c = String(cycle || '').trim().toLowerCase();
    if (!c) return 'monthly';
    if (WEEKLY_CYCLE_WORDS.some(w => c === w || c.includes(w))) return 'daily';
    return 'monthly';
  }

  // "Line 1" → "1" (DB에는 lineName이 숫자/이름만 저장됨)
  function parseLineName(lineStr) {
    if (!lineStr) return '';
    const s = String(lineStr).trim();
    const m = s.match(/Line\s*(.+)/i);
    return m ? m[1].trim() : s;
  }

  // 엑셀 날짜 셀 파싱 (문자열 또는 시리얼 번호 → YYYY-MM-DD)
  function parseDate(val) {
    if (!val || val === '') return '';
    if (typeof val === 'number') {
      const date = new Date(Math.round((val - 25569) * 86400 * 1000));
      if (!isNaN(date)) return date.toISOString().split('T')[0];
    }
    const s = String(val).trim();
    const m = s.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
    if (m) {
      return m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0');
    }
    // Excel 날짜 시리얼(문자열) 대응 — DRM 추출 경로에서는 모든 셀 값이 문자열로 전달됨
    if (/^\d{5}(\.\d+)?$/.test(s)) {
      const date = new Date(Math.round((parseFloat(s) - 25569) * 86400 * 1000));
      if (!isNaN(date)) return date.toISOString().split('T')[0];
    }
    return s;
  }

  // 점검결과 텍스트 → status 코드 (7개 언어 지원, pl은 영문 폴백)
  // 주의: es 사전에서 Hold('Pendiente')와 미점검('Pendiente')이 같은 단어 → 미점검으로 매핑
  const STATUS_WORDS = {
    pass:    ['합격', '적합', '양호', 'pass', '合格', 'ผ่าน', 'aprobado', 'đạt'],
    fail:    ['불합격', '부적합', '불량', 'fail', '不合格', 'ไม่ผ่าน', 'no aprobado', 'không đạt'],
    hold:    ['보류', 'hold', '暂缓', 'รอตัดสินใจ', 'tạm hoãn'],
    na:      ['해당없음', 'n/a', '不适用', 'ไม่เกี่ยวข้อง', 'no aplica', 'không áp dụng'],
    pending: ['미점검', '미실시', 'pending', '未点检', 'ยังไม่ได้ตรวจ', 'chưa kiểm tra', 'pendiente'],
  };
  function parseStatus(text) {
    const s = String(text || '').trim().toLowerCase();
    if (!s) return 'pending';
    if (s === 'ng') return 'fail'; // 협력사 자작 파일의 NG 표기
    if (/^n\.?a\.?$/.test(s) || s === '해당없음' || s === '不适用' || s === 'no aplica' || s === 'không áp dụng' || s === 'ไม่เกี่ยวข้อง') return 'na';
    // 1차: 완전 일치
    for (const code of Object.keys(STATUS_WORDS)) {
      if (STATUS_WORDS[code].includes(s)) return code;
    }
    // 2차: 부분 포함 ('불합격'이 '합격' 포함, 'no aprobado'가 'aprobado' 포함) → pass보다 fail/hold를 먼저 검사
    // ('na'는 부분 포함 오탐 위험('na'가 다른 단어에 포함)이 있어 완전 일치로만 판정)
    for (const code of ['fail', 'hold', 'pass', 'pending']) {
      if (STATUS_WORDS[code].some(w => s.includes(w))) return code;
    }
    return 'pending';
  }

  // NASCA DRM 암호화 파일 감지 (시그니처: "<## NASCA DRM FILE ...")
  // 사내 시스템이 첨부 파일에 DRM을 자동 적용하는 환경에서 일반 파싱이 실패하므로 사전 감지
  function isNascaDrmEncrypted(u8) {
    if (!u8 || u8.length < 16) return false;
    let probe = '';
    const n = Math.min(u8.length, 64);
    for (let i = 0; i < n; i++) probe += String.fromCharCode(u8[i]);
    return probe.indexOf('<## NASCA DRM') === 0;
  }

  // 복호화 진행 상태 토스트 (처리 중 사용자 대기 안내, alert는 차단형이라 대신 사용)
  let drmToastEl = null;
  function showDrmToast(msg) {
    removeDrmToast();
    drmToastEl = document.createElement('div');
    drmToastEl.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#1976d2;color:#fff;padding:10px 14px;font-size:13px;white-space:pre-line;box-shadow:0 2px 6px rgba(0,0,0,.3);';
    drmToastEl.textContent = msg;
    document.body.appendChild(drmToastEl);
  }
  function removeDrmToast() {
    if (drmToastEl && drmToastEl.parentNode) drmToastEl.parentNode.removeChild(drmToastEl);
    drmToastEl = null;
  }

  // NASCA DRM 추출 payload 파싱
  // main.js가 Excel COM으로 메모리에서 읽어 stdout으로 전달한 데이터 (UTF-8 → base64)
  //   ===PBA_SHEET===<시트명>
  //   ===PBA_ROW===<행번호>\t<셀값>...
  //   ===PBA_PIC===<시트명>\t<행번호>\t<base64 PNG>
  // parseExcelRows와 동일한 행 구조로 변환하여 이후 로직(importToDB/processMerge)을 재사용
  function parseDrmPayload(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const text = new TextDecoder('utf-8').decode(bytes);
    const sheets = [];
    const pics = [];
    let diag = '';
    let cur = null;
    for (const line of text.split(/\r?\n/)) {
      if (line.indexOf('===PBA_SHEET===') === 0) {
        cur = { name: line.slice(15), rows: [] };
        sheets.push(cur);
      } else if (line.indexOf('===PBA_ROW===') === 0 && cur) {
        const parts = line.slice(13).split('\t');
        cur.rows.push({ rowNo: parseInt(parts[0], 10) || 0, cells: parts.slice(1) });
      } else if (line.indexOf('===PBA_PIC===') === 0) {
        const parts = line.slice(13).split('\t');
        if (parts.length >= 3) pics.push({ sheet: parts[0], row: parseInt(parts[1], 10) || 0, b64: parts[2] });
      } else if (line.indexOf('===PBA_DIAG===') === 0) {
        diag = line.slice(14);
      }
    }
    const allRows = [];
    for (const sh of sheets) {
      if (sh.rows.length < 2) continue;
      let hIdx = -1;
      for (let i = 0; i < sh.rows.length; i++) {
        if (isHeaderRow(sh.rows[i].cells)) { hIdx = i; break; }
      }
      if (hIdx === -1) continue; // 헤더 없는 시트 스킵 (parseExcelRows와 동일)
      const headers = sh.rows[hIdx].cells.map(h => resolveHeader(h));
      const picsByRow = {};
      for (const p of pics) {
        if (p.sheet === sh.name) (picsByRow[p.row] = picsByRow[p.row] || []).push('data:image/png;base64,' + p.b64);
      }
      for (let i = hIdx + 1; i < sh.rows.length; i++) {
        const row = sh.rows[i];
        const cells = row.cells;
        if (!cells.some(c => String(c).trim() !== '')) continue;
        if (isCommentRow(cells)) continue;
        if (isHeaderRow(cells)) continue;
        const rowData = {};
        headers.forEach((logical, idx) => {
          if (!logical) return;
          rowData[logical] = cells[idx] !== undefined ? String(cells[idx]).trim() : '';
        });
        const cycle = (rowData.cycle || '').trim();
        allRows.push({
          process: (rowData.process || sh.name || '').trim(),
          line: parseLineName(rowData.line),
          date: parseDate(rowData.date),
          inspector: (rowData.inspector || '').trim(),
          partner: (rowData.partner || '').trim(),
          factory: (rowData.factory || '').trim(),
          category: (rowData.category || '').trim(),
          no: (rowData.no || '').trim(),
          grade: (rowData.grade || '').trim(),
          checkItem: (rowData.checkItem || '').trim(),
          checkMethod: (rowData.checkMethod || '').trim(),
          cycle: cycle,
          result: parseStatus(rowData.result),
          resultText: (rowData.result || '').trim(),
          remark: (rowData.remark || '').trim(),
          inspectionType: inferInspectionType(cycle),
          sheetName: sh.name,   // 사진 매칭용: 소속 시트
          rowNo: row.rowNo,     // 사진 매칭용: 엑셀 절대 행 번호
          photos: picsByRow[row.rowNo] || [],
        });
      }
    }
    allRows.diag = diag;
    // 진단용: 파일 안 사진 수와, 어떤 행에도 연결되지 못한 사진 위치
    allRows.picTotal = pics.length;
    allRows.picUnmatched = pics
      .filter(p => !allRows.some(r => r.sheetName === p.sheet && r.rowNo === p.row))
      .map(p => p.sheet + ' ' + p.row + '행');
    return allRows;
  }

  function readFileAsArrayBuffer(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.onerror = (e) => reject(e.target.error);
      reader.readAsArrayBuffer(file);
    });
  }

  // ===== 다국어 헤더 지원 =====
  // 모바일에서 내보낸 엑셀/CSV의 헤더는 "추출 당시 앱 표시 언어"로 기록되므로
  // 언어별 헤더 별칭을 모두 인식하여 어떤 언어 파일이든 취합 가능하게 한다.
  // (ko/en/zh/th/es/vi 지원, pl은 영문 폴백. 'categoryWord'/'cycleWord'는
  //  구버전에서 누락 번역 키가 리터럴로 기록된 과거 파일 호환용)
  const HEADER_ALIASES = {
    process:     ['공정', 'Process', '工序', 'กระบวนการ', 'Proceso', 'Công đoạn'],
    line:        ['Line'],
    date:        ['점검일자', '일자', 'Inspection Date', 'Date', '点检日期', '日期', 'วันที่ตรวจ', 'วันที่', 'Fecha de inspección', 'Fecha', 'Ngày kiểm tra', 'Ngày'],
    inspector:   ['점검자', 'Inspector', '点检者', 'ผู้ตรวจสอบ', 'Người kiểm tra'],
    partner:     ['협력사', 'Partner', '合作社', 'คู่ค้า', 'Proveedor', 'Đối tác'],
    factory:     ['공장', 'Factory', '工厂', 'โรงงาน', 'Planta', 'Nhà máy'],
    category:    ['카테고리', '대분류', 'categoryWord', 'Category', '大分类', 'หมวด', 'Categoría', 'Danh mục'],
    no:          ['No'],
    grade:       ['Grade'],
    checkItem:   ['Check Item'],
    checkMethod: ['Check Methods'],
    cycle:       ['주기', 'cycleWord', 'Cycle', '周期', 'รอบ', 'Ciclo', 'Chu kỳ'],
    result:      ['점검결과', 'Result', '点检结果', 'ผลตรวจ', 'Resultado', 'Kết quả', 'Inspection_Result', 'Resultado_Inspeccion', 'Ket_qua_kiem_tra'],
    remark:      ['비고', 'Remark', '备注', 'หมายเหตุ', 'Observación', 'Ghi chú'],
  };

  // 헤더 셀 정규화: 소문자화 + 괄호 보조 표기 제거('대분류 (Category)'→'대분류') + 공백/구두점 제거
  function normalizeHeader(text) {
    return String(text || '')
      .toLowerCase()
      .replace(/\([^)]*\)/g, '')
      .replace(/[\s.:·]/g, '')
      .trim();
  }

  // 정규화된 헤더 텍스트 → 논리 컬럼 역색인
  const HEADER_LOOKUP = {};
  for (const [logical, aliases] of Object.entries(HEADER_ALIASES)) {
    for (const a of aliases) {
      const n = normalizeHeader(a);
      if (n && !HEADER_LOOKUP[n]) HEADER_LOOKUP[n] = logical;
    }
  }

  // 헤더 셀 텍스트 → 논리 컬럼명 (미인식 시 null)
  function resolveHeader(text) {
    const n = normalizeHeader(text);
    if (!n) return null;
    if (HEADER_LOOKUP[n]) return HEADER_LOOKUP[n];
    // 부분 일치 폴백: 복합 표기 대응 ('Inspection Result' 등) — 짧은 별칭(2자 이하)은 오검출 방지를 위해 제외
    for (const [logical, aliases] of Object.entries(HEADER_ALIASES)) {
      for (const a of aliases) {
        const na = normalizeHeader(a);
        if (na.length >= 3 && n.includes(na)) return logical;
      }
    }
    return null;
  }

  // 엑셀/CSV 워크북을 파싱하여 구조화된 행 배열 반환
  // - 모바일에서 내보낸 CSV는 "# 공정: XXX" 코멘트 라인으로 시작하므로
  //   rows[0] 가 항상 헤더가 아님 → 헤더 행을 직접 탐지해야 함
  // - 다중 공정 CSV는 공정별로 "# 공정:" 마커 + 헤더가 반복되며
  //   섹션 사이에 빈 행이 있음 → 이들을 건너뛰어야 함
  // - 헤더 언어는 파일 추출 당시 앱 표시 언어를 따르므로 별칭 매칭으로 탐지
  function isHeaderRow(row) {
    if (!row || row.length === 0) return false;
    const logicals = new Set(row.map(c => resolveHeader(c)).filter(Boolean));
    if (logicals.size < 3) return false;
    // 공정 + 항목번호 컬럼이 있어야 실제 헤더로 인정
    return logicals.has('process') && logicals.has('no');
  }

  function isCommentRow(row) {
    if (!row || row.length === 0) return false;
    // 코멘트("# 공정: ...")는 앞 열이 빈 경우 첫 셀이 아닌 열에 위치할 수 있음 → 앞 3개 셀 검사
    for (let i = 0; i < Math.min(row.length, 3); i++) {
      const cell = String(row[i] || '').trim();
      const hit = HEADER_ALIASES.process.some(a => {
        const esc = a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return new RegExp('^#\\s*' + esc + '\\s*:').test(cell);
      });
      if (hit) return true;
    }
    return false;
  }

  function parseExcelRows(wb) {
    const allRows = [];
    for (const sheetName of wb.SheetNames) {
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false });
      if (rows.length < 2) continue;

      // 헤더 행 탐지: "# 공정:" 코멘트 행과 빈 행을 건너뛰고
      // 공정/항목번호 컬럼을 포함한 행을 헤더로 사용 (언어 무관 별칭 매칭)
      let headerIdx = -1;
      let headers = [];
      for (let i = 0; i < rows.length; i++) {
        if (isHeaderRow(rows[i])) {
          headerIdx = i;
          // 헤더 셀 → 논리 컬럼 매핑 (언어 무관)
          headers = rows[i].map(h => resolveHeader(h));
          break;
        }
      }
      if (headerIdx === -1) continue; // 헤더를 찾지 못하면 스킵

      for (let i = headerIdx + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length === 0) continue;

        const hasData = row.some(c => c !== undefined && c !== null && String(c).trim() !== '');
        if (!hasData) continue;

        // 코멘트 행("# 공정: ...") 건너뛰기
        if (isCommentRow(row)) continue;
        // 반복되는 헤더 행(다중 공정 CSV의 두 번째 섹션) 건너뛰기
        if (isHeaderRow(row)) continue;

        const rowData = {};
        headers.forEach((logical, idx) => {
          if (!logical) return; // 인식 불가한 헤더 컬럼은 무시
          rowData[logical] = row[idx] !== undefined ? String(row[idx]).trim() : '';
        });

        const processName = (rowData.process || sheetName || '').trim();
        const cycle = (rowData.cycle || '').trim();
        const inspectionType = inferInspectionType(cycle);

        allRows.push({
          process: processName,
          line: parseLineName(rowData.line),
          date: parseDate(rowData.date),
          inspector: (rowData.inspector || '').trim(),
          partner: (rowData.partner || '').trim(),
          factory: (rowData.factory || '').trim(),
          category: (rowData.category || '').trim(),
          no: (rowData.no || '').trim(),
          grade: (rowData.grade || '').trim(),
          checkItem: (rowData.checkItem || '').trim(),
          checkMethod: (rowData.checkMethod || '').trim(),
          cycle: cycle,
          result: parseStatus(rowData.result),
          resultText: (rowData.result || '').trim(),
          remark: (rowData.remark || '').trim(),
          inspectionType: inspectionType,
          sheetName: sheetName,   // 사진 매칭용: 소속 시트
          rowNo: i + 1,           // 사진 매칭용: 엑셀 1-based 행 번호
        });
      }
    }
    return allRows;
  }

  // --- ExcelJS 로드 보장 (사진 포함 엑셀 처리용) ---
  async function ensureExcelJS() {
    if (typeof ExcelJS !== 'undefined') return;
    const script = document.createElement('script');
    script.src = 'lib/exceljs.min.js';
    document.head.appendChild(script);
    await new Promise((resolve, reject) => {
      script.onload = resolve;
      script.onerror = () => reject(new Error('ExcelJS load failed'));
    });
  }

  // Uint8Array/ArrayBuffer → base64
  function bytesToBase64(buffer) {
    const bytes = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
    let binary = '';
    const CHUNK = 0x8000;
    for (let i = 0; i < bytes.length; i += CHUNK) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    }
    return btoa(binary);
  }

  // dataURL 이미지의 원본 크기 조회 (사진 비율 유지용)
  function getImageSize(dataUrl) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve({ w: img.naturalWidth || 1, h: img.naturalHeight || 1 });
      img.onerror = () => resolve(null);
      img.src = dataUrl;
    });
  }

  // 사진 포함 엑셀(xlsx)에서 셀에 임베드된 사진 추출
  // 반환: { [시트명]: { [행번호]: [dataURL, ...] } }
  async function extractPhotosFromXlsx(arrayBuffer) {
    await ensureExcelJS();
    const ewb = new ExcelJS.Workbook();
    await ewb.xlsx.load(arrayBuffer);
    const media = (ewb.model && ewb.model.media) || [];
    const photoMap = {};
    for (const eWs of ewb.worksheets) {
      const images = typeof eWs.getImages === 'function' ? eWs.getImages() : [];
      if (!images || images.length === 0) continue;
      const byRow = {};
      for (const img of images) {
        const tl = img.range && img.range.tl;
        if (!tl) continue;
        const rowNo = tl.row + 1;     // 0-based → 1-based 행 번호
        const colIdx = tl.col;        // 0-based 열 인덱스
        // 데이터 행의 P~R열(사진 전용 열) 사진만 대상
        if (rowNo < 2 || colIdx < 15 || colIdx > 17) continue;
        const m = media[img.imageId] || (media.find ? media.find(x => x.index === img.imageId) : null);
        if (!m || !m.buffer) continue;
        let ext = String(m.extension || 'png').toLowerCase();
        if (ext === 'jpg') ext = 'jpeg';
        if (ext !== 'jpeg' && ext !== 'png' && ext !== 'gif') continue;
        const dataUrl = `data:image/${ext};base64,${bytesToBase64(m.buffer)}`;
        if (!byRow[rowNo]) byRow[rowNo] = [];
        byRow[rowNo].push({ colIdx: colIdx, dataUrl: dataUrl });
      }
      for (const rowNo of Object.keys(byRow)) {
        byRow[rowNo] = byRow[rowNo].sort((a, b) => a.colIdx - b.colIdx).map(x => x.dataUrl);
      }
      if (Object.keys(byRow).length > 0) photoMap[eWs.name] = byRow;
    }
    return photoMap;
  }

  // --- 파일 업로드 처리 ---
  async function handleFileUpload(e) {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;

    if (typeof XLSX === 'undefined') {
      try { await window.ensurePBAXLSX(); } catch (e) { alert(I18N.t('xlsxNotLoaded')); return; }
    }

    for (const file of files) {
      try {
        let data = await readFileAsArrayBuffer(file);
        let u8 = new Uint8Array(data);

        // NASCA DRM 자동 추출
        // 사내 시스템이 첨부 파일에 DRM을 자동 적용하는 환경 대응:
        // PC(Excel 설치)에서는 Excel COM으로 메모리 추출(이 NASCA 정책은 Excel 저장 파일도
        // 재암호화하므로 디스크 우회 불가), 모바일에서는 PC 취합 안내
        if (isNascaDrmEncrypted(u8)) {
          if (!(window.fileAPI && window.fileAPI.isElectron)) {
            alert(I18N.t('drmMobileGuide'));
            continue;
          }
          showDrmToast(I18N.t('drmDecrypting'));
          let drmRows = null;
          try {
            const res = await window.fileAPI.decryptDrmFile(u8);
            if (res && res.ok && res.payload) {
              drmRows = parseDrmPayload(res.payload);
            } else {
              alert(I18N.t('drmDecryptFail', String(res && res.error ? res.error : '')));
              continue;
            }
          } catch (dErr) {
            alert(I18N.t('drmDecryptFail', String(dErr && dErr.message ? dErr.message : dErr)));
            continue;
          } finally {
            removeDrmToast();
          }
          if (!drmRows || drmRows.length === 0) {
            alert(I18N.t('drmDecryptFail', 'no valid rows'));
            continue;
          }
          alert(I18N.t('drmDecryptDone'));
          const drmPhotoTotal = drmRows.reduce((s, r) => s + (r.photos ? r.photos.length : 0), 0);
          if (drmPhotoTotal < drmRows.picTotal || drmRows.picUnmatched.length > 0) {
            console.warn('[Merge] DRM 사진 연결 확인', { picTotal: drmRows.picTotal, attached: drmPhotoTotal, unmatched: drmRows.picUnmatched, diag: drmRows.diag });
            alert(I18N.t('drmPhotoMismatch', String(drmPhotoTotal), String(drmRows.picTotal), drmRows.picUnmatched.join(', ') || '-', drmRows.diag || '-'));
          }
          const drmSheetNames = Array.from(new Set(drmRows.map(r => r.sheetName)));
          importedFiles.push({
            fileName: file.name,
            rowCount: drmRows.length,
            sheetCount: drmSheetNames.length,
            sheetNames: drmSheetNames,
            parsedRows: drmRows,
            photoCount: drmRows.reduce((s, r) => s + (r.photos ? r.photos.length : 0), 0),
          });
          continue;
        }

        const wb = XLSX.read(u8, { type: 'array' });
        const parsedRows = parseExcelRows(wb);

        // 사진 포함 엑셀이면 셀에 임베드된 사진을 추출하여 행에 연결
        if (/\.xlsx$/i.test(file.name)) {
          try {
            const photoMap = await extractPhotosFromXlsx(data);
            if (photoMap && Object.keys(photoMap).length > 0) {
              parsedRows.forEach(r => {
                const byRow = photoMap[r.sheetName];
                r.photos = (byRow && byRow[r.rowNo]) || [];
              });
            }
          } catch (pErr) {
            // 사진 추출 실패 시에도 데이터만 정상 처리
            console.warn('[Merge] 사진 추출 실패(데이터만 처리):', pErr);
          }
        }

        const sheetNames = [];
        for (const sheetName of wb.SheetNames) {
          const ws = wb.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
          if (rows.length > 1) {
            sheetNames.push(sheetName);
          }
        }

        importedFiles.push({
          fileName: file.name,
          rowCount: parsedRows.length,
          sheetCount: sheetNames.length,
          sheetNames: sheetNames,
          parsedRows: parsedRows,
          photoCount: parsedRows.reduce((s, r) => s + (r.photos ? r.photos.length : 0), 0),
        });
      } catch (err) {
        console.error('File parse error:', err);
        alert(I18N.t('parseError') + file.name + '\n' + err.message);
      }
    }

    e.target.value = '';
    render();
  }

  // --- DB 반영 (엑셀 → IndexedDB) ---
  window.importToDB = async function() {
    if (importedFiles.length === 0) return;

    // 모든 파싱된 행 수집
    const allRows = [];
    for (const f of importedFiles) {
      if (f.parsedRows) allRows.push(...f.parsedRows);
    }

    if (allRows.length === 0) {
      alert(I18N.t('noValidData'));
      return;
    }

    if (!confirm(I18N.t('importToDbConfirm', String(allRows.length)))) {
      return;
    }

    isImporting = true;
    render();

    try {
      // 체크리스트 항목 조회 (매칭용)
      // 공정명 외에 표시명(displayName)으로도 역색인 → 표시명 기준으로 기록된 파일도 매칭
      const procList = await DB.getAllProcesses() || [];
      const checklistLookup = {};
      for (const proc of procList) {
        const items = await DB.getChecklistItems(proc.id);
        const procMap = {};
        for (const item of items) {
          const key = item.no + '|' + (item.inspectionType || 'daily');
          procMap[key] = item;
          // 주기(점검 유형)와 무관하게 항목 번호로도 찾을 수 있게 한다
          if (!procMap[item.no]) procMap[item.no] = item;
        }
        if (proc.name) checklistLookup[proc.name] = procMap;
        if (proc.displayName && proc.displayName !== proc.name) checklistLookup[proc.displayName] = procMap;
      }

      // 행을 점검 단위로 그룹화: (공정, Line, 날짜, 점검자, 점검유형)
      const groups = {};
      const groupKeys = [];
      for (const row of allRows) {
        // 주기는 협력사별로 달라서 점검 묶음 기준에서 뺀다 (공정·Line·날짜·점검자 기준)
        const key = row.process + '|' + row.line + '|' + row.date + '|' + row.inspector + '|' + row.partner + '|' + (row.inspectionType || 'daily');
        if (!groups[key]) {
          groups[key] = {
            process: row.process,
            line: row.line,
            date: row.date,
            inspector: row.inspector,
            partner: row.partner,
            factory: row.factory,
            inspectionType: row.inspectionType || 'daily',
            items: [],
          };
          groupKeys.push(key);
        }
        groups[key].items.push(row);
      }

      // 같은 점검 안에서 같은 항목이 여러 번 나오면 1건만 반영 (재점검 기록이 함께 추출된 이전 파일 대응)
      // 엑셀은 최신 기록부터 내려오므로 먼저 나온 행을 남긴다
      for (const key of groupKeys) {
        const byItem = {};
        for (const row of groups[key].items) {
          const itemKey = row.no;
          // 같은 항목의 뒤 행에 있는 사진도 버리지 않도록 합친다 (최대 3장)
          if (!byItem[itemKey]) byItem[itemKey] = { ...row, photos: (row.photos || []).slice(0, 3) };
          else byItem[itemKey].photos = byItem[itemKey].photos.concat(row.photos || []).slice(0, 3);
        }
        groups[key].items = Object.values(byItem);
      }

      // 최신 DB 점검 목록 (중복 체크용)
      const existingInspections = await DB.getAllInspections() || [];

      // 중복 체크: 같은 날짜+Line+공정+점검자+점검유형+협력사
      const findExisting = (group) => existingInspections.filter(e =>
        e.date === group.date &&
        e.lineName === group.line &&
        e.processName === group.process &&
        e.inspector === group.inspector &&
        (e.partnerName || '') === (group.partner || '') &&
        (e.inspectionType || 'daily') === (group.inspectionType || 'daily')
      );

      // 같은 날짜의 기존 점검이 있으면 덮어쓸지 한 번만 확인 (취소 시 기존 데이터 유지, 새 점검만 반영)
      const conflictCount = groupKeys.filter(key => findExisting(groups[key]).length > 0).length;
      const overwriteExisting = conflictCount > 0 && confirm(I18N.t('dmOverwriteConfirm', String(conflictCount)));

      let imported = 0;
      let skipped = 0;
      let overwritten = 0;
      let photosApplied = 0;
      let resultsImported = 0;
      let unmatchedItems = 0;
      const unmatchedProcesses = new Set();

      for (const key of groupKeys) {
        const group = groups[key];

        // DB에 해당 공정이 있는지 확인 (기존 데이터를 지우기 전에 먼저 확인)
        if (!checklistLookup[group.process]) {
          unmatchedProcesses.add(group.process);
          continue;
        }

        const matches = findExisting(group);
        if (matches.length > 0) {
          if (!overwriteExisting) {
            skipped++;
            continue;
          }
          // 기존 점검과 그 결과를 지우고 최신 정보로 다시 저장
          for (const m of matches) {
            await DB.deleteInspectionWithResults(m.id);
          }
          overwritten++;
        }

        // 점검(inspection) 생성
        const inspectionId = await DB.createInspection({
          partnerName: group.partner,
          factoryName: group.factory,
          lineName: group.line,
          inspector: group.inspector,
          date: group.date,
          processName: group.process,
          inspectionType: group.inspectionType,
          totalCount: group.items.length,
          passCount: 0,
          failCount: 0,
          naCount: 0,
          holdCount: 0,
        });

        // 점검 결과(inspectionResults) 생성
        let passCount = 0;
        let failCount = 0;
        let naCount = 0;
        let holdCount = 0;
        let matchedCount = 0;

        for (const row of group.items) {
          const item = checklistLookup[group.process][row.no];
          if (!item) {
            unmatchedItems++;
            continue;
          }
          await DB.insertInspectionResult({
            inspectionId: inspectionId,
            checklistItemId: item.id,
            // 모바일 저장과 동일한 안정 매칭 키 (항목 id가 바뀌어도 대시보드에서 항목을 찾도록)
            processName: group.process,
            itemNo: String(item.no || ''),
            status: row.result,
            photoUri: (row.photos && row.photos.length > 0) ? row.photos.join('||') : '',
            remark: row.remark,
          });
          matchedCount++;
          resultsImported++;
          photosApplied += (row.photos || []).length;
          if (row.result === 'pass') passCount++;
          else if (row.result === 'fail') failCount++;
          else if (row.result === 'na') naCount++;
          else if (row.result === 'hold') holdCount++;
        }

        // 점검 카운트 업데이트 (합격률 = 합격 ÷ (전체 − 해당없음) 계산용 naCount/holdCount 포함)
        await DB.updateInspectionCounts(inspectionId, matchedCount, passCount, failCount, naCount, holdCount);
        imported++;
      }

      // Electron 환경에서 파일에 자동 백업
      try { await DB.backupToFile(); } catch (e) { console.error('Auto backup error:', e); }

      // DB 새로고침
      allInspections = await DB.getAllInspections() || [];

      lastImportResult = {
        imported: imported,
        skipped: skipped,
        overwritten: overwritten,
        photosApplied: photosApplied,
        resultsImported: resultsImported,
        unmatchedItems: unmatchedItems,
        unmatchedProcesses: Array.from(unmatchedProcesses),
      };

      isImporting = false;
      render();

      // 결과 요약
      let msg = I18N.t('dmApplyDone') + '\n\n';
      msg += I18N.t('dmNewResults', String(imported)) + '\n';
      if (skipped > 0) msg += I18N.t('dmSkippedCount', String(skipped)) + '\n';
      if (overwritten > 0) msg += I18N.t('dmOverwrittenCount', String(overwritten)) + '\n';
      msg += I18N.t('dmPhotosApplied', String(photosApplied)) + '\n';
      msg += I18N.t('dmItemsApplied', String(resultsImported)) + '\n';
      if (unmatchedItems > 0) msg += I18N.t('dmUnmatchedItems', String(unmatchedItems)) + '\n';
      if (unmatchedProcesses.size > 0) msg += I18N.t('dmUnmatchedProc') + Array.from(unmatchedProcesses).join(', ') + '\n';
      alert(msg);
    } catch (err) {
      console.error('Import to DB error:', err);
      isImporting = false;
      render();
      alert(I18N.t('dbApplyError') + err.message);
    }
  };

  // --- 통합 리포트 추출 (기존 기능 유지) ---
  window.processMerge = async function() {
    if (importedFiles.length === 0) return;

    if (typeof XLSX === 'undefined') {
      try { await window.ensurePBAXLSX(); } catch (e) { alert(I18N.t('xlsxNotLoaded')); return; }
    }

    // 1. 업로드된 파일 데이터 수집
    const allData = [];
    // 같은 날짜·점검자·항목은 1건만 (재점검 기록이 함께 추출된 파일 대응, 먼저 나온 행 유지)
    const seenRows = new Set();

    for (const file of importedFiles) {
      if (!file.parsedRows) continue;
      for (const row of file.parsedRows) {
        const rowKey = [row.process, row.line, row.date, row.inspector, row.partner, row.no].join('|');
        if (seenRows.has(rowKey)) continue;
        seenRows.add(rowKey);
        allData.push({
          process: row.process,
          line: row.line ? 'Line ' + row.line : '',
          date: row.date,
          inspector: row.inspector,
          partner: row.partner,
          factory: row.factory,
          category: row.category,
          no: row.no,
          grade: row.grade,
          checkItem: row.checkItem,
          checkMethod: row.checkMethod,
          cycle: row.cycle,
          result: row.resultText,
          remark: row.remark,
          source: file.fileName,
          photos: row.photos || [],
        });
      }
    }

    // 2. DB 점검 결과도 병합
    const procList = await DB.getAllProcesses() || [];
    for (const insp of DB.latestInspectionPerDay(allInspections)) {
      const results = await DB.getInspectionResults(insp.id);
      const process = procList.find(p => p.name === insp.processName);
      let checklistItems = [];
      if (process) {
        checklistItems = await DB.getChecklistItems(process.id);
      }

      const resultMap = {};
      results.forEach(r => { resultMap[r.checklistItemId] = r; });

      for (const item of checklistItems) {
        const result = resultMap[item.id];
        const statusText = result ? (
          result.status === 'pass' ? I18N.t('statusPass') :
          result.status === 'fail' ? I18N.t('statusFail') :
          result.status === 'hold' ? I18N.t('statusHold') : I18N.t('notInspected')
        ) : I18N.t('notInspected');

        allData.push({
          process: insp.processName || '',
          line: 'Line ' + (insp.lineName || ''),
          date: insp.date || '',
          inspector: insp.inspector || '',
          partner: insp.partnerName || '',
          factory: insp.factoryName || '',
          category: item.category || '',
          no: item.no || '',
          grade: item.grade || '',
          checkItem: item.checkItem || '',
          checkMethod: item.checkMethod || '',
          cycle: item.cycle || '',
          result: statusText,
          remark: result ? (result.remark || '') : '',
          source: 'DB',
          photos: (result && result.photoUri) ? result.photoUri.split('||').filter(Boolean) : [],
        });
      }
    }

    if (allData.length === 0) {
      alert(I18N.t('noMergeData'));
      return;
    }

    // 통합 워크북 생성
    const wb = XLSX.utils.book_new();

    // 공정별로 그룹화
    const byProcess = {};
    allData.forEach(d => {
      const key = d.process || 'Unknown';
      if (!byProcess[key]) byProcess[key] = [];
      byProcess[key].push(d);
    });

    // 사진이 포함된 데이터가 있으면 exceljs로 사진 임베드 통합 리포트 생성
    const hasPhotos = allData.some(d => d.photos && d.photos.length > 0);
    if (hasPhotos) {
      try {
        await ensureExcelJS();
        const ewb = new ExcelJS.Workbook();
        const MAX_PHOTO_SIZE = 110;
        const colWidths = [12, 8, 12, 10, 12, 10, 12, 5, 6, 40, 50, 8, 10, 20, 15, 22, 22, 22];
        const header = [
          I18N.t('processLabel'), 'Line', I18N.t('dateLabel'), I18N.t('inspector'), I18N.t('partner'), I18N.t('factory'),
          I18N.t('lblCategory'), 'No', 'Grade', 'Check Item', 'Check Methods', I18N.t('lblCycle'),
          I18N.t('excelFileName'), I18N.t('remark'), I18N.t('sourceCol'), I18N.t('attachedPhotos').trim()
        ];
        const mergeFilename = I18N.t('mergedFilePrefix') + new Date().toISOString().split('T')[0] + '.xlsx';

        for (const procName of Object.keys(byProcess)) {
          const eWs = ewb.addWorksheet(procName.substring(0, 31));
          colWidths.forEach((w, idx) => { eWs.getColumn(idx + 1).width = w; });
          header.forEach((v, idx) => { eWs.getRow(1).getCell(idx + 1).value = v; });
          eWs.getRow(1).font = { bold: true };
          eWs.getRow(1).alignment = { vertical: 'middle' };

          let rowNo = 1;
          for (const d of byProcess[procName]) {
            rowNo++;
            const row = eWs.getRow(rowNo);
            [d.process, d.line, d.date, d.inspector, d.partner, d.factory,
             d.category, d.no, d.grade, d.checkItem, d.checkMethod, d.cycle,
             d.result, d.remark, d.source].forEach((v, idx) => { row.getCell(idx + 1).value = v; });

            const photos = d.photos || [];
            if (photos.length === 0) continue;
            let photoCol = 16; // P열부터 시작, 항목당 최대 3장 가로 배치
            for (const uri of photos) {
              if (photoCol > 18) break; // 최대 3장 (P~R열)
              const m = /^data:image\/([a-zA-Z0-9+.-]+);base64,(.+)$/.exec(uri);
              if (!m) continue;
              let ext = m[1].toLowerCase();
              if (ext === 'jpg') ext = 'jpeg';
              if (ext !== 'jpeg' && ext !== 'png' && ext !== 'gif') continue;
              // 비율 유지 (최대 변 110px)
              let width = MAX_PHOTO_SIZE, height = MAX_PHOTO_SIZE;
              const dim = await getImageSize(uri);
              if (dim && dim.w > 0 && dim.h > 0) {
                const scale = MAX_PHOTO_SIZE / Math.max(dim.w, dim.h);
                width = Math.max(1, Math.round(dim.w * scale));
                height = Math.max(1, Math.round(dim.h * scale));
              }
              try {
                const imageId = ewb.addImage({ base64: m[2], extension: ext });
                eWs.addImage(imageId, {
                  tl: { col: photoCol - 1, row: rowNo - 1 }, // 0-based 좌표
                  ext: { width: width, height: height }
                });
                photoCol++;
              } catch (err) {
                console.warn('[Merge] 사진 삽입 실패:', err);
              }
            }
            row.height = 85; // 사진 표시 공간 확보 (110px ≈ 83pt)
          }
          eWs.views = [{ state: 'frozen', ySplit: 1 }];
        }

        const buf = await ewb.xlsx.writeBuffer();
        ExcelParser.downloadXlsxBuffer(buf, mergeFilename);
        alert(I18N.t('mergeReportDone', String(allData.length), String(Object.keys(byProcess).length)));
        return;
      } catch (err) {
        // 사진 포함 리포트 생성 실패 시 아래 데이터만 생성 경로로 폴백
        console.error('[Merge] 사진 포함 통합 리포트 생성 실패, 데이터만 생성:', err);
      }
    }

    for (const procName of Object.keys(byProcess)) {
      const sheetData = [];
      sheetData.push([
        I18N.t('processLabel'), 'Line', I18N.t('dateLabel'), I18N.t('inspector'), I18N.t('partner'), I18N.t('factory'),
        I18N.t('lblCategory'), 'No', 'Grade', 'Check Item', 'Check Methods', I18N.t('lblCycle'),
        I18N.t('excelFileName'), I18N.t('remark'), I18N.t('sourceCol')
      ]);

      byProcess[procName].forEach(d => {
        sheetData.push([
          d.process, d.line, d.date, d.inspector, d.partner, d.factory,
          d.category, d.no, d.grade, d.checkItem, d.checkMethod, d.cycle,
          d.result, d.remark, d.source
        ]);
      });

      const ws = XLSX.utils.aoa_to_sheet(sheetData);
      ws['!cols'] = [
        {wch: 12}, {wch: 8}, {wch: 12}, {wch: 10}, {wch: 12}, {wch: 10},
        {wch: 12}, {wch: 5}, {wch: 6}, {wch: 40}, {wch: 50}, {wch: 8},
        {wch: 10}, {wch: 20}, {wch: 15}
      ];

      let sheetName = procName.substring(0, 31);
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
    }

    const today = new Date().toISOString().split('T')[0];
    const filename = I18N.t('mergedFilePrefix') + today + '.xlsx';
    ExcelParser.downloadWorkbook(wb, filename);

    alert(I18N.t('mergeReportDone', String(allData.length), String(Object.keys(byProcess).length)));
  };

  // --- 파일 관리 ---
  window.removeFile = function(i) {
    importedFiles.splice(i, 1);
    render();
  };

  window.clearFiles = function() {
    importedFiles = [];
    lastImportResult = null;
    render();
  };

  render();
};

// ===== js/screens/line-mapping.js =====
// ===== Line-Process Mapping Screen =====
Screens.lineMapping = async function(container, params) {
  const lines = await DB.getAllLines();
  const processes = await DB.getAllProcesses();

  if (lines.length === 0) {
    container.innerHTML = `<div class="empty-state">${I18N.t('noLines')}</div>`;
    return;
  }

  if (processes.length === 0) {
    container.innerHTML = `<div class="empty-state">${I18N.t('noProcessesMapped')}</div>`;
    return;
  }

  let selectedLineId = lines[0].id;
  // 화면 진입 후 첫 ON/OFF 변경 시 1회만 비밀번호 확인 (화면을 나가면 다시 묻습니다)
  let adminUnlocked = false;

  async function renderMappings() {
    const mappings = await DB.getLineProcessMappings(selectedLineId);
    const line = lines.find(l => l.id === selectedLineId);

    let html = `
      <div class="section">
        <div class="section-title">${I18N.t('selectLine')}</div>
        <div class="line-container">
          ${lines.map(l => `<button class="line-btn ${l.id === selectedLineId ? 'active' : ''}" data-line-id="${l.id}">Line ${l.name}</button>`).join('')}
        </div>
      </div>

      <div class="section">
        <div class="section-title">${I18N.t('activateOnLine', I18N.t('processLabel'), line ? line.name : '')}</div>
        ${processes.map(p => {
          const mapping = mappings.find(m => m.processId === p.id);
          const isActive = mapping ? mapping.isActive : false;
          return `
            <div class="toggle-row">
              <div class="toggle-info">
                <div class="toggle-name">${p.displayName}</div>
                <div class="toggle-count">${I18N.t('processCount')}: ${p.itemCount}${I18N.t('unitItems')}</div>
              </div>
              <div class="toggle-safe-zone">
                <button class="toggle-switch ${isActive ? 'active' : ''}" data-mapping-id="${mapping ? mapping.id : ''}" data-process-id="${p.id}" data-is-active="${isActive}">
                  <div class="toggle-knob"></div>
                </button>
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <div style="padding:15px;">
        <button class="btn-primary" onclick="App.navigate('admin')">${I18N.t('done')}</button>
      </div>
    `;

    container.innerHTML = html;

    // Line selection
    container.querySelectorAll('[data-line-id]').forEach(btn => {
      btn.addEventListener('click', async () => {
        selectedLineId = parseInt(btn.dataset.lineId);
        // Ensure mappings exist for this line
        await DB.createLineProcessMappings(selectedLineId, processes.map(p => p.id));
        renderMappings();
      });
    });

    // ON/OFF 적용 로직
    const applyToggle = async (btn) => {
        const mappingId = parseInt(btn.dataset.mappingId);
        const processId = parseInt(btn.dataset.processId);
        const wasActive = btn.dataset.isActive === 'true';

        if (mappingId) {
          // Update existing mapping
          await DB.updateLineProcessMapping(mappingId, !wasActive);
        } else {
          // Create new mapping (shouldn't happen if line was selected first, but just in case)
          await DB.createLineProcessMappings(selectedLineId, [processId]);
          const mappings = await DB.getLineProcessMappings(selectedLineId);
          const newMapping = mappings.find(m => m.processId === processId);
          if (newMapping) {
            await DB.updateLineProcessMapping(newMapping.id, !wasActive);
          }
        }
        renderMappings();
    };

    // Toggle switches: 인증 전이면 비밀번호 확인 후 적용, 인증 후에는 바로 적용
    container.querySelectorAll('.toggle-switch').forEach(btn => {
      btn.addEventListener('click', () => {
        if (adminUnlocked) { applyToggle(btn); return; }
        checkAdminPassword(() => { adminUnlocked = true; applyToggle(btn); });
      });
    });
  }

  // Ensure mappings exist for the first line
  await DB.createLineProcessMappings(selectedLineId, processes.map(p => p.id));
  renderMappings();
};
