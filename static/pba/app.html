    localFileModeDesc: { ko: '파일을 직접 실행하면 일부 기능(데이터 저장, 엑셀 추출 등)이 제한될 수 있습니다.<br>', en: 'Running the file directly may limit some features (data saving, Excel export, etc.).<br>', zh: '直接运行文件时部分功能（数据保存、导出Excel等）可能受限。<br>', th: 'การรันไฟล์โดยตรงอาจจำกัดบางฟีเจอร์ (บันทึกข้อมูล ส่งออก Excel ฯลฯ)<br>', es: 'Ejecutar el archivo directamente puede limitar algunas funciones (guardado, exportación a Excel, etc.).<br>', vi: 'Chạy tệp trực tiếp có thể hạn chế một số tính năng (lưu dữ liệu, xuất Excel...).<br>' },
    serverModeRecommended: { ko: '모바일에서 안정적인 사용을 위해 서버 모드를 권장합니다.', en: 'Server mode is recommended for stable use on mobile.', zh: '为在移动端稳定使用，建议使用服务器模式。', th: 'แนะนำโหมดเซิร์ฟเวอร์เพื่อการใช้งานบนมือถือที่เสถียร', es: 'Se recomienda el modo servidor para un uso estable en móvil.', vi: 'Khuyến nghị dùng chế độ máy chủ để ổn định trên di động.' },
    fsPluginError: { ko: 'Filesystem 플러그인을 사용할 수 없습니다.', en: 'Filesystem plugin is unavailable.', zh: '无法使用Filesystem插件。', th: 'ใช้ปลั๊กอิน Filesystem ไม่ได้', es: 'El plugin Filesystem no está disponible.', vi: 'Không dùng được plugin Filesystem.' },
    fileExplorerPath: { ko: '(파일 탐색기 → 내 파일 → Android/data/com.pba.checklist/files)\n\n', en: '(File explorer → My files → Android/data/com.pba.checklist/files)\n\n', zh: '（文件管理器 → 我的文件 → Android/data/com.pba.checklist/files）\n\n', th: '(ตัวจัดการไฟล์ → ไฟล์ของฉัน → Android/data/com.pba.checklist/files)\n\n', es: '(Explorador de archivos → Mis archivos → Android/data/com.pba.checklist/files)\n\n', vi: '(Quản lý tệp → Tệp của tôi → Android/data/com.pba.checklist/files)\n\n' },
  },

  // 번역 조회 (없으면 한국어 → key 순으로 폴백)
  t(key) {
    const args = Array.prototype.slice.call(arguments, 1);
    const entry = this.dict[key];
    if (!entry) return key;
    let text = entry[this.current] || entry.en || entry.ko || key; // UI 미번역 언어(pl 등) → 영문 폴백
    // {0}, {1} 플레이스홀더 치환
    args.forEach((v, i) => { text = text.split('{' + i + '}').join(String(v)); });
    return text;
  },

  // localStorage에서 언어 복원 (동기, 빠름)
  init() {
    try {
      const saved = localStorage.getItem('appLanguage');
      if (saved && this.langs.some(l => l.code === saved)) {
        this.current = saved;
      }
    } catch (e) { /* Private Browsing 등 */ }
    return this.current;
  },

  // DB 설정에서 언어 동기화 (localStorage 없는 환경 대비)
  async syncFromDB() {
    try {
      if (typeof DB === 'undefined') return;
      const settings = await DB.getSettings();
      if (settings && settings.language && this.langs.some(l => l.code === settings.language)) {
        this.current = settings.language;
      }
    } catch (e) { /* 무시 */ }
  },

  // 현재 언어의 체크리스트 데이터 등록 여부
  hasChecklistData(lang) {
    lang = lang || this.current;
    if (lang === 'ko') return true;
    if (typeof ChecklistDataI18N === 'undefined') return false;
    const data = ChecklistDataI18N[lang];
    return !!(data && data.processes && data.processes.length > 0);
  },

  // 해당 언어의 체크리스트 데이터 완결성 검사 (한국어 마스터 항목 수와 비교)
  // - en/zh는 397개 항목 완성, th/es/vi는 77개(주간 일부)만 번역됨
  isChecklistComplete(lang) {
    if (lang === 'ko') return true;
    if (typeof ChecklistDataI18N === 'undefined' || typeof ChecklistData === 'undefined') return false;
    const data = ChecklistDataI18N[lang];
    if (!data || !data.processes || data.processes.length === 0) return false;
    let masterCount = 0, langCount = 0;
    for (const p of ChecklistData.processes) {
      masterCount += ((ChecklistData.items || {})[p.name] || []).length;
    }
    for (const p of data.processes) {
      langCount += ((data.items || {})[p.name] || []).length;
    }
    return masterCount > 0 && langCount >= masterCount;
  },

  // 부분 번역 언어 판정 (데이터가 등록됐으나 미완성: pl/th/es/vi - 주간 77개만 번역)
  isChecklistPartial(lang) {
    if (lang === 'ko' || !lang) return false;
    if (typeof ChecklistDataI18N === 'undefined' || typeof ChecklistData === 'undefined') return false;
    const data = ChecklistDataI18N[lang];
    if (!data || !data.processes || data.processes.length === 0) return false;
    if (this.isChecklistComplete(lang)) return false;
    let langCount = 0;
    for (const p of data.processes) langCount += ((data.items || {})[p.name] || []).length;
    return langCount > 0;
  },

  // 부분 번역 언어용 병합 데이터 생성
  // - 주간(Weekly) 항목: 해당 언어 번역 사용 ((공정, no) 기준 매칭)
  // - 정기점검(월간/분기) 항목: 번역본 미운영 → 영어 사용
  buildPartialChecklistData(lang) {
    const en = ChecklistDataI18N.en;
    const src = ChecklistDataI18N[lang];
    if (!en || !src) return src;
    const infer = (cycle) => {
      try { return ChecklistData._inferInspectionType(cycle); } catch (e) { return /week|daily|주|일/i.test(cycle || '') ? 'daily' : 'monthly'; }
    };
    const items = {};
    for (const procName of Object.keys(en.items || {})) {
      const srcByNo = {};
      ((src.items || {})[procName] || []).forEach(it => { srcByNo[String(it.no).trim()] = it; });
      items[procName] = (en.items[procName] || []).map(enIt => {
        if (infer(enIt.cycle) === 'daily') {
          const cand = srcByNo[String(enIt.no).trim()];
          if (cand && infer(cand.cycle) === 'daily') return cand; // 주간: 해당 언어 번역
        }
        return enIt; // 정기점검(월간): 영어
      });
    }
    return {
      processes: en.processes,
      items: items,
      DATA_VERSION: 'mix_' + lang + '_' + (src.DATA_VERSION || '') + '_' + (en.DATA_VERSION || ''),
    };
  },

  // 언어에 맞는 체크리스트 데이터 결정
  // - 완성된 언어(ko/en/zh) → 해당 언어
  // - 부분 번역 언어(pl/th/es/vi) → 해당 언어(주간) + 영어(정기점검)
  // - 데이터가 전혀 없는 언어 → 영어 fallback (완성된 영문이 안전)
  resolveChecklistLang(lang) {
    if (lang === 'ko' || !lang) return { lang: 'ko' };
    if (this.isChecklistComplete(lang)) return { lang: lang };
    if (this.isChecklistPartial(lang)) return { lang: lang, partial: true };
    if (lang !== 'en' && this.isChecklistComplete('en')) return { lang: 'en', fallback: true };
    return { lang: null };
  },

  // 언어 변경 (저장 + 현재 화면 재렌더링)
  // - localStorage: 빠른 복원용
  // - DB settings: 서버/다른 기기 동기화용
  async setLang(lang, opts = {}) {
    if (!this.langs.some(l => l.code === lang)) return false;
    try { await window.ensureChecklistLang(lang); }
    catch (e) { console.warn('[I18N] checklist lang load failed:', e.message); }
    const prev = this.current;
    this.current = lang;
    try { localStorage.setItem('appLanguage', lang); } catch (e) { /* 무시 */ }
    try {
      if (typeof DB !== 'undefined') await DB.updateSettingsField('language', lang);
    } catch (e) { console.warn('[I18N] DB language save failed:', e.message); }

    // 체크리스트 데이터 전환 (한국어 복귀 시 마스터 데이터 재적용 포함)
    // - 이전: 비한국어만 적용 → 한국어 복귀 시 이전 언어 데이터가 DB에 남는 버그
    if (!opts.skipChecklist) {
      this._lastApplyResult = await this.applyChecklistLang(lang);
    } else {
      this._lastApplyResult = null;
    }
    return prev !== lang;
  },

  // 현재 언어에 맞는 체크리스트 데이터를 DB에 적용
  // - ChecklistDataI18N[lang] 에 데이터가 등록되어 있으면 DB 재로드
  // - 미등록 언어면 한국어 데이터 유지 (안내 메시지 반환)
  // - Line-공정 매핑의 활성 토글 상태를 공정 키(name) 기준으로 보존
  async applyChecklistLang(lang) {
    lang = lang || this.current;
    if (typeof ChecklistData === 'undefined') return { skipped: true };

    // 마지막으로 DB에 적용된 체크리스트 언어 + 저장된 데이터 버전
    let appliedLang = '';
    let storedVersion = '';
    try {
      appliedLang = localStorage.getItem('checklistAppliedLang') || '';
      storedVersion = localStorage.getItem('checklistDataVersion') || '';
    } catch (e) { /* 무시 */ }

    let fallbackUsed = false;
    let langData;
    if (lang === 'ko') {
      // 한국어: 마스터(한국어) 데이터 적용
      // - 다른 언어에서 복귀 시 번역 데이터가 DB에 남아있는 문제 수정
      const koData = { processes: ChecklistData.processes, items: ChecklistData.items, DATA_VERSION: ChecklistData.DATA_VERSION };
      const alreadyKo = appliedLang === 'ko' && storedVersion === String(koData.DATA_VERSION);
      const initialKo = !appliedLang && storedVersion === String(koData.DATA_VERSION); // 신규 설치 직후(이미 한국어)
      if (alreadyKo || initialKo) return { skipped: true };
      langData = koData;
    } else {
      // 부분 번역/미완성 언어 처리
      // - 부분 번역 언어(pl/th/es/vi): 주간 = 해당 언어, 정기점검(월간) = 영어
      // - 데이터가 전혀 없는 언어: 영어로 대체
      const resolved = this.resolveChecklistLang(lang);
      if (!resolved.lang) return { skipped: true, notRegistered: true };
      fallbackUsed = !!resolved.fallback || resolved.lang !== lang;
      langData = resolved.partial ? this.buildPartialChecklistData(resolved.lang) : ChecklistDataI18N[resolved.lang];
      const resolvedVersion = String(langData.DATA_VERSION || '');
      // 동일 데이터가 이미 적용됐으면 스킵
      if (appliedLang === resolved.lang && storedVersion === resolvedVersion) {
        return { skipped: true, fallback: fallbackUsed, partial: !!resolved.partial, fallbackTo: fallbackUsed ? resolved.lang : undefined };
      }
      lang = resolved.lang; // 적용 기록은 실제 적용된 데이터 언어 기준
    }

    // 1) 토글 상태 백업: lineId + 공정 키(name) → isActive
    let savedToggles = [];
    try {
      const allProcs = await DB.getAllProcesses();
      const procNameById = {};
      allProcs.forEach(p => { procNameById[p.id] = p.name; });
      const allLines = await DB.getAllLines();
      for (const line of allLines) {
        const mappings = await DB.getLineProcessMappings(line.id);
        mappings.forEach(m => {
          const pname = procNameById[m.processId];
          if (pname) savedToggles.push({ lineId: line.id, processName: pname, isActive: m.isActive });
        });
      }
    } catch (e) {
      console.warn('[I18N] toggle backup failed:', e.message);
      savedToggles = [];
    }

    // 2) ChecklistData를 임시 교체 후 reloadToDB 재사용 (checklist-data.js 수정 없이 전환)
    const origProcesses = ChecklistData.processes;
    const origItems = ChecklistData.items;
    const origVersion = ChecklistData.DATA_VERSION;
    try {
      ChecklistData.processes = langData.processes;
      ChecklistData.items = langData.items;
      ChecklistData.DATA_VERSION = langData.DATA_VERSION || ('i18n_' + lang);
      await ChecklistData.reloadToDB();
      try {
        localStorage.setItem('checklistDataVersion', String(ChecklistData.DATA_VERSION));
        localStorage.setItem('checklistAppliedLang', lang);
      } catch (e) {}
    } catch (e) {
      console.error('[I18N] checklist lang apply failed:', e);
      return { skipped: true, error: e };
    } finally {
      ChecklistData.processes = origProcesses;
      ChecklistData.items = origItems;
      ChecklistData.DATA_VERSION = origVersion;
    }

    // 3) 토글 상태 복원 (공정 키가 동일한 매핑에만 적용)
    try {
      if (savedToggles.length > 0) {
        const newProcs = await DB.getAllProcesses();
        const nameById = {};
        newProcs.forEach(p => { nameById[p.id] = p.name; });
        const allLines = await DB.getAllLines();
        for (const line of allLines) {
          const mappings = await DB.getLineProcessMappings(line.id);
          for (const m of mappings) {
            const pname = nameById[m.processId];
            if (!pname) continue;
            const saved = savedToggles.find(t => t.lineId === line.id && t.processName === pname);
            if (saved && saved.isActive !== m.isActive) {
              await DB.updateLineProcessMapping(m.id, saved.isActive);
            }
          }
        }
        console.log('[I18N] toggles restored:', savedToggles.length);
      }
    } catch (e) {
      console.warn('[I18N] toggle restore failed:', e.message);
    }

    return { skipped: false, fallback: fallbackUsed, partial: !!langData && String(langData.DATA_VERSION || '').indexOf('mix_') === 0 };
  },
};

// ===== 언어 선택 모달 =====
window.showLanguageSelector = function() {
  // 이미 열려있으면 무시
  if (document.getElementById('langModal')) return;

  const cur = I18N.current;
  const buttons = I18N.langs.map(l => `
    <button class="lang-option" data-lang="${l.code}"
      style="display:flex;align-items:center;gap:12px;width:100%;padding:14px 18px;border:2px solid ${cur === l.code ? '#2d5793' : '#e0e0e0'};border-radius:10px;background:${cur === l.code ? '#eef3fb' : '#fff'};font-size:16px;cursor:pointer;margin-bottom:10px;transition:all 0.15s;"
      onclick="window._selectLanguage('${l.code}')">
      <span style="font-size:22px;">${l.flag}</span>
      <span style="font-weight:${cur === l.code ? 'bold' : 'normal'};color:${cur === l.code ? '#2d5793' : '#333'};">${l.native}</span>

  const modal = document.createElement('div');

  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:9999;';
  modal.innerHTML = `

      <div style="font-size:17px;font-weight:bold;color:#333;margin-bottom:4px;">${I18N.t('selectLanguage')}</div>

      ${buttons}

    </div>
  `;
  modal.addEventListener('click', (e) => { if (e.target === modal) window._closeLangModal(); });

};

window._closeLangModal = function() {
  const m = document.getElementById('langModal');
  if (m) m.remove();
};

window._selectLanguage = async function(lang) {
  const changed = await I18N.setLang(lang);
  window._closeLangModal();

  // 현재 화면 재렌더링 (언어 즉시 적용)
  if (typeof App !== 'undefined' && App.render) {
    await App.render();
  }

  // 체크리스트 데이터 상태 안내
  // - 부분 번역 언어 → 정기점검 영문 표시 안내
  // - 데이터 전혀 없음 → 영어 대체 / 미등록 안내
  if (changed && lang !== 'ko' && I18N._lastApplyResult) {
    const res = I18N._lastApplyResult;
    if (res.partial) {
      alert(I18N.t('checklistPartialEn'));
    } else if (res.fallback) {
      alert(I18N.t('checklistFallbackEn'));
    } else if (res.notRegistered) {
      alert(I18N.t('checklistNotRegistered'));
    }
  }
};

      { category: '', no: '33', grade: 'A', checkItem: '불량처리 Process는 있으며 실행하고 있는가?', checkMethod: '[점검기준] 불량 처리 Process 대로 GMES 및 수작업 입력 관리하고 있는가\n[점검방버] GMES 및 수작업 입력관리 제대로 되고 있는지 확인한다', cycle: '매월', actionMethod: '', remark: '' },
      { category: '', no: '34', grade: 'A', checkItem: '적재시 Board 겹침 등이 없는가?\n - 적대 대차 및 Box 에 겹쳐서 보관 금지', checkMethod: '[점검기준] 규격화된 PCB Ass\'y 적재 대차 사용하고 있는가\n[점검방법] PCB 적재 대착에 PCB 겹침이 있는지 세로로 세워서 보관하는지\n             확인한다', cycle: '매월', actionMethod: '', remark: '' },
    ],
  },
  // 점검 유형 추론 (cycle 필드 기반)
  _inferInspectionType(cycle) {
    const c = (cycle || '').trim();
    const cl = c.toLowerCase();
    // 한국어 주간 표기 + 영어 주간 표기 (Weekly/Daily) + 중국어 표기 (每天/每周) + 태국어 표기 (ทุกสัปดาห์) + 스페인어 표기 (Cada semana) + 베트남어 표기 (Hàng tuần)
    if (c === '매일' || c === '매주' || c === '1회/일' || c === '1회/주' || c === '일일' || c === '每天' || c === '每周' || c === 'ทุกสัปดาห์' || c === 'ทุกวัน' || c === 'Cada semana' || c === 'Cada día' || c === 'Hàng tuần' || c === 'Hàng ngày' || c === 'Co tydzień' || c === 'Co dzień' || c === 'Codziennie') return 'daily';
    if (cl === 'daily' || cl === 'weekly' || cl === '1/day' || cl === '1/week' || cl === 'once/day' || cl === 'once/week' || cl === 'cada semana' || cl === 'cada día' || cl === 'cada dia' || cl === 'hàng tuần' || cl === 'hàng ngày' || cl === 'co tydzień' || cl === 'co dnia' || cl === 'codziennie') return 'daily';
    // 중국어 월간/분기 표기 (每月/每季度) + 태국어 표기 (ทุกเดือน/ทุกไตรมาส) + 스페인어 표기 (Cada mes/Cada trimestre) + 베트남어 표기 (Hàng tháng/Hàng quý)
    if (c === '매월' || c === '매분기' || c === '每月' || c === '每季度' || c === 'ทุกเดือน' || c === 'ทุกไตรมาส' || c === 'Cada mes' || c === 'Cada trimestre' || c === 'Hàng tháng' || c === 'Hàng quý') return 'monthly';
    return 'monthly';
  },

  // 기존 체크리스트 항목에 inspectionType 마이그레이션
  async _migrateInspectionType() {
    let allItems;
    try {
      allItems = await DB.getAllChecklistItems();
    } catch (e) {
      console.warn('[ChecklistData] getAllChecklistItems 실패, 마이그레이션 건너뜀:', e.message);
      return;
    }
    if (!allItems || allItems.length === 0) return;
    const needsMigration = allItems.some(i => !i.inspectionType);
    if (!needsMigration) return;

    console.log('[ChecklistData] 체크리스트 항목 마이그레이션: inspectionType 추가 중...');
    const store = DB._tx('checklistItems', 'readwrite');
    for (const item of allItems) {
      if (!item.inspectionType) {
        item.inspectionType = this._inferInspectionType(item.cycle);
        await DB._request(store.put(item));
      }
    }
    console.log('[ChecklistData] 마이그레이션 완료');
  },
  // 서버 모드: 체크리스트를 한 번에 업서트 (개별 POST 반복 방지)
  async _loadToServer() {
    // 服务器已是最新版本则跳过整包上传
    try {
      const v = await DB._api('GET', '/api/checklist-version');
      if (v && Number(v.version) === Number(this.DATA_VERSION)) {
        console.log('[ChecklistData] 서버 버전 동일 (' + v.version + ') - 건너뜀');
        return { processCount: 0, itemCount: 0, skipped: true };
      }
    } catch (e) {}
    const chunkSize = 4;
    let src = this;
    try {
      const lang = (typeof I18N !== 'undefined') ? I18N.current : 'ko';
      if (lang && lang !== 'ko' && typeof ChecklistDataI18N !== 'undefined'
          && ChecklistDataI18N[lang] && ChecklistDataI18N[lang].processes
          && ChecklistDataI18N[lang].processes.length) {
        src = ChecklistDataI18N[lang];
      }
    } catch (e) {}
    for (let i = 0; i < src.processes.length; i += chunkSize) {
      const chunk = src.processes.slice(i, i + chunkSize);
      const payload = {
        processes: chunk.map((proc) => ({
          name: proc.name,
          displayName: proc.displayName,
          items: (src.items[proc.name] || []).map((item) => ({
            category: item.category, no: item.no, grade: item.grade,
            checkItem: item.checkItem, checkMethod: item.checkMethod,
            cycle: item.cycle, actionMethod: item.actionMethod,
            remark: item.remark || '',
            inspectionType: this._inferInspectionType(item.cycle),
          })),
        })),
      };
      await DB._api('POST', '/api/bulk', Object.assign({ version: this.DATA_VERSION }, payload));
    }
    try { localStorage.setItem('checklistDataVersion', String(this.DATA_VERSION)); } catch (e) {}
    const total = src.processes.reduce((n, p) => n + (src.items[p.name] || []).length, 0);
    console.log('[ChecklistData] 서버 모드 일괄 로드: ' + src.processes.length + '개 공정, ' + total + '개 항목 (lang=' + (src === this ? 'ko' : 'i18n') + ')');
    return { processCount: this.processes.length, itemCount: total, server: true };
  },

  // DB에 초기 데이터 로드
  async loadToDB() {
    if (DB._isServerMode) return await this._loadToServer();
    // 기존 데이터 확인
    const existing = await DB.getAllProcesses();
    if (existing.length > 0) {
      // 데이터 버전 확인 - 버전이 다르면 강제 재로드
      let storedVersion = 0;
      try { storedVersion = parseInt(localStorage.getItem('checklistDataVersion') || '0', 10); } catch(e) {}
      if (storedVersion !== this.DATA_VERSION) {
        console.log('[ChecklistData] 데이터 버전 불일치 (저장됨: ' + storedVersion + ', 현재: ' + this.DATA_VERSION + ') - 강제 재로드');
        const result = await this.reloadToDB();
        try { localStorage.setItem('checklistDataVersion', String(this.DATA_VERSION)); } catch(e) {}
        return result;
      }
      // 기존 항목에 inspectionType 마이그레이션
      await this._migrateInspectionType();
      return { processCount: existing.length, itemCount: 0, skipped: true };
    }

    let totalItems = 0;
    for (const proc of this.processes) {
      const items = this.items[proc.name] || [];
      const processId = await DB.insertProcess(proc.name, proc.displayName, items.length);
      for (const item of items) {
        await DB.insertChecklistItem({
          processId,
          category: item.category,
          no: item.no,
          grade: item.grade,
          checkItem: item.checkItem,
          checkMethod: item.checkMethod,
          cycle: item.cycle,
          actionMethod: item.actionMethod,
          remark: item.remark || '',
          inspectionType: this._inferInspectionType(item.cycle),
        });
        totalItems++;
      }
    }
    // 신규 설치 시에도 데이터 버전 저장 (두 번째 실행에서 불필요한 reloadToDB 방지)
    try { localStorage.setItem('checklistDataVersion', String(this.DATA_VERSION)); } catch(e) {}
    console.log('[ChecklistData] 신규 설치: ' + this.processes.length + '개 공정, ' + totalItems + '개 항목 로드됨');
    return { processCount: this.processes.length, itemCount: totalItems, skipped: false };
  },

  // DB 초기화 후 재로드 (강제 로드)
  async reloadToDB() {
    if (DB._isServerMode) return await this._loadToServer();
    await DB.deleteAllProcesses();

    // 안전한 순차 삽입 방식 사용 (db 직접 접근 대신 DB 헬퍼 메서드 사용)
    // - IndexedDB 실패 시 메모리 폴백 모드에서도 동작
    // - db 변수가 null인 경우에도 안전하게 동작
    let totalItems = 0;
    for (const proc of this.processes) {
      const items = this.items[proc.name] || [];
      const processId = await DB.insertProcess(proc.name, proc.displayName, items.length);
      for (const item of items) {
        await DB.insertChecklistItem({
          processId,
          category: item.category,
          no: item.no,
          grade: item.grade,
          checkItem: item.checkItem,
          checkMethod: item.checkMethod,
          cycle: item.cycle,
          actionMethod: item.actionMethod,
          remark: item.remark || '',
          inspectionType: this._inferInspectionType(item.cycle),
        });
        totalItems++;
      }
    }

    // 모든 Line에 대해 모든 공정을 활성화 매핑 생성
    try {
      const lines = await DB.getAllLines();
      const processes = await DB.getAllProcesses();
      const allProcessIds = processes.map(p => p.id);
      for (const line of lines) {
        await DB.createLineProcessMappings(line.id, allProcessIds);
      }
    } catch (e) {
      console.warn('[ChecklistData] Line-Process 매핑 생성 중 오류 (무시됨):', e.message);
    }

    // 데이터 버전 저장
    try { localStorage.setItem('checklistDataVersion', String(this.DATA_VERSION)); } catch(e) {}
    console.log('[ChecklistData] 재로드 완료: ' + this.processes.length + '개 공정, ' + totalItems + '개 항목');
    return { processCount: this.processes.length, itemCount: totalItems, skipped: false };
  },

  // 주간점검 항목만 DB에서 삭제 후 하드코딩된 주간 데이터로 재로드
  async reloadDailyToDB() {
    await DB.deleteChecklistItemsByType('daily');

    // 기존 프로세스 목록 조회 (이미 존재함)
    const processes = await DB.getAllProcesses();
    const procMap = {};
    for (const p of processes) {
      procMap[p.name] = p.id;
    }

    let totalItems = 0;
    for (const proc of this.processes) {
      const allItems = this.items[proc.name] || [];
      const dailyItems = allItems.filter(item => this._inferInspectionType(item.cycle) === 'daily');
      const processId = procMap[proc.name];
      if (!processId) continue;

      for (const item of dailyItems) {
        await DB.insertChecklistItem({
          processId,
          category: item.category,
          no: item.no,
          grade: item.grade,
          checkItem: item.checkItem,
          checkMethod: item.checkMethod,
          cycle: item.cycle,
          actionMethod: item.actionMethod,
          remark: item.remark || '',
          inspectionType: 'daily',
        });
        totalItems++;
      }

      // 프로세스별 item count 업데이트 (주간 + 월간)
      const currentItems = await DB.getChecklistItems(processId);
      await DB.updateProcessItemCount(processId, currentItems.length);
    }

    // 데이터 버전 저장
    try { localStorage.setItem('checklistDataVersion', String(this.DATA_VERSION)); } catch(e) {}
    return { processCount: processes.length, itemCount: totalItems, skipped: false };
  },
};

// ===== js/excel-parser.js =====
// ===== Excel Parser (SheetJS) + Text Paste Parser =====
const ExcelParser = {

  // ===== 텍스트 붙여넣기 파싱 (DRM 우회 방식) =====
  // 엑셀에서 복사한 텍스트를 파싱하여 공정별 체크리스트 데이터로 변환
  // 형식:
  //   === SPrinter ===
  //   대분류	순번	등급	점검항목	점검방법	주기	조치방법	비고
  //   M/M	1	A	자동검사기를...	[점검기준]...	매일	영림 :	비고내용
  //   ...
  //   === Vision ===
  //   ...
  parseText(text) {
    const sheets = [];
    
    // 텍스트를 줄 단위로 분할
    const allLines = text.split(/\r?\n/);
    
    let currentSheet = null;
    let currentRows = [];
    let headerFound = false;
    let columnCount = 0;
    
    // Sheet 구분자 패턴: === Sheet명 === 또는 [Sheet명] 형식
    const sheetSeparatorPattern = /^={2,}\s*(.+?)\s*={2,}$/;
    const sheetBracketPattern = /^\[(.+?)\]$/;
    
    function flushSheet() {
      if (currentSheet && currentRows.length > 0) {
        sheets.push({
          sheetName: currentSheet,
          displayName: currentSheet,
          rows: currentRows,
        });
      }
      currentSheet = null;
      currentRows = [];
      headerFound = false;
      columnCount = 0;
    }
    
    for (let i = 0; i < allLines.length; i++) {
      const line = allLines[i];
      const trimmed = line.trim();
      
      // 빈 행 건너뛰기
      if (!trimmed) continue;
      
      // Sheet 구분자 확인
      let sheetMatch = trimmed.match(sheetSeparatorPattern);
      if (!sheetMatch) sheetMatch = trimmed.match(sheetBracketPattern);
      
      if (sheetMatch) {
        // 이전 Sheet 저장
        flushSheet();
        currentSheet = sheetMatch[1].trim();
        continue;
      }
      
      // Sheet가 지정되지 않은 경우, 첫 데이터를 기본 Sheet로 처리
      if (!currentSheet) {
        currentSheet = I18N.t('defaultSuffix');
      }
      
      // 탭으로 분할 (엑셀에서 복사하면 탭으로 구분됨)
      // 쉼표도 백업 구분자로 사용
      let cells;
      if (line.includes('\t')) {
        cells = line.split('\t');
      } else if (line.includes(',')) {
        cells = line.split(',');
      } else {
        // 단일 셀
        cells = [line];
      }
      
      // 앞뒤 공백 제거
      cells = cells.map(c => c.trim());
      
      // 빈 행 체크 (모든 셀이 비어있으면 건너뛰기)
      const nonEmptyCount = cells.filter(c => c.length > 0).length;
      if (nonEmptyCount === 0) continue;
      
      // 헤더 행 감지 (첫 번째 데이터 행)
      if (!headerFound) {
        // 헤더 키워드 확인
        const headerText = cells.join(' ').toLowerCase();
        if (
          headerText.includes('대분류') || headerText.includes('category') ||
          headerText.includes('순번') || headerText.includes('no') ||
          headerText.includes('등급') || headerText.includes('grade') ||
          headerText.includes('점검항목') || headerText.includes('check') ||
          headerText.includes('점검방법') || headerText.includes('주기') ||
          headerText.includes('조치') || headerText.includes('비고')
        ) {
          headerFound = true;
          columnCount = cells.length;
          continue;
        }
        // 헤더가 없어도 첫 행을 데이터로 처리
        headerFound = true;
        columnCount = cells.length;
      }
      
      // 데이터 행 파싱
      // 열 구조: category, no, grade, checkItem, checkMethod, cycle, actionMethod, remark
      const row = {
        category: cells[0] || '',
        no: cells[1] || '',
        grade: cells[2] || '',
        checkItem: cells[3] || '',
        checkMethod: cells[4] || '',
        cycle: cells[5] || '',
        actionMethod: cells[6] || '',
        remark: cells[7] || '',
      };
      
      // 최소한 checkItem이나 category가 있어야 유효한 행
      if (row.checkItem || row.category) {
        currentRows.push(row);
      }
    }
    
    // 마지막 Sheet 저장
    flushSheet();
    
    return sheets;
  },

  async parseFile(file) {
    if (typeof XLSX === 'undefined') { await window.ensurePBAXLSX(); }

    console.log('File name:', file.name);
    console.log('File size:', file.size);
    console.log('File type:', file.type);

    // Read as ArrayBuffer
    const ab = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.onerror = (e) => reject(new Error(I18N.t('fileReadFail')));
      reader.readAsArrayBuffer(file);
    });

    // Check first bytes to determine file type
    const bytes = new Uint8Array(ab);
    const firstByte = bytes[0];
    console.log('First 4 bytes:', Array.from(bytes.slice(0, 4)).map(b => b.toString(16)).join(' '));
    // Log first 200 chars as text
    const decoder = new TextDecoder('utf-8');
    const preview = decoder.decode(bytes.slice(0, 200));
    console.log('File preview (first 200 chars):', preview);

    let workbook;
    if (firstByte === 0x3c) {
      // Starts with '<' - could be HTML, XML, or SpreadsheetML
      console.log('Detected text-based file starting with <');
      const textContent = decoder.decode(ab);
      // Try reading as string
      try {
        workbook = XLSX.read(textContent, {type: 'string'});
      } catch (e1) {
        console.log('String read failed, trying base64...');
        // Try base64
        let binary = '';
        for (let i = 0; i < bytes.length; i++) {
          binary += String.fromCharCode(bytes[i]);
        }
        workbook = XLSX.read(btoa(binary), {type: 'base64'});
      }
    } else {
      workbook = XLSX.read(ab, {type: 'array', cellStyles: false, bookVBA: false});
    }
    const sheets = [];

    for (const sheetName of workbook.SheetNames) {
      const worksheet = workbook.Sheets[sheetName];
      if (!worksheet) continue;
      const jsonRows = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: '', raw: false});

      if (!jsonRows || jsonRows.length === 0) continue;

      // Find header row
      let headerRowIndex = -1;
      for (let i = 0; i < Math.min(jsonRows.length, 5); i++) {
        const row = jsonRows[i] || [];
        if (row.some(cell => cell && String(cell).includes('Gategory') || cell && String(cell).includes('Category') || cell && String(cell).includes('Check Item'))) {
          headerRowIndex = i;
          break;
        }
      }
      if (headerRowIndex === -1) continue;

      const parsedRows = [];
      let currentProcessName = '';

      for (let i = headerRowIndex + 1; i < jsonRows.length; i++) {
        const row = jsonRows[i] || [];
        const processName = String(row[0] || '').trim();
        const category = String(row[1] || '').trim();
        const no = String(row[2] || '').trim();
        const grade = String(row[3] || '').trim();
        const checkItem = String(row[4] || '').trim();
        const checkMethod = String(row[5] || '').trim();
        const cycle = String(row[6] || '').trim();
        const actionMethod = String(row[7] || '').trim();
        const remark = String(row[8] || '').trim();

        if (!checkItem && !category && !no) continue;
        if (processName) currentProcessName = processName;

        parsedRows.push({processName: currentProcessName, category, no, grade, checkItem, checkMethod, cycle, actionMethod, remark});
      }

      if (parsedRows.length > 0) {
        sheets.push({sheetName, displayName: sheetName, rows: parsedRows});
      }
    }
    return sheets;
  },

  async saveToDB(sheets) {
    await DB.deleteAllProcesses();
    let totalItems = 0;

    for (const sheet of sheets) {
      const processId = await DB.insertProcess(sheet.sheetName, sheet.displayName, sheet.rows.length);
      for (const row of sheet.rows) {
        await DB.insertChecklistItem({
          processId,
          category: row.category,
          no: row.no,
          grade: row.grade,
          checkItem: row.checkItem,
          checkMethod: row.checkMethod,
          cycle: row.cycle,
          actionMethod: row.actionMethod,
          remark: row.remark,
        });
        totalItems++;
      }
    }
    return {processCount: sheets.length, itemCount: totalItems};
  },

  exportInspection(data, fileName) {
    const ws = XLSX.utils.aoa_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, I18N.t('excelFileName'));
    ExcelParser.downloadWorkbook(wb, fileName);
  },

  // 모바일 호환 파일 다운로드 헬퍼
  // XLSX.writeFile()는 iOS Safari 등에서 동작하지 않으므로 Blob 기반 다운로드 사용
  // ===== Capacitor 네이티브 환경 감지 =====
  // 모바일 APK(Capacitor)에서 실행 중인지 확인
  _isCapacitorNative() {
    try {
      return typeof window !== 'undefined' && window.Capacitor &&
        typeof window.Capacitor.isNativePlatform === 'function' &&
        window.Capacitor.isNativePlatform();
    } catch (e) { return false; }
  },

  // ===== 모바일 기기 저장소에 파일 저장 =====
  // 저장 위치: /storage/emulated/0/Android/data/com.pba.checklist/files/
  // (파일 탐색기에서 접근 가능, Scoped Storage로 별도 권한 불필요)
  //
  // - 바이너리(XLSX): base64 문자열 전달 + encoding 생략 → 자동 base64 디코딩 후 바이트 기록
  // - 텍스트(HTML): 원본 문자열 전달 + encoding 'utf8' → UTF-8 텍스트로 기록
  // 반환값: 사용자에게 보여줄 파일의 file:// 전체 경로
  async _saveToCapacitor(data, fileName, isText) {
    const Filesystem = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem;
    if (!Filesystem) throw new Error(I18N.t('fsPluginError'));
    const opts = {
      path: fileName,
      data: data,
      directory: 'EXTERNAL',   // 앱 전용 외부 저장소 (사용자 접근 가능, 권한 불필요)
      recursive: true
    };
    if (isText) opts.encoding = 'utf8';
    // encoding 생략 시 data는 base64로 간주되어 바이너리로 기록됨
    await Filesystem.writeFile(opts);
    // 사용자에게 보여줄 전체 경로 획득
    let displayPath = '';
    try {
      const uriRes = await Filesystem.getUri({ path: fileName, directory: 'EXTERNAL' });
      displayPath = uriRes.uri || '';
    } catch (e) {
      console.warn('[Download] getUri 실패:', e);
    }
    return displayPath;
  },

  // ===== 저장 후 이메일/메신저 공유 제안 =====
  // Share 플러그인으로 file:// URI를 전달 → 이메일/카카오톡/Google Drive 등 선택 가능
  async _offerShare(uri) {
    const Share = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share;
    if (!Share) return false;
    try {
      await Share.share({
        title: 'PBA ' + I18N.t('excelFileName'),
        dialogTitle: I18N.t('fileShare'),
        files: [uri]
      });
      return true;
    } catch (e) {
      console.warn('[Download] 공유 취소 또는 실패:', e && e.message);
      return false;
    }
  },

  // 모바일 호환 파일 다운로드 헬퍼
  // - PC/Electron: XLSX.writeFile()
  // - 모바일 APK(Capacitor): 기기 저장소에 저장 + 경로 안내 + 공유 제안
  // - 일반 웹 브라우저: Blob + <a download>
  downloadWorkbook(wb, fileName) {
    try {
      // 1) PC/Electron 환경: 파일 시스템에 직접 저장
      const isElectron = typeof window !== 'undefined' && window.fileAPI && window.fileAPI.isElectron;
      if (isElectron) {
        XLSX.writeFile(wb, fileName);
        return;
      }
      // 2) 모바일 네이티브(Capacitor APK): 기기 저장소에 저장
      if (ExcelParser._isCapacitorNative()) {
        const base64 = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
        ExcelParser._saveToCapacitor(base64, fileName, false)
          .then(async (uri) => {
            const share = confirm(
              I18N.t('excelSaved') +
              I18N.t('saveLocation') + uri + '\n\n' +
              I18N.t('fileExplorerPath') +
              I18N.t('sharePrompt')
            );
            if (share) await ExcelParser._offerShare(uri);
          })
          .catch((err) => {
            console.error('[Download] Capacitor 저장 실패:', err);
            alert(I18N.t('saveFail') + (err && err.message ? err.message : err));
          });
        return;
      }
      // 3) 일반 웹 브라우저: Blob 기반 다운로드
      const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      const blob = new Blob([wbout], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 100);
    } catch (e) {
      console.error('Download error:', e);
      // 폴백: XLSX.writeFile 재시도
      try {
        XLSX.writeFile(wb, fileName);
      } catch (e2) {
        console.error('Fallback download also failed:', e2);
        alert(I18N.t('downloadFailBrowser'));
      }
    }
  },

  // ArrayBuffer/Uint8Array → base64 (Capacitor 바이너리 저장용)
  _arrayBufferToBase64(buffer) {
    const bytes = buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer);
    let binary = '';
    const CHUNK = 0x8000;
    for (let i = 0; i < bytes.length; i += CHUNK) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    }
    return btoa(binary);
  },

  // ExcelJS 등에서 생성한 xlsx 바이너리(ArrayBuffer)를 저장하는 헬퍼
  // - 모바일 APK(Capacitor): 기기 저장소에 저장 + 경로 안내 + 공유 제안
  // - PC/Electron 및 일반 웹 브라우저: Blob + <a download>
  downloadXlsxBuffer(wbout, fileName) {
    try {
      // 1) 모바일 네이티브(Capacitor APK): 기기 저장소에 저장
      if (ExcelParser._isCapacitorNative()) {
        const base64 = ExcelParser._arrayBufferToBase64(wbout);
        ExcelParser._saveToCapacitor(base64, fileName, false)
          .then(async (uri) => {
            const share = confirm(
              I18N.t('excelSaved') +
              I18N.t('saveLocation') + uri + '\n\n' +
              I18N.t('fileExplorerPath') +
              I18N.t('sharePrompt')
            );
            if (share) await ExcelParser._offerShare(uri);
          })
          .catch((err) => {
            console.error('[Download] Capacitor 저장 실패:', err);
            alert(I18N.t('saveFail') + (err && err.message ? err.message : err));
          });
        return;
      }
      // 2) PC/Electron 및 일반 웹 브라우저: Blob 기반 다운로드
      const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 100);
    } catch (e) {
      console.error('[Download] xlsx buffer download error:', e);
      alert(I18N.t('downloadFailBrowser'));
    }
  },


  // HTML 파일 다운로드 헬퍼 (사진 리포트 등)
  downloadHTML(htmlContent, fileName) {
    try {
      // 모바일 네이티브(Capacitor APK): 기기 저장소에 저장
      if (ExcelParser._isCapacitorNative()) {
        ExcelParser._saveToCapacitor(htmlContent, fileName, true)
          .then(async (uri) => {
            const share = confirm(
              I18N.t('htmlSaved') +
              I18N.t('saveLocation') + uri + '\n\n' +
              I18N.t('sharePrompt')
            );
            if (share) await ExcelParser._offerShare(uri);
          })
          .catch((err) => {
            console.error('[Download] Capacitor HTML 저장 실패:', err);
            alert(I18N.t('saveFail') + (err && err.message ? err.message : err));
          });
        return;
      }
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 100);
    } catch (e) {
      console.error('HTML download error:', e);
      alert(I18N.t('downloadFail'));
    }
  },

  // CSV 파일 다운로드 헬퍼
  // - PC/Electron: 파일 시스템에 직접 저장
  // - 모바일 APK(Capacitor): 기기 저장소에 저장 + 경로 안내 + 공유 제안
  // - 일반 웹 브라우저: Blob + <a download>
  // csvContent: UTF-8 텍스트 (BOM 포함 권장 - 한글 Excel 호환)
  downloadCSV(csvContent, fileName) {
    try {
      // PC/Electron 환경: 파일 시스템에 직접 저장
      const isElectron = typeof window !== 'undefined' && window.fileAPI && window.fileAPI.isElectron;
      if (isElectron) {
        // Electron은 Blob URL 방식으로 처리 (FileSaver 미사용 환경 대응)
        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 100);
        return;
      }
      // 모바일 네이티브(Capacitor APK): 기기 저장소에 저장
      if (ExcelParser._isCapacitorNative()) {
        // 한글 Excel 호환성을 위해 UTF-8 BOM 추가
        const csvWithBom = '\uFEFF' + csvContent;
        ExcelParser._saveToCapacitor(csvWithBom, fileName, true)
          .then(async (uri) => {
            const share = confirm(
              I18N.t('csvSaved') +
              I18N.t('saveLocation') + uri + '\n\n' +
              I18N.t('fileExplorerPath') +
              I18N.t('sharePrompt')
            );
            if (share) await ExcelParser._offerShare(uri);
          })
          .catch((err) => {
            console.error('[Download] Capacitor CSV 저장 실패:', err);
            alert(I18N.t('saveFail') + (err && err.message ? err.message : err));
          });
        return;
      }
      // 일반 웹 브라우저: Blob 기반 다운로드
      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 100);
    } catch (e) {
      console.error('CSV download error:', e);
      alert(I18N.t('csvDownloadFail'));
    }
  },
};

// ===== Electron: native alert/confirm 후 키보드 포커스 복원 =====
// Electron의 window.alert()/window.confirm()은 네이티브 다이얼로그를 띄우며,
// 다이얼로그 닫은 후 렌더러의 키보드 포커스가 복원되지 않아
// 입력 필드(비밀번호, 비고 등)에 키보드 입력이 안 되는 현상 방지
(function () {
  if (typeof window === 'undefined' || !window.fileAPI || !window.fileAPI.isElectron) return;

  var _nativeAlert = window.alert.bind(window);
  var _nativeConfirm = window.confirm.bind(window);

  function restoreFocus(prevActive) {
    try { window.fileAPI.focusWebContents(); } catch (e) { /* noop */ }
    setTimeout(function () {
      if (prevActive && typeof prevActive.focus === 'function' && document.contains(prevActive)) {
        prevActive.focus();
      }
    }, 50);
  }

  window.alert = function (msg) {
    var prev = document.activeElement;
    _nativeAlert(msg);
    restoreFocus(prev);
  };

  window.confirm = function (msg) {
    var prev = document.activeElement;
    var result = _nativeConfirm(msg);
    restoreFocus(prev);
    return result;
  };
})();

const App = {
  screenHistory: [],
  currentScreen: null,
  currentParams: {},

  async init() {
    try {
      // 언어 설정 로드 (localStorage → 이후 DB 동기화)
      if (typeof I18N !== 'undefined') I18N.init();

      // file:// 프로토콜 환경 감지 (모바일에서 HTML 파일 직접 실행 시)
      if (window.location.protocol === 'file:') {
        console.warn('[App] file:// 프로토콜로 실행 중 - 일부 기능이 제한될 수 있습니다.');
        this._isFileProtocol = true;
      }

      await DB.init();
      console.log('DB initialized');

      // 과거 점검 기록 보정: naCount/holdCount가 없는 기록을 inspectionResults에서 재계산
      // (합격률 = 합격 ÷ (전체 − 해당없음) 정확 계산용)
      DB.backfillInspectionCounts().catch(e => console.error('[App] 기록 보정 실패:', e));

      // DB에 저장된 언어가 있으면 우선 적용
      if (typeof I18N !== 'undefined') {
        await I18N.syncFromDB();
        document.documentElement.setAttribute('lang', I18N.current);
      }
       
      // Load checklist data from hardcoded source
      await ChecklistData.loadToDB();
      console.log('Checklist data loaded');

      // 재시작 후 현재 언어의 체크리스트 데이터 유지
      // - loadToDB는 한국어 마스터 기준으로 로드하므로, 비한국어 언어이면 재적용
      // - applyChecklistLang이 미완성 언어(th/es/vi 등)는 영어로 자동 대체
      if (typeof I18N !== 'undefined' && I18N.current && I18N.current !== 'ko' && !DB._isServerMode) {
        try {
          try { await window.ensureChecklistLang(I18N.current); } catch (e) { console.warn('[I18N] lang preload failed:', e.message); }
          await I18N.applyChecklistLang(I18N.current);
          console.log('[App] checklist data re-applied for language:', I18N.current);
        } catch (e) {
          console.warn('[App] checklist lang apply failed:', e);
        }
      }
      
      // Electron 환경에서는 파일에서 데이터 복원
      try {
        const isElectron = typeof window !== 'undefined' && window.fileAPI && window.fileAPI.isElectron;
        if (isElectron) {
          // 1. 설정 복원 (IndexedDB가 비어있거나 메모리 모드인 경우)
          const settings = await DB.getSettings();
          if (!settings.partnerName && !settings.factoryName) {
            console.log('[App] IndexedDB에 설정이 없음 - 파일에서 복원 시도');
            const restoreSettings = await DB.restoreSettingsFromFile();
            if (restoreSettings.success) {
              console.log('[App] 설정 복원 성공 (파일)');
            }
          }

          // 2. Lines 복원
          const lines = await DB.getAllLines();
          if (!lines || lines.length === 0) {
            const restoreLines = await DB.restoreLinesFromFile();
            if (restoreLines.success) {
              console.log('[App] Lines 복원 성공 (파일):', restoreLines.count, '개');
            }
          }

          // 3. Users 복원
          const users = await DB.getAllUsers();
          if (!users || users.length === 0) {
            const restoreUsers = await DB.restoreUsersFromFile();
            if (restoreUsers.success) {
              console.log('[App] Users 복원 성공 (파일):', restoreUsers.count, '개');
            }
          }

          // 4. 누적 점검 데이터 복원
          const restoreResult = await DB.restoreCumulativeInspections();
          if (restoreResult.success && restoreResult.added > 0) {
            console.log(`복원됨: ${restoreResult.added}개 점검 데이터`);
          } else {
            console.log('No cumulative data to restore or none added');
          }
        } else {
          console.log('Not Electron environment, skipping restore');
          // 모바일(Capacitor APK): 앱 삭제 후 재설치 시 내부 저장소가 초기화되므로
          // 공용 문서 폴더의 자동 백업 파일이 있으면 자동 복원
          try {
            const restored = await DB.mobileRestoreIfNeeded();
            if (restored) {
              console.log('[App] 모바일 자동 백업에서 데이터 복원됨');
            }
          } catch (e) {
            console.warn('Mobile auto restore error:', e);
          }
        }
      } catch (e) {
        console.error('Auto restore error:', e);
      }
      
      this.navigate('home');

      // 첫 실행 직후 홈 화면이 글자/카드 크기가 어긋난 채 그려지는 현상 보정
      // (확장모드 전환 시 같은 화면을 다시 그리면 정상으로 보이는 것을 확인)
      // 홈 화면은 입력값이 없으므로 한 번 다시 그려도 잃을 내용이 없음
      // 서버 모드에서 초기 렌더가 비는 경우 재시도 (App 명시 참조)
      [600, 1500, 3000, 5000].forEach((ms) => setTimeout(() => {
        const c = document.getElementById('screenContainer');
        if (App.currentScreen === 'home' && c && !c.innerHTML.trim()) {
          console.log('[App] retry render @' + ms + 'ms');
          App.render();
        }
      }, ms));

      // 헤더 좌측상단에 버전 정보 표시 (BUILD_INFO 기반)
      this._renderVersionBadge();

      // file:// 환경 경고 표시 (홈 화면 렌더링 후)
      if (this._isFileProtocol) {
        setTimeout(() => {
          this._showFileProtocolWarning();
        }, 500);
      }
    } catch (err) {
      console.error('App init error:', err);
      console.error('App init error stack:', err.stack);
      document.getElementById('screenContainer').innerHTML = 
        '<div class="empty-state">' + I18N.t('initError') + err.message + '<br><br><small style="color:#999;">' + (err.stack || '') + '</small></div>';
    }
  },

  _renderVersionBadge() {
    try {
      const badge = document.getElementById('versionBadge');
      if (!badge) return;
      const hasInfo = typeof BUILD_INFO !== 'undefined' && BUILD_INFO;
      const version = (hasInfo && BUILD_INFO.version) ? BUILD_INFO.version : '1.0.0';
      const buildDate = (hasInfo && BUILD_INFO.buildDate) ? BUILD_INFO.buildDate : '';
      // buildDate 형식: '2026-10-01 15:03' -> 날짜만 추출
      const dateShort = buildDate ? buildDate.split(' ')[0].slice(0, 10) : '';
      badge.textContent = dateShort ? `v${version} · ${dateShort}` : `v${version}`;
    } catch (e) {
      console.warn('version badge render error:', e);
    }
  },

  _showFileProtocolWarning() {
    // 이미 경고가 표시되어 있으면 중복 표시 안 함
    if (document.getElementById('fileProtocolWarning')) return;

    const isElectron = typeof window !== 'undefined' && window.fileAPI && window.fileAPI.isElectron;
    if (isElectron) return; // Electron 환경에서는 표시 안 함

    const banner = document.createElement('div');
    banner.id = 'fileProtocolWarning';
    banner.style.cssText = 'background:#fff3e0;border:1px solid #ffcc80;color:#e65100;padding:10px 15px;font-size:13px;border-radius:8px;margin:10px;line-height:20px;';
    banner.innerHTML = `
      ${I18N.t('localFileModeTitle')}
      ${I18N.t('localFileModeDesc')}
      ${DB.SERVER_MODE_ENABLED ? I18N.t('serverModeRecommended') : ''}
      <button style="margin-top:6px;background:#ff9800;color:#fff;border:none;border-radius:4px;padding:4px 12px;font-size:12px;cursor:pointer;" onclick="this.parentElement.remove()">${I18N.t('confirmBtn')}</button>
    `;
    const container = document.getElementById('screenContainer');
    if (container && container.firstChild) {
      container.insertBefore(banner, container.firstChild);
    }
  },




  navigate(screen, params = {}) {
    if (this.currentScreen) {
      this.screenHistory.push({screen: this.currentScreen, params: this.currentParams});
    }
    this.currentScreen = screen;
    this.currentParams = params;
    this._backStateHandler = null; // 화면 변경 시 내부 상태 인터셉터 초기화
    this.render();
  },

  navigateBack() {
    // 화면 내부 상세 상태(협력사 상세 → 목록, Line 상세 → 협력사 상세, Line 펼침 → 접기 등)가
    // 있으면 먼저 되돌린다. 내부 상태가 없을 때만 이전 화면으로 이동.
    if (typeof this._backStateHandler === 'function' && this._backStateHandler()) {
      return;
    }
    if (this.screenHistory.length > 0) {
      const prev = this.screenHistory.pop();
      this.currentScreen = prev.screen;
      this.currentParams = prev.params;
      this._backStateHandler = null;
      this.render();
    }
  },

  replace(screen, params = {}) {
    this.currentScreen = screen;
    this.currentParams = params;
    this.screenHistory = [];
    this._backStateHandler = null;
    this.render();
  },

  // ===== 하드웨어 뒤로가기(갤럭시 내비게이션 바) 처리 =====
  // Android MainActivity.onBackPressed()가 호출하는 진입점(window.__androidBack).
  // 반환값: 'handled'(앱에서 처리함, 종료 안 함) | 'exit'(앱 종료)
  handleAndroidBack() {
    // 1) 열려있는 팝업(모달)이 있으면 닫기
    const modal = document.querySelector('.modal-overlay');
    if (modal) {
      modal.remove();
      return 'handled';
    }
    // 2) 화면 내부 상태 되돌리기(협력사 상세 → 목록, Line 펼침 → 접기 등)
    if (typeof this._backStateHandler === 'function' && this._backStateHandler()) {
      return 'handled';
    }
    // 3) 이전 화면으로 이동
    if (this.screenHistory.length > 0) {
      this.navigateBack();
      return 'handled';
    }
    // 4) 초기 화면: 2초 내 두 번 누르면 종료, 첫 누름은 종료 안내 표시
    const now = Date.now();
    if (this._lastAndroidBackAt && now - this._lastAndroidBackAt < 2000) {
      this._lastAndroidBackAt = 0;
      return 'exit';
    }
    this._lastAndroidBackAt = now;
    this._showBackExitHint();
    return 'handled';
  },

  // 종료 안내 토스트 (앱 하단에 잠깐 표시)
  _showBackExitHint() {
    let toast = document.getElementById('backExitToast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'backExitToast';
      toast.style.cssText = 'position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:99999;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;';
      document.body.appendChild(toast);
    }
    toast.textContent = I18N.t('backExitHint');
    toast.style.opacity = '1';
    clearTimeout(this._backExitToastTimer);
    this._backExitToastTimer = setTimeout(() => { toast.style.opacity = '0'; }, 1800);
  },

  async render() {
    const container = document.getElementById('screenContainer');
    const backBtn = document.getElementById('backBtn');
    const title = document.getElementById('appTitle');

    // Ensure mode toggle button exists
    this.ensureModeToggle();

    const titles = {
      home: () => I18N.t('appName'),
      setup: () => I18N.t('setup'),
      checklist: () => I18N.t('appName'),
      report: () => I18N.t('report'),
      reportDetail: () => I18N.t('reportDetail'),
      admin: () => I18N.t('settings'),
      dashboard: () => I18N.t('dashboard'),
      userManage: () => I18N.t('userManage'),
      dataMerge: () => I18N.t('dataMerge'),
      itemManage: () => I18N.t('itemManage'),
      itemEdit: () => I18N.t('itemEdit'),
      dataReset: () => I18N.t('dataReset'),
      excelUpload: () => I18N.t('excelUpload'),
      lineMapping: () => I18N.t('lineMapping'),
      partnerSummary: () => I18N.t('partnerSummary'),
      backupManage: () => I18N.t('backupManage'),
    };

    const titleFn = titles[this.currentScreen];
    title.textContent = titleFn ? titleFn() : I18N.t('appName');
    backBtn.style.display = this.screenHistory.length > 0 ? 'block' : 'none';
    
    const homeBtn = document.getElementById('homeBtn');
    if (homeBtn) {
      homeBtn.style.display = this.currentScreen !== 'home' ? 'block' : 'none';
    }

    const renderFn = Screens[this.currentScreen];
    if (renderFn) {
      container.innerHTML = '';
      try {
        await renderFn(container, this.currentParams);
      } catch (err) {
        console.error('Render error:', err);
        console.error('Render error stack:', err.stack);
        container.innerHTML = '<div class="empty-state">' + I18N.t('loadError') + err.message + '<br><br><small style="color:#999;">' + (err.stack || '') + '</small></div>';
      }
    }
  },
};

window.fullReset = async function() {
  const confirmed = confirm(I18N.t('resetConfirm1'));
  if (!confirmed) return;

  const confirmed2 = confirm(I18N.t('resetConfirm2'));
  if (!confirmed2) return;

  try {
    await DB.deleteAllProcesses();
    await DB.deleteAllLines();
    await DB.updateSettings('', '', false);

    const inspStore = DB._tx('inspections', 'readwrite');
    inspStore.clear();
    const resultStore = DB._tx('inspectionResults', 'readwrite');
    resultStore.clear();
    const recentStore = DB._tx('recentAccess', 'readwrite');

    const draftStore = DB._tx('drafts', 'readwrite');

    alert(I18N.t('resetDone'));
    App.replace('setup');
  } catch (err) {
    console.error('Full reset error:', err);

  }
};

  try {
    localStorage.setItem('wideMode', isWide);
  } catch (e) {
    console.warn('[App] localStorage 저장 실패:', e.message);

  this.updateModeToggleIcon(isWide);

            `v1.0.0 · Build (${I18N.t('devMode')})`}
        </div>
      </div>
    `;
    return;
  }

  // 종료 처리 — 총괄 모드 홈에서도 사용하므로 모드 분기 이전에 정의
  let _isExiting = false;
  window.exitApp = async function() {
    // 중복 호출 방지 (버튼 클릭 + close 핸들러 동시 실행 대응)
    if (_isExiting) {
      console.log('[exitApp] 이미 종료 중 - 무시');
      return;
    }
    _isExiting = true;

    // Check if there's unsaved data in current checklist screen
    const isOnChecklist = App.currentScreen === 'checklist';

    // Save draft if on checklist screen
    if (isOnChecklist && window.handleSaveDraft) {
      try {
        await window.handleSaveDraft();
      } catch (e) {
        console.error('Save draft error on exit:', e);
      }
    }

    // Electron 환경 감지 (개선된 로직)
    const isElectron = (typeof window !== 'undefined' && window.fileAPI && window.fileAPI.isElectron) ||
                       (typeof window !== 'undefined' && window.process && window.process.type);

    if (isElectron) {
      // Electron 환경: 종료 전 데이터 백업 (설정 + 점검결과를 data/ 폴더에 저장)
      try {
        console.log('[exitApp] 종료 전 백업 실행 중...');
        const backupResult = await DB.backupToFile();
        if (backupResult.success) {
          console.log('[exitApp] 백업 완료 - data 폴더에 저장됨');
        } else {
          console.warn('[exitApp] 백업 실패:', backupResult.error);
        }
      } catch (e) {
        console.error('[exitApp] 백업 중 오류:', e);
      }
      console.log('[exitApp] Electron 환경 - 창 닫기');
      // 실제로 창을 닫음 (main.js의 close 핸들러가 isQuitting 플래그로 중복 호출 방지)
      window.close();
      return;
    }

    // 웹 브라우저 / 모바일 환경: 종료 화면 표시
    const app = document.getElementById('app');
    app.innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f5;padding:20px;">

      </div>
    `;

  try {

        <svg class="reset-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        🌐 ${I18N.t('selectLanguage')} (${I18N.langs.find(l => l.code === I18N.current) ? I18N.langs.find(l => l.code === I18N.current).native : '한국어'})
      </button>
    </div>
    <div style="text-align:center;padding:10px 15px 12px;display:flex;justify-content:center;gap:10px;">
      <button class="reset-btn" onclick="window.fullReset()">
        <svg class="reset-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        ${I18N.t('fullReset')}
      </button>
      <button class="reset-btn" style="color:#666;border-color:#e0e0e0;" onclick="window.exitApp()">
        <svg class="reset-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        ${I18N.t('exit')}
      </button>
    </div>
    <div style="text-align:center;padding:0 15px 12px;font-size:11px;color:#bbb;">
      ${typeof BUILD_INFO !== 'undefined' && BUILD_INFO.buildDate ? 
        `v${BUILD_INFO.version} · Build ${BUILD_INFO.buildDate}` : 
        `v1.0.0 · Build (${I18N.t('devMode')})`}
    </div>
  `;


  container.innerHTML = html;

  // Line selection handler
  window.selectLine = async function(lineId) {
    selectedLineId = lineId;
    // Update active state
    document.querySelectorAll('.line-btn').forEach(btn => {
      btn.classList.toggle('active', parseInt(btn.dataset.lineId) === lineId);
    });
    // Load all processes (active + inactive) with mapping info
    const allProcesses = await DB.getAllProcesses();
    const mappings = await DB.getLineProcessMappings(lineId);
    // Load all checklist items for type-specific counting
    const allChecklistItems = await DB.getAllChecklistItems();
    processes = allProcesses.map(p => {
      const mapping = mappings.find(m => m.processId === p.id);
      const procItems = allChecklistItems.filter(i => i.processId === p.id);
      const dailyCount = procItems.filter(i => i.inspectionType === 'daily').length;
      const monthlyCount = procItems.filter(i => i.inspectionType === 'monthly').length;
      return {
        ...p,
        mappingId: mapping ? mapping.id : null,
        isActive: mapping ? mapping.isActive : false,
        dailyItemCount: dailyCount,
        monthlyItemCount: monthlyCount,
      };
    });
    renderProcesses();
  };

  // 점검 유형 전환
  window.selectInspectionType = function(type) {
    selectedInspectionType = type;
    renderProcesses();
  };

  function renderProcesses() {
    const section = document.getElementById('processSection');
    const line = lines.find(l => l.id === selectedLineId);
    if (processes.length === 0) {
      section.innerHTML = `
        <div class="section">
          <div class="section-title">${I18N.t('selectProcess')}</div>
          <div class="empty-state">${I18N.t('noProcesses')}</div>
        </div>
      `;
      return;
    }

    // 선택한 점검 유형의 항목이 있는 공정만 필터링
    const filteredProcesses = processes.filter(p => {
      const count = selectedInspectionType === 'daily' ? (p.dailyItemCount || 0) : (p.monthlyItemCount || 0);
      return count > 0;
    });

    // Calculate Line progress (선택한 유형 기준)
    const activeProcs = filteredProcesses.filter(p => p.isActive);
    // 일반 점검·정밀점검 모두 당월(1일~말일) 기준으로 완료 여부 판단
    const periodInspections = monthInspections;
    const lineCompleted = activeProcs.filter(p =>
      periodInspections.some(i =>
        i.lineName === (line ? line.name : '') &&
        i.processName === p.name &&
        (i.inspectionType || 'daily') === selectedInspectionType
      )
    ).length;
    const lineTotal = activeProcs.length;
    const linePercent = lineTotal > 0 ? Math.round((lineCompleted / lineTotal) * 100) : 0;

    const typeLabel = selectedInspectionType === 'daily' ? I18N.t('dailyShort') : I18N.t('monthlyShort');

    section.innerHTML = `
      <div class="section">
        <div class="section-title">
          <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          ${typeLabel} ${I18N.t('selectProcess')} (Line ${line ? line.name : ''})
        </div>

        <!-- 일반 점검 / 정밀점검 전환 (정밀점검은 특별한 경우에만 실시) -->
        ${selectedInspectionType === 'daily' ? `
        <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
          <button style="padding:8px 14px;border-radius:8px;border:2px solid #ff9800;background:#fff;color:#ff9800;font-size:13px;font-weight:bold;cursor:pointer;" onclick="selectInspectionType('monthly')">
            ${I18N.t('monthlyQuarterly')}
          </button>
        </div>
        ` : `
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;">
          <button style="align-self:flex-start;padding:8px 14px;border-radius:8px;border:2px solid #2196F3;background:#fff;color:#2196F3;font-size:13px;font-weight:bold;cursor:pointer;" onclick="selectInspectionType('daily')">${I18N.t('backToRoutine')}</button>
          <div style="font-size:12px;color:#888;line-height:18px;">${I18N.t('precisionNote')}</div>
        </div>
        ` }

        ${selectedInspectionType === 'daily' ? `
        <!-- Line Progress -->
        <div class="progress-bar" style="border-radius:10px;margin-bottom:12px;">
          <div class="progress-header">
            <span class="progress-main-text">${I18N.t('progressFmt', typeLabel, String(lineCompleted), String(lineTotal), String(linePercent))}</span>
            <div class="progressbar-track"><div class="progressbar-fill" style="width:${linePercent}%"></div></div>
          </div>
        </div>
        ` : ''}

        ${filteredProcesses.length === 0 ? `
          <div class="empty-state">${typeLabel} ${I18N.t('noChecklistItems')}</div>
        ` : `<div class="process-list">` + filteredProcesses.map(p => {
          // 이 공정의 당월 점검 기록 중 최신 기록 → 완료 배지에 일자·주차 표시
          const procInsps = periodInspections.filter(i =>
            i.lineName === (line ? line.name : '') &&
            i.processName === p.name &&
            (i.inspectionType || 'daily') === selectedInspectionType
          );
          const doneRec = procInsps.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''))[0];
          const isDone = selectedInspectionType === 'daily' && !!doneRec;
          let doneInfo = '';
          if (doneRec && doneRec.date) {
            const dd = new Date(doneRec.date + 'T00:00:00');
            if (!isNaN(dd)) {
              const mm = String(dd.getMonth() + 1).padStart(2, '0');
              const dd2 = String(dd.getDate()).padStart(2, '0');
              doneInfo = `${mm}/${dd2} · ${I18N.t('monthWeekFmt', String(dd.getMonth() + 1), String(getWeekOfMonth(dd)))}`;
            }
          }
          const itemCount = selectedInspectionType === 'daily' ? (p.dailyItemCount || 0) : (p.monthlyItemCount || 0);
          const statusBadge = !(selectedInspectionType === 'daily') ? '' : p.isActive
            ? (isDone
              ? `<span class="process-status-badge" style="background:#e8f5e9;color:#43a047;">✓ ${I18N.t('done')}${doneInfo ? ` · ${doneInfo}` : ''}</span>`
              : `<span class="process-status-badge" style="background:#fff3e0;color:#ff9800;">${I18N.t('notInspected')}</span>`)
            : '';
          return `
          <div class="process-card ${!p.isActive ? 'process-card-inactive' : ''} ${isDone ? 'process-card-done' : ''}" ${p.isActive ? `onclick="App.navigate('checklist', {lineId:${selectedLineId}, lineName:'${line ? line.name : ''}', processId:${p.id}, processName:'${p.name}', inspectionType:'${selectedInspectionType}', isDone: ${isDone}})"` : ''}>
            <div class="process-card-inner">
              <div class="process-icon-wrapper" style="${!p.isActive ? 'background:#f0f0f0;' : isDone ? 'background:#e8f5e9;' : ''}">
                <svg class="process-icon" style="${!p.isActive ? 'color:#bbb;' : isDone ? 'color:#43a047;' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
              </div>
              <div class="process-card-content">
                <div class="process-name" style="${!p.isActive ? 'color:#999;' : ''}">${p.displayName}</div>
                <div class="process-count">${I18N.t('processCount')}: ${itemCount} ${statusBadge}</div>
              </div>
              <div class="toggle-safe-zone" onclick="event.stopPropagation();">
                <button class="toggle-switch ${p.isActive ? 'active' : ''}" data-mapping-id="${p.mappingId || ''}" data-process-id="${p.id}" data-is-active="${p.isActive}" onclick="event.stopPropagation(); event.preventDefault(); requestToggleProcess(${p.mappingId || 'null'}, ${p.id}, ${selectedLineId})">
                  <div class="toggle-knob"></div>
                </button>
              </div>
            </div>
          </div>
        `;}).join('') + `</div>`}
      </div>
    `;

    // Bind toggle switches
    document.querySelectorAll('.toggle-switch[data-mapping-id]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
      });
    });
  }

  // User selector modal
  window.showUserSelector = function() {
    if (users.length === 0) {
      alert(I18N.t('noUsers'));
      return;
    }

    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
      <div class="modal-content" style="max-width:340px;">
        <button class="modal-close-btn" onclick="this.closest('.modal-overlay').remove()">✕</button>
        <div class="modal-title" style="font-size:18px;color:#2196F3;">${I18N.t('selectInspectorTitle')}</div>
        <div style="max-height:300px;overflow-y:auto;margin:10px 0;">
          ${users.map(u => `
            <div style="display:flex;align-items:center;gap:10px;padding:10px;border:1px solid #eee;border-radius:8px;margin-bottom:6px;cursor:pointer;" onclick="selectUser(${u.id})">
              <div style="width:36px;height:36px;border-radius:50%;background:${u.role === 'admin' ? '#e53935' : '#2196F3'};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;">
                ${u.name.charAt(0)}
              </div>
              <div>
                <div style="font-weight:700;font-size:14px;">${u.name}</div>
                <div style="font-size:11px;color:${u.role === 'admin' ? '#e53935' : '#2196F3'};">
                  ${u.role === 'admin' ? I18N.t('roleAdmin') : I18N.t('roleInspector')}
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    document.body.appendChild(modal);
  };

  window.selectUser = async function(userId) {
    const user = users.find(u => u.id === userId);
    if (!user) return;
    await DB.setCurrentUser(user);
    const modal = document.querySelector('.modal-overlay');
    if (modal) modal.remove();
    App.replace('home');
  };

  window.deleteDraft = async function(draftKey) {
    if (!confirm(I18N.t('deleteDraftConfirm'))) return;
    await DB.deleteDraft(draftKey);
    App.replace('home');
  };

  // ON/OFF 스위치: 이 화면 방문 중 첫 변경에만 비밀번호 확인, 이후에는 바로 적용
  window.requestToggleProcess = function(mappingId, processId, lineId) {
    if (homeAdminUnlocked) { window.toggleProcessActive(mappingId, processId, lineId); return; }
    checkAdminPassword(() => {
      homeAdminUnlocked = true;
      window.toggleProcessActive(mappingId, processId, lineId);
    });
  };

  window.toggleProcessActive = async function(mappingId, processId, lineId) {
    const process = processes.find(p => p.id === processId);
    if (!process) return;
    const newActive = !process.isActive;

    if (mappingId) {
      // Update existing mapping
      await DB.updateLineProcessMapping(mappingId, newActive);
    } else {
      // Create new mapping (defaults to active=true)
      const store = DB._tx('lineProcessMapping', 'readwrite');
      await DB._request(store.add({lineId, processId, isActive: true}));
      // If we need it inactive, update it
      if (!newActive) {
        const mappings = await DB.getLineProcessMappings(lineId);
        const newMapping = mappings.find(m => m.processId === processId);
        if (newMapping) {
          await DB.updateLineProcessMapping(newMapping.id, false);
        }
      }
    }

    // Reload processes
    await window.selectLine(lineId);
  };
};

          <svg class="reset-btn-full-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>

    // 총괄 모드에서는 협력사명/공장명/라인 설정 숨김
    const fields = document.getElementById('inspectionModeFields');
    if (fields) fields.style.display = isMonitor ? 'none' : '';
    // 총괄 모드에서는 사용자 등록/임시저장 자동 저장 숨김 (점검 기능이 없으므로)
    const userReg = document.getElementById('userRegSection');
    if (userReg) userReg.style.display = isMonitor ? 'none' : '';

  // 초기 모드 상태 적용
  window.selectSetupMode(setupMode);

  document.getElementById('lineCount').addEventListener('input', renderLineInputs);
  renderLineInputs();

  // Auto save draft toggle
  let autoSaveDraft = settings.autoSaveDraft || false;
  window.toggleAutoSaveDraft = function() {
    autoSaveDraft = !autoSaveDraft;
    const toggle = document.getElementById('autoSaveDraftToggle');
    if (toggle) toggle.classList.toggle('active', autoSaveDraft);
